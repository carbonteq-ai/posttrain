schema_version = 1
profile_id = "online-rl-verl-py313"
job_kind = "online-rl"
release_status = "blocked"
control_python = "3.12"
backend_python = "3.13.12"
control_virtual_env = "/opt/posttrain/venv"
backend_virtual_env = "/opt/posttrain-verl"
backend_working_directory = "/opt/posttrain-verl/workdir"
backend_projection_path = "/opt/posttrain-verl/projection"
backend_pythonpath_variable = "POSTTRAIN_VERL_PYTHONPATH"
backend_worker_module = "posttrain.train.backends.verl.worker"
control_environment_lock_path = "locks/runtime.control.requirements.txt"
backend_environment_lock_path = "locks/runtime.backend.requirements.txt"
backend_dependency_lock_path = "/opt/posttrain-verl/release/uv.lock"
source_repository = "https://github.com/carbonteq-ai/verl.git"
upstream_revision = "a35908ca3c9632859c58d6a2855d858918ae21dc"

# The fork commit is now published, but the dependency-only backend lock and
# image/runtime qualification are still open. `dependency_lock_sha256` remains
# empty so the release gate stays blocked until the clean backend closure exists.
fork_revision = "1dcdf67e9473db5297c98c9c88cf4dae6c4a8932"
dependency_lock_sha256 = ""

[dependencies]
torch = "2.11.0+cu130"
transformers = "5.14.1"
vllm = "0.25.1"
ray = "2.56.1"
tensordict = "0.10.0"
verifiers_revision = "284a868d6a9022109b749710672a0460e8a996d4"

[worker_projection]
# These are namespace-package source projections, not a second installation of
# the Python 3.12 framework distributions. Their external dependencies are
# owned by the independently locked Python 3.13 kind environment.
packages = ["common", "data", "train"]
