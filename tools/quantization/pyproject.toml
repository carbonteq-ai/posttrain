[project]
name = "posttrain-awq-runtime"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "carbonteq-trackio @ https://pypi.lan/carbonteq/dev/+f/78e/3ecf207c074c4/carbonteq_trackio-0.31.5.post14.dev32-py3-none-any.whl#sha256=78e3ecf207c074c43281edff75343086bf379a22cc281308cc12436e5a5260a3",
    "datasets>=4.8.4,<5",
    "llmcompressor @ git+https://github.com/vllm-project/llm-compressor.git@655b83d1240c37920a603b747bbfb6c218f66383",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "torch>=2.13,<2.14",
    "transformers>=5.9,<5.15",
]

[tool.uv]
system-certs = true

[tool.uv.sources]
torch = { url = "https://download-r2.pytorch.org/whl/cu130/torch-2.13.0%2Bcu130-cp313-cp313-manylinux_2_28_x86_64.whl" }

[[tool.uv.index]]
name = "carbonteq-stable"
url = "https://pypi.lan/carbonteq/stable/+simple/"
explicit = true

[[tool.uv.index]]
name = "carbonteq-dev"
url = "https://pypi.lan/carbonteq/dev/+simple/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
