[project]
name = "posttrain-awq-runtime"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "carbonteq-trackio @ https://pypi.lan/carbonteq/dev/+f/553/42622ccd256f6/carbonteq_trackio-0.31.5.post14.dev35-py3-none-any.whl#sha256=55342622ccd256f6d5a64bb500d568ddbb5b4c14ba060e4457c255237d1e426e",
    "datasets>=4.8.4,<5",
    # Qwen3.5 calibration forward passes use these Triton Gated DeltaNet kernels.
    "fla-core>=0.5.2,<0.6",
    # Exported to transform.lock.txt without index URLs, so internal wheels use immutable direct references.
    "causal-conv1d @ https://pypi.lan/carbonteq/dev/+f/b69/f39142ac88cac/causal_conv1d-1.7.0+cu130torch2.13-cp313-cp313-linux_x86_64.whl#sha256=b69f39142ac88cac91cba5f954cb616c50bc49933cd84f349319420470a4947a ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "llmcompressor @ git+https://github.com/vllm-project/llm-compressor.git@655b83d1240c37920a603b747bbfb6c218f66383",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "torch>=2.13,<2.14",
    "transformers>=5.9,<5.15",
]

[tool.uv]
system-certs = true

[tool.uv.sources]
torch = { url = "https://download-r2.pytorch.org/whl/cu130/torch-2.13.0%2Bcu130-cp313-cp313-manylinux_2_28_x86_64.whl" }

[[tool.uv.index]]
name = "carbonteq-stable"
url = "https://pypi.lan/carbonteq/stable/+simple/"
explicit = true

[[tool.uv.index]]
name = "carbonteq-dev"
url = "https://pypi.lan/carbonteq/dev/+simple/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
