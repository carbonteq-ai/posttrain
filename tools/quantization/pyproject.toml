[project]
name = "posttrain-awq-runtime"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "carbonteq-trackio @ https://pypi.lan/carbonteq/dev/+f/046/0ba6a4d531595/carbonteq_trackio-0.31.5.post14.dev23-py3-none-any.whl#sha256=0460ba6a4d531595a1caba1c6d340f13d4ba490be149308138b695b0a03512a6",
    "datasets>=4.8.4,<5",
    "llmcompressor @ git+https://github.com/vllm-project/llm-compressor.git@655b83d1240c37920a603b747bbfb6c218f66383",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "torch==2.11.0",
    "transformers>=5.9,<5.15",
]

[tool.uv]
system-certs = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "carbonteq-stable"
url = "https://pypi.lan/carbonteq/stable/+simple/"
explicit = true

[[tool.uv.index]]
name = "carbonteq-dev"
url = "https://pypi.lan/carbonteq/dev/+simple/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
