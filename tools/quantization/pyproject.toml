[project]
name = "posttrain-awq-runtime"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "carbonteq-trackio==0.31.5.post14.dev19",
    "datasets>=4.8.4,<5",
    "llmcompressor @ git+https://github.com/vllm-project/llm-compressor.git@655b83d1240c37920a603b747bbfb6c218f66383",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "torch==2.11.0",
    "transformers>=5.9,<5.15",
]

[tool.uv.sources]
carbonteq-trackio = { index = "carbonteq-stable" }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "carbonteq-stable"
url = "https://pypi.lan/carbonteq/stable/+simple/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
