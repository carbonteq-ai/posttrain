schema_version: 1
id: general-smoke-v1
evaluation_kind: general
defaults:
  num_tasks: 8
  num_rollouts: 1
  max_concurrent: 4
  sampling:
    temperature: 0.0
    max_tokens: 2048
  timeout:
    setup: 120
    rollout: 180
    finalize: 60
    scoring: 120
  harness:
    id: "null"
    runtime:
      type: subprocess
environments:
  - id: math-gsm8k
    category: math_reasoning
    taskset:
      id: gsm8k-v1
      split: test
    sampling:
      temperature: 0.0
      max_tokens: 4096
    source:
      repository: https://github.com/PrimeIntellect-ai/verifiers
      revision: 284a868d6a9022109b749710672a0460e8a996d4
      subdirectory: environments/gsm8k_v1

  - id: instruction-reverse-text
    category: instruction_following
    taskset:
      id: reverse-text-v1
      dataset_name: PrimeIntellect/Reverse-Text-RL
      dataset_split: train
    sampling:
      temperature: 0.0
      max_tokens: 1024
    source:
      repository: https://github.com/PrimeIntellect-ai/verifiers
      revision: 284a868d6a9022109b749710672a0460e8a996d4
      subdirectory: environments/reverse_text_v1

  - id: code-execution
    category: code_generation
    taskset:
      id: code-golf-v1
    harness:
      id: "null"
      runtime:
        type: docker
        image: lab/verifiers-runtime:vf-284a868d
    num_tasks: 3
    num_rollouts: 2
    max_concurrent: 1
    sampling:
      temperature: 0.0
      max_tokens: 4096
    source:
      repository: https://github.com/PrimeIntellect-ai/verifiers
      revision: 284a868d6a9022109b749710672a0460e8a996d4
      subdirectory: environments/code_golf_v1

  - id: multi-turn-alphabet-sort
    category: multi_turn_state
    taskset:
      id: alphabet-sort-v1
      min_turns: 2
      max_turns: 3
      min_names_per_turn: 2
      max_names_per_turn: 4
    num_tasks: 4
    sampling:
      temperature: 0.0
      max_tokens: 2048
    source:
      repository: https://github.com/PrimeIntellect-ai/verifiers
      revision: 284a868d6a9022109b749710672a0460e8a996d4
      subdirectory: environments/alphabet_sort_v1
