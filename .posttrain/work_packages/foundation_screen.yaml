project_id: foundation-models
work_package_id: screen/qwen3.5-2b-smoke
stage: screen
description: Establish whether the Qwen 3.5 2B foundation model meets the bounded serving screen before project-specific training begins.
recipe:
  type: inline
  id: recipes/foundation-screen@1
  revision: "1"
  stage: screen
  seats:
    model: model
    screen_inference: inference
    evaluation_inference: inference
    workload: workload
    target: target
    evaluation_plan: evaluation
    environment: environment
  jobs:
    - id: benchmark
      kind: serve.benchmark
      definition: serve/vllm-benchmark@1
    - id: general-eval
      kind: eval.general
      definition: eval/verifiers-general@1
      optional: true
  expected_artifacts:
    - serve benchmark result
    - optional native evaluation result
bindings:
  model:
    type: ref
    family: model
    id: models/qwen3.5-2b@bf16
  screen_inference:
    type: ref
    family: inference
    id: inference/qwen3.5-2b-vllm-screen@1
  evaluation_inference:
    type: ref
    family: inference
    id: inference/qwen3.5-2b-vllm-eval@1
  workload:
    type: ref
    family: workload
    id: workloads/foundation-smoke-v1@1
  target:
    type: ref
    family: target
    id: targets/local-cuda-8gb
  evaluation_plan:
    type: ref
    family: evaluation
    id: general-smoke-v1
  environment:
    type: ref
    family: environment
    id: math-gsm8k
enabled_optional_jobs: []
metadata:
  question: Can this foundation model satisfy the reference screen?
  labels:
    - reference
    - smoke
