    [rows.append({"trace_id":r["trace_id"],"error_type":r.get("error_type"),"error":r.get("error"),"scores":{k:v["score"] for k,v in r.get("verdict",{}).get("assessments",{}).items()},"violations":[c["outcome"] for c in r.get("verdict",{}).get("requirement_checks",[]) if c["outcome"].startswith("violated_")],"usage":r.get("usage")}) for r in results];
    print(json.dumps({"manifest":manifest,"rows":rows},indent=2))'
