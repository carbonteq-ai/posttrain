<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-label="Same mean, different learning signal">
<title>Same mean, different learning signal</title><desc>One class mixes always-successful and always-failed tasks; another has mixed outcomes within every task.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#817a83"/></marker></defs>
<style>text{font-family:Inter Variable,Inter,Arial,sans-serif;fill:#28252a}.title{font-size:22px;font-weight:700}.label{font-size:17px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#5f5a62}</style>
<rect width="1100" height="570" rx="16" fill="#fcfbf8"/>
<text x="550" y="44" text-anchor="middle" class="title">Class averages hide the structure GRPO needs</text>
<rect x="40" y="88" width="490" height="365" rx="12" fill="#eee9fa" stroke="#e5e1da"/>
<text x="285.0" y="120" text-anchor="middle" class="label">Algebra set X · differences between problems</text>
<rect x="570" y="88" width="490" height="365" rx="12" fill="#e9ede4" stroke="#e5e1da"/>
<text x="815.0" y="120" text-anchor="middle" class="label">Algebra set Y · inconsistent solutions</text>
<text x="75" y="170" text-anchor="start" class="body">Problem 1</text>
<text x="350" y="170" text-anchor="middle" class="label">1   1   1   1</text>
<text x="75" y="217" text-anchor="start" class="body">Problem 2</text>
<text x="350" y="217" text-anchor="middle" class="label">1   1   1   1</text>
<text x="75" y="264" text-anchor="start" class="body">Problem 3</text>
<text x="350" y="264" text-anchor="middle" class="label">0   0   0   0</text>
<text x="75" y="311" text-anchor="start" class="body">Problem 4</text>
<text x="350" y="311" text-anchor="middle" class="label">0   0   0   0</text>
<text x="605" y="170" text-anchor="start" class="body">Problem 1</text>
<text x="880" y="170" text-anchor="middle" class="label">0   1   0   1</text>
<text x="605" y="217" text-anchor="start" class="body">Problem 2</text>
<text x="880" y="217" text-anchor="middle" class="label">1   0   1   0</text>
<text x="605" y="264" text-anchor="start" class="body">Problem 3</text>
<text x="880" y="264" text-anchor="middle" class="label">0   1   1   0</text>
<text x="605" y="311" text-anchor="start" class="body">Problem 4</text>
<text x="880" y="311" text-anchor="middle" class="label">1   0   0   1</text>
<text x="285" y="372" text-anchor="middle" class="label">Class mean success = 0.50</text>
<text x="285" y="407" text-anchor="middle" class="body">Every task sample variance = 0</text>
<text x="815" y="372" text-anchor="middle" class="label">Class mean success = 0.50</text>
<text x="815" y="407" text-anchor="middle" class="body">Every task sample variance = 1/3</text>
<text x="550" y="497" text-anchor="middle" class="body">Each row is four attempts at the same task, under the same generating policy.</text>
<text x="550" y="535" text-anchor="middle" class="small">A group is informative for binary-outcome GRPO only when that row contains both 0 and 1.</text>
</svg>