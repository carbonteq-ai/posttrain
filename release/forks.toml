schema_version = 1

# The release owner records only maintained CarbonTeq components that enter a
# framework candidate.  Runtime/profile/package files remain the executable
# selection authority; `posttrain-release fork-ledger` fails when either side
# drifts.  `required = false` documents a deployed upstream component so an
# unpublished local candidate cannot silently become a release blocker.

[[fork]]
id = "carbonteq-trackio"
scope = "direct-package"
repository = "https://github.com/carbonteq-ai/trackio"
release_tag = "carbonteq-v0.31.5.post14.dev32"
required = true

[[fork]]
id = "trl"
scope = "direct-package"
repository = "https://github.com/carbonteq-ai/trl"
release_tag = "carbonteq-v1.12.0.post11"
required = true

[[fork]]
id = "carbonteq-renderers"
scope = "direct-package"
repository = "https://github.com/carbonteq-ai/renderers"
release_tag = "carbonteq-v0.1.12.post1.dev2"
required = true

# Wheel-only: a CUDA-extension rebuild of an unmodified upstream tag whose
# retained platform wheel is the release identity (no source distribution).
[[fork]]
id = "causal-conv1d"
scope = "direct-package"
repository = "https://github.com/carbonteq-ai/causal-conv1d"
release_tag = "carbonteq-v1.7.0+cu130torch2.13"
