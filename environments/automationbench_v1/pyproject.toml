[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automationbench-v1"
version = "0.1.0"
description = "Native Verifiers v1 adapter for Zapier AutomationBench"
requires-python = ">=3.13,<3.14"
dependencies = [
    "automation-bench==1.0.5",
    "verifiers",
]

[tool.uv]
package = true

[tool.uv.sources]
automation-bench = { git = "https://github.com/zapier/AutomationBench.git", rev = "a321764ace3cfbe42289e6a13abef2f0f4f56fad" }
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git", rev = "284a868d6a9022109b749710672a0460e8a996d4" }

[tool.hatch.build.targets.wheel]
packages = ["src/automationbench_v1"]

