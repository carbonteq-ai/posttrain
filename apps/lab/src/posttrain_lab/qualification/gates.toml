owner = "posttrain-training"
replacement_condition = "Promote to an active release gate once the automationbench-v1 environment distribution builds from an immutable published source and one managed run retains complete per-step advantage and trajectory evidence; retire when a successor multi-turn tool-use environment covers that contract."

