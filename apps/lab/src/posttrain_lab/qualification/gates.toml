schema_version = 1

[[gates]]
id = "foundation-serving-screen"
work_package = ".posttrain/work_packages/foundation_screen.yaml"
job_id = "benchmark"
tier = "extended"
state = "active"
job_kind = "serve.benchmark"
acceptance = "serving-curve"

[[gates]]
id = "automationbench-grpo"
work_package = ".posttrain/work_packages/automationbench_zapier_grpo.yaml"
job_id = "grpo"
tier = "experimental"
state = "candidate"
job_kind = "train.grpo"
acceptance = "verifiers-trajectories"
experiment_family = "automationbench-grpo"
hypothesis = "The AutomationBench Zapier environment can provide a reproducible multi-turn GRPO acceptance signal through the framework Verifiers bridge."
owner = "posttrain-environments"
replacement_condition = "Promote only after the immutable AutomationBench adapter wheel builds and a packaged environment job retains complete trajectory evidence; retire when its successor environment covers that contract."

[[gates]]
id = "automationbench-sampo"
work_package = ".posttrain/work_packages/automationbench_sampo_qualification.yaml"
job_id = "sampo"
tier = "experimental"
state = "candidate"
job_kind = "train.sampo"
acceptance = "verifiers-trajectories"
experiment_family = "automationbench-sampo"
hypothesis = "SAMPO's hierarchical per-step advantages are best qualified on a long multi-turn tool-use environment, so Zapier AutomationBench is a stronger release signal for the SAMPO contract than the synthetic alphabet-sort environment."
owner = "posttrain-training"
replacement_condition = "Promote to an active release gate once the automationbench-v1 environment distribution builds from an immutable published source and one managed run retains complete per-step advantage and trajectory evidence; retire when a successor multi-turn tool-use environment covers that contract."

[[gates]]
id = "gsm8k-distillation-smoke"
work_package = ".posttrain/work_packages/gsm8k_distillation.yaml"
job_id = "distill"
tier = "experimental"
state = "candidate"
job_kind = "train.distill"
acceptance = "training-summary"
experiment_family = "trl-distillation-baseline"
hypothesis = "A short Qwen teacher-to-student distillation run is sufficient to characterize the on-policy trainer before the ten-step extended gate is selected."
owner = "posttrain-training"
replacement_condition = "Retire after the extended distillation gate remains the selected reusable qualification and any new smoke question is represented in its parameterized experiment family."

[[gates]]
id = "gsm8k-distillation-extended"
work_package = ".posttrain/work_packages/gsm8k_distillation_10_qualification.yaml"
job_id = "train"
tier = "extended"
state = "active"
job_kind = "train.distill"
acceptance = "training-summary"

[[gates]]
id = "gsm8k-grpo-extended"
work_package = ".posttrain/work_packages/gsm8k_qwen08b_grpo_qualification.yaml"
job_id = "grpo"
tier = "experimental"
state = "candidate"
job_kind = "train.grpo"
acceptance = "verifiers-trajectories"
experiment_family = "trl-grpo-baseline"
hypothesis = "A bounded TRL GRPO run on GSM8K can establish the baseline online-RL contract for later backend and acceleration comparisons."
owner = "posttrain-training"
replacement_condition = "Promote only if it is the selected maintained GRPO baseline with complete trajectory and optimizer evidence; otherwise replace it with a parameterized GRPO candidate matrix."

[[gates]]
id = "verl-dapo"
work_package = ".posttrain/work_packages/gsm8k_verl_dapo_2_qualification.yaml"
job_id = "dapo"
tier = "experimental"
state = "candidate"
job_kind = "train.grpo"
acceptance = "verifiers-trajectories"
experiment_family = "verl-dapo-acceleration"
hypothesis = "The base veRL DAPO configuration is a useful control for comparing DAPO acceleration choices on the same GSM8K contract."
owner = "posttrain-training"
replacement_condition = "Replace with one parameterized veRL DAPO candidate matrix that records the control and selected variant; promote only the selected configuration after live qualification."

[[gates]]
id = "verl-dapo-mtp"
work_package = ".posttrain/work_packages/gsm8k_verl_dapo_2_mtp_qualification.yaml"
job_id = "dapo"
tier = "experimental"
state = "candidate"
job_kind = "train.grpo"
acceptance = "verifiers-trajectories"
experiment_family = "verl-dapo-acceleration"
hypothesis = "Two-step MTP improves the veRL DAPO rollout path without invalidating its optimizer and trace contract."
owner = "posttrain-training"
replacement_condition = "Replace with the parameterized veRL DAPO candidate matrix; promote only if measured rollout and training evidence beats the control within its declared quality guardrails."

[[gates]]
id = "verl-dapo-turboquant"
work_package = ".posttrain/work_packages/gsm8k_verl_dapo_2_turboquant_qualification.yaml"
job_id = "dapo"
tier = "experimental"
state = "candidate"
job_kind = "train.grpo"
acceptance = "verifiers-trajectories"
experiment_family = "verl-dapo-acceleration"
hypothesis = "TurboQuant reduces veRL DAPO rollout cost while preserving the same trajectory and optimizer outcomes as the control."
owner = "posttrain-training"
replacement_condition = "Replace with the parameterized veRL DAPO candidate matrix; promote only if measured cost improves without a declared quality or trace-completeness regression."

[[gates]]
id = "verl-dapo-mtp-turboquant"
work_package = ".posttrain/work_packages/gsm8k_verl_dapo_2_mtp_turboquant_qualification.yaml"
job_id = "dapo"
tier = "experimental"
state = "candidate"
job_kind = "train.grpo"
acceptance = "verifiers-trajectories"
experiment_family = "verl-dapo-acceleration"
hypothesis = "Combining MTP and TurboQuant can improve veRL DAPO throughput beyond either isolated acceleration while preserving its training contract."
owner = "posttrain-training"
replacement_condition = "Replace with the parameterized veRL DAPO candidate matrix; promote only if the combined variant is selected over the control and isolated variants by retained evidence."

[[gates]]
id = "verl-distillation"
work_package = ".posttrain/work_packages/gsm8k_verl_distill_2_qualification.yaml"
job_id = "distill"
tier = "experimental"
state = "candidate"
job_kind = "train.distill"
acceptance = "verifiers-trajectories"
experiment_family = "verl-distillation"
hypothesis = "veRL distillation can meet the same on-policy distillation contract as the maintained trainer path."
owner = "posttrain-training"
replacement_condition = "Promote only after veRL has a published immutable source, a supported backend contract, and a complete live qualification; otherwise retire when a maintained backend owns the contract."

[[gates]]
id = "verl-grpo"
work_package = ".posttrain/work_packages/gsm8k_verl_grpo_2_qualification.yaml"
job_id = "grpo"
