[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skyrl-bird-sql-v1"
version = "0.1.0"
description = "Native Verifiers v1 adapter for SkyRL-SQL over ReViSQL/BIRD"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@284a868d6a9022109b749710672a0460e8a996d4",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/skyrl_bird_sql_v1"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Repository = "https://github.com/carbonteq-ai/posttrain"
