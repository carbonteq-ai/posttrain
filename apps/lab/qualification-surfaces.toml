[[surfaces]]
id = "remote-gpu-lab-fixture"
path = "apps/lab/tests/fixtures/remote_gpu_project"
kind = "lab-dependent-fixture"
owner = "lab"
transition = "move"
replacement = "apps/lab/tests/fixtures/remote_gpu_project"
tests = []
parity = [
  "install the released framework and Lab wheel into a clean project fixture",
  "validate and execute the foundation screen through the generic posttrain CLI with an explicit project root",
