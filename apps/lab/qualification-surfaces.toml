# Temporary root qualification surfaces and their verified migration boundary.
#
# This inventory is deliberately separate from qualification/gates.toml:
# gates describe retained Lab work-package jobs, whereas these entries describe
# the scripts, fixtures, and false example that must be promoted, moved, or
# retired before the root qualification harness can disappear. An entry is
# removed only after every named parity check succeeds on its replacement.
schema_version = 1

[[surfaces]]
id = "algorithm-scenarios"
path = "apps/lab/src/posttrain_lab/qualification/scenarios.py"
kind = "scenario-policy"
owner = "lab"
transition = "promote"
replacement = "posttrain_lab.qualification.scenarios"
tests = ["apps/lab/tests/test_qualification_scenarios.py"]
parity = [
  "round-trip the versioned scenario manifest without importing an execution provider",
  "reject an online scenario without an environment, rollout inference, or qualifying update budget",
]
deletion_condition = "The Lab scenario registry exposes the same two scenario ids and the replacement unit tests pass."

[[surfaces]]
id = "algorithm-scenario-launcher"
path = "apps/lab/src/posttrain_lab/qualification/launcher.py"
kind = "direct-launcher"
owner = "lab"
transition = "retire"
replacement = "posttrain job plan|pack|run selected through posttrain-lab qualification"
tests = ["apps/lab/tests/test_qualification_launcher.py"]
parity = [
  "plan and run each retained scenario through the public posttrain job command",
  "prove the packed image uses a Lab project snapshot and framework wheels rather than the handwritten source bundle",
  "record provider locator, Trackio run id, and acceptance result through the public lifecycle",
]
deletion_condition = "Both retained scenario paths pass public-path pack/run/evidence parity; no replacement imports private CLI modules or constructs ExecutionRequest directly."

[[surfaces]]
