description: SAMPO of LFM2.5-2.6B from the base model with a fresh rank-16, alpha-32 LoRA adapter on automationbench-v1 0.5.0 (fixed tools, sampo-turns-v3 at 180 concurrent episodes) for 100 updates of 24 prompt groups x 6 attempts, trainer fp16 (dynamic loss scaling from 1024, float32 logits and LoRA master weights) and the c180 DSpark rollout engine in float16. Learning rate 2e-5 after a 5-update warmup, KL 0.02 to the base model, active sampling with 4 extra prompt groups in the first round and 5 in each refill, temperature 0.5, truncation penalty 0.1, mistake penalty 0.02 each (at most 0.1), yield-first curriculum, a checkpoint every 20 updates (docs/plan/lfm26-sampo-fp16-r16.md).
