    max_prompt_length: 4096
    max_completion_length: 1024
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    active_sampling: {max_candidate_batches: 4, oversample: 1, oversample_refill: 1}
    adaptive_curriculum:
      class_field: domain
      policy: yield_first
      exploration_share: 0.2
      uncertainty_weight: 4.0
      evidence_half_life_steps: 20.0
      yield_prior_strength: 4.0
      history_groups: 4
      seed: 172846
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1
    algorithm: olmo3
    beta: 0.0
    advantage_scaling: none
    clip_epsilon_low: 0.2
    clip_epsilon_high: 0.272
    truncation_penalty: 0.1

  # Phase 6: SAMPO with the same sampling, curriculum and correction.
  lfm2.5-1.2b/automationbench-sampo-parity-v1:
    selection_type: sampo-settings
    revision: "1"
    loop:
      max_steps: 4
      max_length: 5120
      per_device_batch_size: 1
      gradient_accumulation_steps: 16
      learning_rate: 0.00004
      lr_scheduler_type: constant
      logging_steps: 1
      checkpoint_steps: 4
      checkpoint_limit: 1
      gradient_checkpointing: true
      seed: 1729
    num_prompts_per_step: 4
    num_generations: 4
    max_prompt_length: 4096
    max_completion_length: 1024
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    active_sampling: {max_candidate_batches: 4, oversample: 1, oversample_refill: 1}
    adaptive_curriculum:
      class_field: domain
      policy: yield_first
      exploration_share: 0.2
      uncertainty_weight: 4.0
      evidence_half_life_steps: 20.0
      yield_prior_strength: 4.0
      history_groups: 4
      seed: 172846
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1
    beta: 0.005
    discount_gamma: 0.95
    step_advantage_weight: 1.0
    advantage_normalization: mean
    truncation_penalty: 0.2

    # The same LoRA targets as the veRL binding: veRL's Qwen3.5 bindings train
    # the language model's o_proj and down_proj only.
  training/qwen3.5-0.8b-trl-lora-parity-local-g16@1:
    selection_type: training-binding
    revision: "1"
    backend: trl@1.12.0.post11
    renderer: {id: qwen3.5-off-v1, model_family: qwen3.5, implementation: qwen3.5, reasoning_mode: "off"}
    update: {kind: lora, rank: 8, alpha: 16, target_modules: ".*[.](o_proj|down_proj)$"}
    target: targets/local-cuda-8gb
    parallelism: {sequence_length_divisor: 2}
    runtime: {global_batch_size: 16, devices_per_node: 1, timeout_seconds: 7200}
    backend_options:
      rollout_execution: {env_workers: 2, episodes_per_worker: 10, worker_native_threads: 1}
      use_liger_kernel: false
      logits_chunk_size: 64
      training_precision: bf16
      dependency_lock: trl-fork@current
      source_revision: 3135b502d69956200d1c030a514470c351d2ee9f
      dependency_lock_sha256: 3806d4249cde3a1541b9529a662a9434cfb1da1cecf2cb5e5499f97193f13d95

  training/qwen3.5-0.8b-verl-lora-parity-local-g16@1:
