# RFT warm start for LFM2.5-2.6B on AutomationBench: SFT on the model's own best training
# episodes (>= 0.8 partial credit, no verified harms, held-out evaluation tasks excluded,
# at most 8 per task and 3 per simple task, deduplicated by tool-call sequence), then a
# narrow DPO pass on best-vs-worst attempts of the same task. Built by
# scripts/data/harvest_agent_trajectories.py and scripts/data/trajectories_to_training_data.py;
# the JSONL files are local inputs (not committed) and enter jobs as materialized datasets.
dataset:
  datasets/lfm26-agent-sft@1:
    revision: "1"
    kind: supervised
    source:
      kind: jsonl
      path: .posttrain/datasets/lfm26-agent-sft-v1.jsonl
    format:
      kind: messages

  # v2: up to 32 per task (3,093 examples, 153 tasks), no domain cap; every example carries
  # metadata.sample_weight (equal total weight per task, capped at 4 per example, mean 1)
  # and the SFT backend samples in proportion to it.
  datasets/lfm26-agent-sft@2:
    revision: "1"
    kind: supervised
    source:
      kind: jsonl
      path: .posttrain/datasets/lfm26-agent-sft-v2.jsonl
    format:
      kind: messages

  # Same-task pairs: chosen >= 0.7 partial credit without verified harms, rejected <= 0.2
  # (harmful attempts first); shared system and user prompt; tool results are masked out
  # of the preference loss.
  datasets/lfm26-agent-dpo@1:
    revision: "1"
    kind: preference
    source:
      kind: jsonl
      path: .posttrain/datasets/lfm26-agent-dpo-v1.jsonl
    format:
      kind: trl

  # v2 contrast pairs (scripts/data/select_dpo_contrasts.py): a perfect episode (passed,
  # full credit, no tool mistakes, no harm, not cut off) against a failure of the same task
  # and setup (system prompt and tools), from any run, up to 4 per task and failure
  # category (harmful, out-of-room, tool-error, empty-results, near-miss, wrong-outcome);
  # each perfect episode in at most 4 pairs. Harm status is known on both sides: guarded
  # tasks use harms re-scored offline with the current manifests (scripts/data/harm_rescore,
  # exact replays only); tasks whose manifest defines no guard cannot be harmful; tasks
  # without a manifest are excluded. 413 pairs, 38 tasks.
  datasets/lfm26-agent-dpo@2:
    revision: "1"
    kind: preference
    source:
      kind: jsonl
      path: .posttrain/datasets/lfm26-agent-dpo-v2.jsonl
    format:
      kind: trl

  # v2 pairs capped at 22,000 rendered tokens (380 of 413 pairs, 38 tasks; drops 20
  # out-of-room, 4 tool-error, 3 harmful, 3 wrong-outcome, 2 empty-results, 1 near-miss):
  # the longest pairs ran the 96 GB card out of memory in backward even with the post15
  # sft term.
  datasets/lfm26-agent-dpo@3:
    revision: "1"
    kind: preference
    source:
      kind: jsonl
      path: .posttrain/datasets/lfm26-agent-dpo-v3.jsonl
    format:
      kind: trl

training:
  # 753 examples (153 tasks), about two passes: 190 steps x 8 examples. Rendered lengths:
  # median 10.6K, p95 18.8K, max 27.8K tokens, so nothing is truncated at 28672.
  lfm2.5-2.6b/agent-sft-v1:
    selection_type: sft-settings
    revision: "1"
    loop:
      max_steps: 190
      max_length: 28672
      per_device_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 0.0001
      warmup_ratio: 0.05
      lr_scheduler_type: linear
      checkpoint_steps: 50

  # Two weighted passes over the v2 set: 775 steps x 8 = 6,200 draws of 3,093 examples.
  lfm2.5-2.6b/agent-sft-v2:
    selection_type: sft-settings
    revision: "1"
    loop:
      max_steps: 775
      max_length: 32768
      per_device_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 0.0001
      warmup_ratio: 0.05
      lr_scheduler_type: linear
      checkpoint_steps: 100

  training/lfm2.5-2.6b-trl-lora-r8-ws@1:
    selection_type: training-binding
    revision: "1"
    backend: trl@1.12.0.post15
    renderer:
      id: lfm2.5-tools-thinking@2
      model_family: lfm2.5
      implementation: default
      reasoning_mode: native
    update:
      kind: lora
      rank: 8
      alpha: 16
      target_modules: all-linear
    target: targets/carbonteq-rtx-pro-6000-96gb
    parallelism: {sequence_length_divisor: 2}
    runtime:
      global_batch_size: 8
      devices_per_node: 1
      timeout_seconds: 43200
    backend_options:
      use_liger_kernel: false
      dependency_lock: trl-fork@current

  # A narrow pass on the SFT adapter (one pass over the pairs). The job continues the SFT
  # adapter (--model-from-run), so its rank stays 8 and the frozen SFT policy is the
  # reference.
  lfm2.5-2.6b/agent-dpo-v1:
    selection_type: dpo-settings
    revision: "1"
    loop:
      max_steps: 140
      max_length: 32768
      per_device_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 0.00002
      warmup_ratio: 0.05
      lr_scheduler_type: linear
      checkpoint_steps: 50
    beta: 0.1
    loss_kernel: torch

  # DPO v2: two passes over the contrast pairs (413 x 2 / 8 = 103 steps), with a supervised
  # loss on the chosen side (RPO, weight 1) so the chosen likelihood does not fall while the
  # margin grows; v1's plain DPO raised harms that way.
  lfm2.5-2.6b/agent-dpo-v2:
    selection_type: dpo-settings
    revision: "1"
    loop:
      max_steps: 103
      max_length: 32768
      per_device_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 0.00002
      warmup_ratio: 0.05
      lr_scheduler_type: linear
      checkpoint_steps: 50
    beta: 0.1
    loss_kernel: torch
    sft_weight: 1.0

  # DPO v2 on the length-capped pairs: two passes (380 x 2 / 8 = 95 steps), max length 22,016.
  lfm2.5-2.6b/agent-dpo-v2-capped:
    selection_type: dpo-settings
    revision: "1"
    loop:
      max_steps: 95
      max_length: 22016
      per_device_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 0.00002
      warmup_ratio: 0.05
      lr_scheduler_type: linear
      checkpoint_steps: 50
    beta: 0.1
    loss_kernel: torch
    sft_weight: 1.0

  # Same as agent-dpo-v2-capped, with reference log-probabilities computed once before
  # training (no reference forward per step; the frozen reference leaves the GPU).
  lfm2.5-2.6b/agent-dpo-v2-fast:
    selection_type: dpo-settings
    revision: "1"
    loop:
      max_steps: 95
      max_length: 22016
      per_device_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 0.00002
      warmup_ratio: 0.05
      lr_scheduler_type: linear
      checkpoint_steps: 50
    beta: 0.1
    loss_kernel: torch
    sft_weight: 1.0
    precompute_reference: true
