# RFT warm start for LFM2.5-2.6B on AutomationBench: SFT on the model's own best training
# episodes (>= 0.8 partial credit, no verified harms, held-out evaluation tasks excluded,
# at most 8 per task and 3 per simple task, deduplicated by tool-call sequence), then a
# narrow DPO pass on best-vs-worst attempts of the same task. Built by
# scripts/data/harvest_agent_trajectories.py and scripts/data/trajectories_to_training_data.py;
# the JSONL files are local inputs (not committed) and enter jobs as materialized datasets.
dataset:
  datasets/lfm26-agent-sft@1:
    revision: "1"
    kind: supervised
    source:
      kind: jsonl
      path: .posttrain/datasets/lfm26-agent-sft-v1.jsonl
    format:
      kind: messages

  # Same-task pairs: chosen >= 0.7 partial credit without verified harms, rejected <= 0.2
  # (harmful attempts first); shared system and user prompt; tool results are masked out
  # of the preference loss.
  datasets/lfm26-agent-dpo@1:
    revision: "1"
    kind: preference
    source:
      kind: jsonl
      path: .posttrain/datasets/lfm26-agent-dpo-v1.jsonl
    format:
      kind: trl

training:
  # 753 examples (153 tasks), about two passes: 190 steps x 8 examples. Rendered lengths:
  # median 10.6K, p95 18.8K, max 27.8K tokens, so nothing is truncated at 28672.
  lfm2.5-2.6b/agent-sft-v1:
    selection_type: sft-settings
    revision: "1"
    loop:
      max_steps: 190
      max_length: 28672
      per_device_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 0.0001
      warmup_ratio: 0.05
      lr_scheduler_type: linear
      checkpoint_steps: 50

  training/lfm2.5-2.6b-trl-lora-r8-ws@1:
    selection_type: training-binding
    revision: "1"
    backend: trl@1.12.0.post14
    renderer:
      id: lfm2.5-tools-thinking@2
      model_family: lfm2.5
      implementation: default
      reasoning_mode: native
    update:
      kind: lora
      rank: 8
      alpha: 16
      target_modules: all-linear
    target: targets/carbonteq-rtx-pro-6000-96gb
    parallelism: {sequence_length_divisor: 2}
    runtime:
      global_batch_size: 8
      devices_per_node: 1
      timeout_seconds: 43200
    backend_options:
      use_liger_kernel: false
      dependency_lock: trl-fork@current

  # A narrow pass on the SFT adapter (one pass over the pairs). The job continues the SFT
  # adapter (--model-from-run), so its rank stays 8 and the frozen SFT policy is the
  # reference.
  lfm2.5-2.6b/agent-dpo-v1:
    selection_type: dpo-settings
    revision: "1"
    loop:
      max_steps: 140
      max_length: 32768
      per_device_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 0.00002
      warmup_ratio: 0.05
      lr_scheduler_type: linear
      checkpoint_steps: 50
    beta: 0.1
    loss_kernel: torch
