  # prefix caching and asynchronous continuous batching are enabled; the
  # policy-version fence invalidates stale prefixes after every LoRA refresh.
  # Native vLLM FA4 admits compute capabilities 9.x-11.x and rejects SM120;
  # the separately qualified extracted SM120 kernel is not this backend.
  inference/lfm2.5-2.6b-vllm-automationbench-rollout-local-c32-4k@2:
    revision: "2"
    model: models/lfm2.5-2.6b@bf16
    backend: vllm@0.29.1.dev3
    renderer: lfm2.5-tools-thinking@2
    engine:
      mode: colocate
      request_mode: async
      sleep_during_optimization: true
      # vLLM 0.29 treats this as a hard fraction of total device memory. The
      # colocated trainer leaves about 9.48 GiB free on the 96 GiB RTX PRO, so
      # 9% admits the engine with bounded headroom while retaining the explicit
      # 4 GiB KV cache and c32 scheduler. Attempts d/e initially appeared to
      # exhaust this budget, but host inspection found an unrelated retained
      # Uno development service holding 80.8 GiB; do not encode that contention
      # by reducing the intended benchmark capacity.
