training:
  lfm2.5-1.2b/automationbench-changed-weight-local-v1:
    selection_type: grpo-settings
    revision: "1"
    loop:
      # Later collections run after the first nonzero optimizer update and are
      # the changed-weight qualification surface.
      max_steps: 5
      max_length: 3072
      per_device_batch_size: 1
      gradient_accumulation_steps: 4
      learning_rate: 0.00001
      logging_steps: 1
      checkpoint_steps: 1
      checkpoint_limit: 1
      gradient_checkpointing: true
    num_prompts_per_step: 1
    num_generations: 4
    max_prompt_length: 2048
    max_completion_length: 1024
    shuffle_prompts: false
    mask_truncated_completions: false
    max_admission_attempts: 1

  lfm2.5-2.6b/automationbench-changed-weight-canary-v1:
    selection_type: grpo-settings
    revision: "1"
    loop:
      # Step 1 performs the first optimizer update. Step 2 must collect again
      # so qualification observes rollout inference after changed LoRA weights
      # have been synchronized into vLLM.
      max_steps: 2
      max_length: 2048
      per_device_batch_size: 1
      gradient_accumulation_steps: 2
      learning_rate: 0.00001
      logging_steps: 1
      checkpoint_steps: 1
      checkpoint_limit: 1
      gradient_checkpointing: true
    num_prompts_per_step: 1
    num_generations: 2
    max_prompt_length: 1536
    max_completion_length: 512
    shuffle_prompts: false
    mask_truncated_completions: false
    max_admission_attempts: 1

  lfm2.5-2.6b/automationbench-grpo-50-v1:
    selection_type: grpo-settings
    revision: "1"
    loop: &comparison_loop
      max_steps: 50
      max_length: 13312
      per_device_batch_size: 1
      gradient_accumulation_steps: 64
      learning_rate: 0.00001
      logging_steps: 1
      checkpoint_steps: 10
      checkpoint_limit: 6
    num_prompts_per_step: 16
    num_generations: 4
    max_prompt_length: 10240
    max_completion_length: 3072
    shuffle_prompts: true
    mask_truncated_completions: false

  lfm2.5-2.6b/automationbench-olmo3-50-v1:
    selection_type: grpo-settings
    revision: "1"
    loop: *comparison_loop
    num_prompts_per_step: 16
    num_generations: 4
    max_prompt_length: 10240
    max_completion_length: 3072
    algorithm: olmo3
    beta: 0.0
    advantage_scaling: none
    clip_epsilon_low: 0.2
    clip_epsilon_high: 0.272
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    active_sampling: {max_candidate_batches: 10}
    shuffle_prompts: true
    mask_truncated_completions: false

  lfm2.5-2.6b/automationbench-grpo-20-local-v1:
    selection_type: grpo-settings
    revision: "1"
    loop: &comparison_local_20_loop
      max_steps: 20
      max_length: 13312
      per_device_batch_size: 1
      gradient_accumulation_steps: 32
      learning_rate: 0.00001
      logging_steps: 1
      checkpoint_steps: 10
      checkpoint_limit: 3
    num_prompts_per_step: 8
    num_generations: 4
    max_prompt_length: 10240
    max_completion_length: 3072
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1

  lfm2.5-2.6b/automationbench-olmo3-20-local-v1:
    selection_type: grpo-settings
    revision: "1"
    loop: *comparison_local_20_loop
    num_prompts_per_step: 8
    num_generations: 4
    max_prompt_length: 10240
    max_completion_length: 3072
    algorithm: olmo3
    beta: 0.0
    advantage_scaling: none
    clip_epsilon_low: 0.2
    clip_epsilon_high: 0.272
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    active_sampling: {max_candidate_batches: 10}
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1

  lfm2.5-2.6b/automationbench-gdpo-episode-50-v1:
    selection_type: gdpo-settings
    revision: "1"
    loop: *comparison_loop
    num_prompts_per_step: 16
    num_generations: 4
    max_prompt_length: 10240
    max_completion_length: 3072
    component_names:
      - partial_credit
      - problem_understanding_planning
      - logical_correctness
      - evidence_state_grounding
      - verification_self_correction
      - progress_efficiency
      - action_quality
      - answer_quality
    component_weights: [0.50, 0.05, 0.05, 0.05, 0.03, 0.07, 0.15, 0.10]
    max_admission_attempts: 3

  lfm2.5-2.6b/automationbench-gdpo-episode-2-local-v1:
    selection_type: gdpo-settings
    revision: "1"
    loop:
      # Two collections prove the second rollout uses the adapter produced by
      # the first optimizer update. Checkpointing each update also exercises
      # bounded artifact finalization in this development qualification.
      max_steps: 2
      max_length: 13312
      per_device_batch_size: 1
      gradient_accumulation_steps: 64
      learning_rate: 0.00001
      logging_steps: 1
      checkpoint_steps: 1
      checkpoint_limit: 2
    num_prompts_per_step: 16
    num_generations: 4
    max_prompt_length: 10240
    max_completion_length: 3072
    component_names:
      - partial_credit
      - problem_understanding_planning
      - logical_correctness
      - evidence_state_grounding
      - verification_self_correction
      - progress_efficiency
      - action_quality
      - answer_quality
    component_weights: [0.50, 0.05, 0.05, 0.05, 0.03, 0.07, 0.15, 0.10]
    max_admission_attempts: 3

