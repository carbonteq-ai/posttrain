      dependency_lock: trl-fork@current
      source_revision: 4950b99d457faacbec856cbd5305732e7b3cf7b0
      dependency_lock_sha256: 20d9ede367a06de25424e16e63ea7fcada7b4e7f36c1037dc49707bdb295ca68

