            - sales.event_followup_outreach
            - finance.vendor_payment_approval
            - marketing.content_syndication
            - support.hiver_slack_digest
            - finance.wire_transfer_approval
          task: {toolset: limited_zapier, search_top_k: 20, turn_budget: 12}
        retries: {max_retries: 2}
        agent:
          harness: {id: "null"}
          runtime: {type: subprocess}
          timeout: {setup: 120, rollout: 1800, finalize: 60, scoring: 900}
