  # Preserve the 12K episode budget while allowing all ten retained prompt
  # groups (four generations each) to execute concurrently.
  automationbench-lfm26-train-mix-v4:
    <<: *automationbench_train_mix_v3
    max_concurrent: 40

  # Yield-first qualification keeps the task mix and concurrency but raises
  # the episode and per-call output limits after v3 marked 492/1284 traces
  # truncated; sampled trace calls frequently ended at exactly 4096 tokens.
  # This is a two-factor comparison, not a policy-only ablation.
  automationbench-lfm26-train-mix-v5:
    <<: *automationbench_train_mix_v3
    max_concurrent: 40
    activation:
      kind: verifiers-config
      config:
        taskset:
