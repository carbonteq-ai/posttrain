      repository: https://github.com/carbonteq-ai/verifiers-environments
      revision: c7e88d7b302e6177041ac0849863d0466be77d8b
      subdirectory: environments/automationbench_v1
    activation:
      kind: verifiers-config
      config:
        taskset:
          id: automationbench-v1
          task_names: [simple.jira_mobile_redesign_epic]
          task: {toolset: limited_zapier, search_top_k: 20}
        retries: {max_retries: 0}
        agent:
          harness: {id: "null"}
          runtime: {type: subprocess}
          # The first subprocess prepares the shared PEP 723 chat environment;
          # later rollouts reuse it. This is a cold-start budget, not a rollout
          # retry allowance.
          timeout: {setup: 600, rollout: 300, finalize: 60, scoring: 120}
          max_turns: 4
          max_total_tokens: 1024
    sampling: {max_tokens: 512, temperature: 0.8, top_p: 0.95}
    num_tasks: 1
    num_rollouts: 2
    max_concurrent: 2
    parameters: {task_names: [simple.jira_mobile_redesign_epic], toolset: limited_zapier}
    reward_components: [partial_credit]
    required_inference_capabilities: [tool-calling]

