# Matched 50-update LFM2.5-2.6B AutomationBench comparison. The task-owned
# episode judge emits seven independent annotations; only GDPO consumes them.
environment:
  automationbench-lfm26-train-mix-v2:
    category: agentic-tool-use
    source:
      package: automationbench-v1
      repository: https://github.com/carbonteq-ai/verifiers-environments
      revision: 12ff5e1abfab369b8dec4df3ce83c5984f55ad34
      subdirectory: environments/automationbench_v1
    activation:
      kind: verifiers-config
      config:
        taskset:
          id: automationbench-v1
          domains: [simple, sales, marketing, operations, support, finance, hr]
          task:
            toolset: limited_zapier
            search_top_k: 20
        retries: {max_retries: 2}
        agent:
          harness: {id: "null"}
          runtime: {type: subprocess}
          timeout: {setup: 120, rollout: 1800, finalize: 60, scoring: 900}
          max_turns: 12
          max_total_tokens: 8192
    sampling: &policy_sampling
      max_tokens: 2048
      temperature: 0.8
      top_p: 0.95
    num_tasks: 160
    num_rollouts: 4
    max_concurrent: 32
    parameters:
      domains: [simple, sales, marketing, operations, support, finance, hr]
      task_mix_id: lfm26-automationbench-mix-v2
      task_mix_sha256: 74c3fe101a92d11b4f86ce36111d8b035afc2619508ea467e2a77778430d9511
      sampling_seed: 172846
      toolset: limited_zapier
      max_turns: 12
      max_total_tokens: 8192
    reward_components: [partial_credit]
    required_inference_capabilities: [tool-calling]
    observation:
      primary_metric: partial_credit
      pass_rate_metric: task_completed_correctly
      facets:
        - {field: domain, dimension: domain, label: Domain}

  automationbench-lfm26-train-mix-episode-judged-v2:
    category: agentic-tool-use
    source:
      package: automationbench-v1
      repository: https://github.com/carbonteq-ai/verifiers-environments
      revision: 12ff5e1abfab369b8dec4df3ce83c5984f55ad34
      subdirectory: environments/automationbench_v1
    activation:
      kind: verifiers-config
      config:
        taskset:
          id: automationbench-v1
          domains: [simple, sales, marketing, operations, support, finance, hr]
          task:
            toolset: limited_zapier
            search_top_k: 20
            judges:
              - id: automationbench-v1
                name: quality
                weight: 0.0
                assessment_scope: episode
                code_revision: c8c3bb57cb484a068be975fa97e07f5bc86930fd
                model: google/gemma-4-12B-it
                model_revision: 707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7
                context_scope: retrospective
                attempts: 2
                timeout_seconds: 900
                input_budget_tokens: 8192
                sampling: &judge_sampling
                  temperature: 0.0
                  max_tokens: 16384
                  extra_body:
                    chat_template_kwargs: {enable_thinking: true}
        retries: {max_retries: 2}
        agent:
          harness: {id: "null"}
          runtime: {type: subprocess}
          timeout: {setup: 120, rollout: 1800, finalize: 60, scoring: 900}
          max_turns: 12
          max_total_tokens: 8192
    sampling: *policy_sampling
    num_tasks: 160
    num_rollouts: 4
    max_concurrent: 32
    parameters:
      domains: [simple, sales, marketing, operations, support, finance, hr]
      task_mix_id: lfm26-automationbench-mix-v2
      task_mix_sha256: 74c3fe101a92d11b4f86ce36111d8b035afc2619508ea467e2a77778430d9511
      sampling_seed: 172846
      toolset: limited_zapier
      max_turns: 12
      max_total_tokens: 8192
      judge_input_budget_tokens: 8192
      judge_output_budget_tokens: 16384
      judge_context_window: 24576
    reward_components: [partial_credit]
    required_inference_capabilities: [tool-calling]
    observation:
      primary_metric: partial_credit
      pass_rate_metric: task_completed_correctly
      facets:
        - {field: domain, dimension: domain, label: Domain}

  automationbench-lfm26-heldout-mix-v1:
    category: agentic-tool-use
    source:
      package: automationbench-v1
      repository: https://github.com/carbonteq-ai/verifiers-environments
      revision: 12ff5e1abfab369b8dec4df3ce83c5984f55ad34
      subdirectory: environments/automationbench_v1
    activation:
      kind: verifiers-config
      config:
        taskset:
          id: automationbench-v1
          domains: [simple, sales, marketing, operations, support, finance, hr]
          task_names:
            - simple.sf_create_account_note
            - simple.gmail_invoice_email
            - simple.zoom_sales_pipeline_review
            - simple.sheets_read_then_email
            - simple.gcal_product_review_from_email
            - simple.sprint_retro_jira_slack
            - simple.email_jira_bug_slack
            - simple.email_jira_story_reply
            - sales.recency_selection
            - sales.zoom_attendance_pipeline
            - marketing.conversion_tracking
            - marketing.landing_page_optimization
            - operations.hubspot_payment_failure
            - operations.server_capacity_threshold_alerts
            - support.freshdesk_onboarding_automation
            - support.reamaze_knowledge_routing
            - finance.ap_aging_report
            - finance.cash_flow_forecast
            - hr.slack_benefits_inquiry
            - hr.i9_verification_tracking
          task:
            toolset: limited_zapier
            search_top_k: 20
        retries: {max_retries: 2}
        agent:
          harness: {id: "null"}
          runtime: {type: subprocess}
          timeout: {setup: 120, rollout: 1800, finalize: 60, scoring: 300}
          max_turns: 12
          max_total_tokens: 8192
    sampling:
      max_tokens: 2048
      temperature: 0.0
      top_p: 1.0
    num_tasks: 20
    num_rollouts: 1
    max_concurrent: 20
    parameters:
      task_mix_id: lfm26-automationbench-mix-v1-heldout
      task_mix_sha256: 4526f8a12081555b9061fa5c45924fa2d2b635dee832c27e6bb72cb9234941d7
      sampling_seed: 43
      toolset: limited_zapier
      max_turns: 12
      max_total_tokens: 8192
    reward_components: [partial_credit]
    required_inference_capabilities: [tool-calling]
    observation:
      primary_metric: partial_credit
      pass_rate_metric: task_completed_correctly
      facets:
        - {field: domain, dimension: domain, label: Domain}

training:
  lfm2.5-2.6b/automationbench-grpo-50-v1:
    selection_type: grpo-settings
    revision: "1"
    loop: &comparison_loop
      max_steps: 50
      max_length: 12288
      per_device_batch_size: 1
      gradient_accumulation_steps: 64
      learning_rate: 0.00001
      logging_steps: 1
      checkpoint_steps: 10
      checkpoint_limit: 6
    num_prompts_per_step: 16
    num_generations: 4
    max_prompt_length: 10240
    max_completion_length: 2048
    shuffle_prompts: true
    mask_truncated_completions: false

  lfm2.5-2.6b/automationbench-olmo3-50-v1:
    selection_type: grpo-settings
    revision: "1"
    loop: *comparison_loop
    num_prompts_per_step: 16
    num_generations: 4
    max_prompt_length: 10240
    max_completion_length: 2048
    algorithm: olmo3
    beta: 0.0
    advantage_scaling: none
    clip_epsilon_low: 0.2
    clip_epsilon_high: 0.272
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    active_sampling: {max_candidate_batches: 10}
    shuffle_prompts: true
    mask_truncated_completions: false

  lfm2.5-2.6b/automationbench-grpo-20-local-v1:
    selection_type: grpo-settings
    revision: "1"
    loop: &comparison_local_20_loop
      max_steps: 20
      max_length: 12288
      per_device_batch_size: 1
      gradient_accumulation_steps: 32
      learning_rate: 0.00001
      logging_steps: 1
      checkpoint_steps: 10
      checkpoint_limit: 3
    num_prompts_per_step: 8
    num_generations: 4
    max_prompt_length: 10240
    max_completion_length: 2048
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1

  lfm2.5-2.6b/automationbench-olmo3-20-local-v1:
    selection_type: grpo-settings
    revision: "1"
    loop: *comparison_local_20_loop
    num_prompts_per_step: 8
    num_generations: 4
    max_prompt_length: 10240
    max_completion_length: 2048
    algorithm: olmo3
    beta: 0.0
    advantage_scaling: none
    clip_epsilon_low: 0.2
    clip_epsilon_high: 0.272
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    active_sampling: {max_candidate_batches: 10}
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1

  lfm2.5-2.6b/automationbench-gdpo-episode-50-v1:
    selection_type: gdpo-settings
    revision: "1"
    loop: *comparison_loop
    num_prompts_per_step: 16
    num_generations: 4
    max_prompt_length: 10240
    max_completion_length: 2048
    component_names:
      - partial_credit
      - problem_understanding_planning
      - logical_correctness
      - evidence_state_grounding
      - verification_self_correction
      - progress_efficiency
      - action_quality
      - answer_quality
    component_weights: [0.50, 0.05, 0.05, 0.05, 0.03, 0.07, 0.15, 0.10]
    max_admission_attempts: 3

  training/lfm2.5-2.6b-trl-lora-automationbench@1:
    selection_type: training-binding
    revision: "1"
    backend: trl@1.12.0.post5
    renderer:
      id: lfm2.5-tools-thinking@2
      model_family: lfm2.5
      implementation: default
      reasoning_mode: native
    update:
      kind: lora
      rank: 4
      alpha: 8
      target_modules: all-linear
    target: targets/runpod-rtx-pro-6000-96gb-secure-ondemand
    parallelism: {sequence_length_divisor: 2}
    runtime:
      global_batch_size: 64
      devices_per_node: 1
      timeout_seconds: 43200
    backend_options:
      use_liger_kernel: false
      logits_chunk_size: 128
      vllm_policy_parity_max_sequence_tokens: 4096
      dependency_lock: trl-fork@1.12.0.post5
      source_revision: b9f3a09369d9cfa21950feef3e110e1fdf779c54
      dependency_lock_sha256: f035291bae6f4a0577d2142df98dca9dd8fdfdcf3b4c92c99a393ae4eb724d9b

  training/lfm2.5-2.6b-trl-lora-automationbench-local@1:
    selection_type: training-binding
    revision: "1"
    backend: trl@1.12.0.post5
    renderer:
      id: lfm2.5-tools-thinking@2
      model_family: lfm2.5
      implementation: default
      reasoning_mode: native
    update:
      kind: lora
      rank: 4
      alpha: 8
      target_modules: all-linear
    target: targets/carbonteq-rtx-pro-6000-96gb
    parallelism: {sequence_length_divisor: 2}
    runtime:
      global_batch_size: 32
      devices_per_node: 1
      timeout_seconds: 43200
    backend_options:
      use_liger_kernel: false
      logits_chunk_size: 128
      vllm_policy_parity_max_sequence_tokens: 4096
      dependency_lock: trl-fork@1.12.0.post5
      source_revision: b9f3a09369d9cfa21950feef3e110e1fdf779c54
      dependency_lock_sha256: f035291bae6f4a0577d2142df98dca9dd8fdfdcf3b4c92c99a393ae4eb724d9b

  reward/automationbench-episode-gdpo@1:
    selection_type: reward-projection
    revision: "1"
    scorer_digest: 155acad270dafc853f04241c3309fa52ce0daa42972e1f34f78c67d6149a5968
    components:
      - {name: partial_credit, source: scalar}
      - {name: problem_understanding_planning, source: annotation, key: episode_reward/problem_understanding_planning}
      - {name: logical_correctness, source: annotation, key: episode_reward/logical_correctness}
      - {name: evidence_state_grounding, source: annotation, key: episode_reward/evidence_state_grounding}
      - {name: verification_self_correction, source: annotation, key: episode_reward/verification_self_correction}
      - {name: progress_efficiency, source: annotation, key: episode_reward/progress_efficiency}
      - {name: action_quality, source: annotation, key: episode_reward/action_quality}
      - {name: answer_quality, source: annotation, key: episode_reward/answer_quality}

inference:
  inference/lfm2.5-2.6b-vllm-automationbench-rollout@1:
    revision: "1"
    model: models/lfm2.5-2.6b@bf16
    backend: vllm@0.25.1
    renderer: lfm2.5-tools-thinking@2
    engine:
      mode: colocate
      sleep_during_optimization: true
      gpu_memory_utilization: 0.20
      tensor_parallel_size: 1
      max_model_len: 12288
      max_num_seqs: 32
      max_num_batched_tokens: 12288
      kv_cache_memory_bytes: 536870912
      weight_sync_mode: lora
      weight_name_prefix: language_model.
      enforce_eager: true
      enable_chunked_prefill: true
      free_cache_engine: true
      text_only: true
      skip_mm_profiling: true
    sampling: *policy_sampling
    target: targets/runpod-rtx-pro-6000-96gb-secure-ondemand
    purpose: [rollout]
    capabilities: [tool-calling]

  inference/lfm2.5-2.6b-vllm-automationbench-rollout-local-c32@1:
