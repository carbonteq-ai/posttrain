          timeout: {setup: 600, rollout: 300, finalize: 60, scoring: 120}
          max_turns: 4
          max_total_tokens: 1024
    sampling: {max_tokens: 512, temperature: 0.8, top_p: 0.95}
    num_tasks: 1
    num_rollouts: 2
    max_concurrent: 2
    parameters: {task_names: [simple.jira_mobile_redesign_epic], toolset: limited_zapier}
