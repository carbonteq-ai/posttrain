# Matched 50-update LFM2.5-2.6B AutomationBench comparison. The task-owned
# episode judge emits seven independent annotations; only GDPO consumes them.
environment:
  automationbench-lfm12-local-five-step-v1:
    category: agentic-tool-use
    source:
      package: automationbench-v1
      repository: https://github.com/carbonteq-ai/verifiers-environments
      revision: 9bbd3116e6b5a444d6cf103dce18b1866ae32787
      subdirectory: environments/automationbench_v1
    activation:
      kind: verifiers-config
      config:
        taskset:
          id: automationbench-v1
          task_names:
            - simple.sf_create_account_note
            - simple.gmail_invoice_email
            - simple.asana_team_offsite
            - simple.jira_mobile_redesign_epic
            - simple.airtable_create_contact
          task: {toolset: limited_zapier, search_top_k: 20}
        retries: {max_retries: 0}
        agent:
          harness: {id: "null"}
          runtime: {type: subprocess}
          timeout: {setup: 600, rollout: 300, finalize: 60, scoring: 120}
          max_turns: 4
          max_total_tokens: 2048
    sampling: {max_tokens: 1024, temperature: 0.8, top_p: 0.95}
    num_tasks: 5
    num_rollouts: 4
    max_concurrent: 2
    parameters:
      task_names:
        - simple.sf_create_account_note
        - simple.gmail_invoice_email
        - simple.asana_team_offsite
        - simple.jira_mobile_redesign_epic
        - simple.airtable_create_contact
      toolset: limited_zapier
    reward_components: [partial_credit]
    required_inference_capabilities: [tool-calling]

  automationbench-lfm26-changed-weight-canary-v1:
