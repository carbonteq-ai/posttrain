training:
  qwen3.5-0.8b/gsm8k-grpo-15-v1:
    selection_type: grpo-settings
    revision: "1"
    loop:
      max_steps: 15
      max_length: 640
      per_device_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 0.00001
    num_prompts_per_step: 2
    num_generations: 4
    max_prompt_length: 256
    max_completion_length: 384
  training/qwen3.5-0.8b-trl-grpo-qualification-lora@1:
    selection_type: training-binding
    revision: "1"
    backend: trl@1.8.0
    renderer:
      id: qwen3.5-off-v1
      model_family: qwen3.5
      implementation: qwen3.5
      reasoning_mode: "off"
    update:
      kind: lora
      rank: 8
      alpha: 16
      target_modules: all-linear
    target: targets/local-cuda-8gb
    parallelism:
      sequence_length_divisor: 2
    runtime:
      global_batch_size: 8
    backend_options:
      use_liger_kernel: false
      source_revision: 6828a84716e0b9e29c3aedb40df3d28b81770e5b
      dependency_lock_sha256: 777c3e102d2e79724cb7d64bde6c3bbc13196eb6381146599dc4c25b504a18aa
