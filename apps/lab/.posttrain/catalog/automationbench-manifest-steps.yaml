  # (128 episodes) and 100 collection steps from the base model. Each 128-episode population
  # is applied as 4 minibatch optimizer updates of 32 episodes in native order (4 whole prompt
  # groups each, so the sequence-level ratio and clip act after the first), 400 updates in
  # all; checkpoints every 25 collections. Revision 2: when more of the 20 generated groups
  # have reward spread than the 16 needed, keep the 16 with the largest learning signal
  # (retain: learning_signal) instead of the first 16 in task order. Revision 3: SAMPO's per-turn
  # objective (turn-rows), so the ratio and clip act on each sampled turn. Revision 4: VORTEX's
  # yield-first adaptive curriculum chooses each active round's tasks by domain on the resolved
  # engine. Revision 5: 6144-token replies (r2 truncated 21% of episodes, mostly replies cut at 4096).
