training:
  # SAMPO step rewards: the live per-turn partial-credit progress (version-2 rule,
  # 0.02 per tool mistake) plus manifest step credit (goal share 0.5, harm 0.1 capped at
  # 0.3 per episode). Digest = AutomationBenchTurnRewardConfig scorer version 3.
  reward/automationbench-manifest-steps@1:
    selection_type: reward-projection
    revision: "1"
    components:
      - {name: partial_credit, source: scalar}
    turns_info_key: posttrain_turn_rewards
    turn_reward_key: turn_reward
    turn_reward_includes_terminal_outcome: true
    scorer_digest: c682477d7dde8ded09a85f833c4dd665804495f992a7899ddd306fdf869a4cd1

  # Two resolved SAMPO updates on LFM2.5-1.2B: correctness and gradient-norm checks.
  lfm2.5-1.2b/automationbench-manifest-steps-smoke-v1:
    selection_type: sampo-settings
    revision: "1"
    loop:
      max_steps: 2
      max_length: 16384
      learning_rate: 0.00006
      lr_scheduler_type: constant
      logging_steps: 1
      checkpoint_steps: 2
      checkpoint_limit: 1
      gradient_checkpointing: true
      seed: 42
    num_prompts_per_step: 4
    num_generations: 4
    max_prompt_length: 12288
    max_completion_length: 3072
    beta: 0.01
    kl_reference: base
    discount_gamma: 0.95
    step_advantage_weight: 1.0
    advantage_normalization: mean
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1
    policy_updates:
      schedule: {unit: episode, budget: 16, epochs: 1, max_applied_updates: 2}
      execution: {records: 1, context_tokens: 16384, statistic_bytes: 67108864}

  # The vLLM qualification arm, with the 2.6B run's sampler correction, active sampling and
  # truncation penalty. vLLM caps each request at max_model_len 16384, and a
  # retained conditioning view adds the turn's closing tokens beyond it, so the update
  # context leaves headroom above the engine limit.
  lfm2.5-1.2b/automationbench-manifest-steps-smoke-vllm-v1:
    selection_type: sampo-settings
    revision: "1"
    loop:
      max_steps: 2
      max_length: 20480
      learning_rate: 0.00006
      lr_scheduler_type: constant
      logging_steps: 1
      checkpoint_steps: 2
      checkpoint_limit: 1
      gradient_checkpointing: true
      seed: 42
    num_prompts_per_step: 4
    num_generations: 4
    max_prompt_length: 12288
    max_completion_length: 3072
    beta: 0.01
    kl_reference: base
    discount_gamma: 0.95
    step_advantage_weight: 1.0
    advantage_normalization: mean
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    active_sampling: {max_candidate_batches: 3, oversample: 1, oversample_refill: 1}
    truncation_penalty: 0.1
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1
    policy_updates:
      schedule: {unit: episode, budget: 16, epochs: 1, max_applied_updates: 2}
      execution: {records: 1, context_tokens: 20480, statistic_bytes: 67108864}

  lfm2.5-1.2b/automationbench-manifest-steps-smoke-local-v1:
    selection_type: sampo-settings
    revision: "1"
    loop:
      max_steps: 2
      max_length: 6144
      learning_rate: 0.00006
      lr_scheduler_type: constant
      logging_steps: 1
      checkpoint_steps: 2
      checkpoint_limit: 1
      gradient_checkpointing: true
      seed: 42
    num_prompts_per_step: 4
    num_generations: 4
    max_prompt_length: 5120
    max_completion_length: 1024
    beta: 0.01
    kl_reference: base
    discount_gamma: 0.95
    step_advantage_weight: 1.0
    advantage_normalization: mean
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1
    policy_updates:
      schedule: {unit: episode, budget: 16, epochs: 1, max_applied_updates: 2}
      execution: {records: 1, context_tokens: 6144, statistic_bytes: 67108864}

  # cont100's settings (LR 6e-5 constant, KL 0.01 to the base, gamma 0.95, token-truncated
  # sampler correction capped at 2, truncation penalty 0.1, at most 5 candidate rounds) with
  # 4 extra prompt groups per round and refill (oversample 4), 16 prompt groups x 8 attempts
  # (128 episodes) and 100 collection steps from the base model. Each 128-episode population
  # is applied as 4 minibatch optimizer updates of 32 episodes in native order (4 whole prompt
  # groups each, so the sequence-level ratio and clip act after the first), 400 updates in
  # all; checkpoints every 25 collections. The resolved TRL engine does not
  # admit the adaptive curriculum, so prompts are shuffled. The update context leaves
  # headroom above vLLM's 24576-token engine limit.
  lfm2.5-2.6b/automationbench-manifest-steps-sampo-100-g16x8-v1:
    selection_type: sampo-settings
    revision: "1"
    loop:
      max_steps: 400
      max_length: 28672
      learning_rate: 0.00006
      lr_scheduler_type: constant
      logging_steps: 1
      checkpoint_steps: 100
      checkpoint_limit: 4
      gradient_checkpointing: true
      seed: 42
    num_prompts_per_step: 16
    num_generations: 8
    max_prompt_length: 20480
    max_completion_length: 4096
    beta: 0.01
    kl_reference: base
    discount_gamma: 0.95
    step_advantage_weight: 1.0
    advantage_normalization: mean
    clip_epsilon_low: 0.003
    clip_epsilon_high: 0.004
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    active_sampling: {max_candidate_batches: 5, oversample: 4, oversample_refill: 4}
    truncation_penalty: 0.1
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1
    policy_updates:
      schedule: {unit: episode, budget: 32, epochs: 1, order: native, max_applied_updates: 400}
      execution: {records: 1, context_tokens: 28672, statistic_bytes: 268435456}

  # Two-collection (8-update) twins of the 100-step settings that differ only in advantage
  # normalization:
  # `mean` centers episode and step returns within their groups (the authors' WebShop SAMPO
  # script), `mean_std` also divides by the group standard deviation (their ALFWorld scripts).
  lfm2.5-2.6b/automationbench-manifest-steps-sampo-2-g16x8-mean-v1:
    selection_type: sampo-settings
    revision: "1"
    loop:
      max_steps: 8
      max_length: 28672
      learning_rate: 0.00006
      lr_scheduler_type: constant
      logging_steps: 1
      checkpoint_steps: 8
      checkpoint_limit: 1
      gradient_checkpointing: true
      seed: 42
    num_prompts_per_step: 16
    num_generations: 8
    max_prompt_length: 20480
    max_completion_length: 4096
    beta: 0.01
    kl_reference: base
    discount_gamma: 0.95
    step_advantage_weight: 1.0
    advantage_normalization: mean
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    active_sampling: {max_candidate_batches: 5, oversample: 4, oversample_refill: 4}
    truncation_penalty: 0.1
    clip_epsilon_low: 0.003
    clip_epsilon_high: 0.004
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1
    policy_updates:
      schedule: {unit: episode, budget: 32, epochs: 1, order: native, max_applied_updates: 8}
      execution: {records: 1, context_tokens: 28672, statistic_bytes: 268435456}

  lfm2.5-2.6b/automationbench-manifest-steps-sampo-2-g16x8-mean-std-v1:
    selection_type: sampo-settings
    revision: "1"
    loop:
      max_steps: 8
      max_length: 28672
      learning_rate: 0.00006
      lr_scheduler_type: constant
      logging_steps: 1
      checkpoint_steps: 8
      checkpoint_limit: 1
      gradient_checkpointing: true
      seed: 42
    num_prompts_per_step: 16
    num_generations: 8
    max_prompt_length: 20480
    max_completion_length: 4096
    beta: 0.01
    kl_reference: base
    discount_gamma: 0.95
    step_advantage_weight: 1.0
    advantage_normalization: mean_std
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    active_sampling: {max_candidate_batches: 5, oversample: 4, oversample_refill: 4}
    truncation_penalty: 0.1
    clip_epsilon_low: 0.003
    clip_epsilon_high: 0.004
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1
    policy_updates:
      schedule: {unit: episode, budget: 32, epochs: 1, order: native, max_applied_updates: 8}
      execution: {records: 1, context_tokens: 28672, statistic_bytes: 268435456}

  # The 8 GB card's vLLM manifest-credit check: 1 prompt x 8 attempts (the 2.6B run's group
  # size, in the engine's 8 sequences), two collections of two minibatch updates each, so the sequence-level clip
  # acts on the second update; update context above vLLM's 6144-token limit.
