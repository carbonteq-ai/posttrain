# AutomationBench manifest step credit (docs/plan/automationbench-manifest-reward-release-and-sampo.md).
# Environment da8bb32 (f587146 + manifest coverage campaign, Verifiers 58df1306): the official partial credit stays the episode reward; installed
# manifests add goal credit and harm debit to the turn (step) whose tool call produced
# them (turn-reward scorer version 3). Settings use the 0.4.14 resolved policy-update engine.
environment:
  # The last H100 SAMPO run's environment (14 turns, 6144 tokens per reply, 18432 output
  # tokens per episode, mix-v2, turn budget 14, mistake penalty) with manifest findings
  # and manifest step credit selected.
  automationbench-manifest-steps-mixv2-6k14t-v1: &automationbench_manifest_steps
    category: agentic-tool-use
    source:
      package: automationbench-v1
      repository: https://github.com/carbonteq-ai/verifiers-environments
      revision: da8bb3248d405ffc3db47431322b70e8256f93a3
      subdirectory: environments/automationbench_v1
    activation:
      kind: verifiers-config
      config:
        taskset:
          id: automationbench-v1
          domains: [simple, sales, marketing, operations, support, finance, hr]
          # automationbench-manifest-luna-v1: installed manifests that bind and agree with
          # Luna's recorded episodes (scripts/qualification/fixtures/automationbench_manifest_luna_v1.json).
          task_names:
            - finance.cash_flow_forecast
            - finance.cost_center_allocation
