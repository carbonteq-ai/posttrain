  inference/lfm2.5-2.6b-vllm-manifest-ws-c180-6k-t08-fp16@1:
    revision: "1"
    model: models/lfm2.5-2.6b@bf16
    backend: vllm@0.29.1.dev4
    renderer: lfm2.5-tools-thinking@2
    engine:
      mode: colocate
      request_mode: async
      sleep_during_optimization: true
      gpu_memory_utilization: 0.72
      tensor_parallel_size: 1
      max_model_len: 28672
