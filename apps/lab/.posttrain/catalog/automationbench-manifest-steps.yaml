            - support.zendesk_gdpr_purge
            - support.zendesk_intercom_company_sync
            - support.zendesk_sf_case_sync
            - support.zoho_desk_customer_journey
            - support.zoho_multitenant_isolation
          task:
            toolset: limited_zapier
            search_top_k: 20
            turn_budget: 14
            # Linked tool execution (needed by manifest findings and step credit)
            # runs only when the task captures actions; without it every tool call fails.
            capture_actions: true
            # Tool servers fork from a warm preloaded interpreter. Stated explicitly:
            # Verifiers fixes this default at import time, so the serialized task
            # config otherwise depends on whether VF_FORK_SERVER was set first.
            tools:
              runtime:
                type: subprocess
                fork_server: true
                preload: [anyio, httpx, mcp, mcp.client.streamable_http, openai, tenacity, pydantic, automationbench_v1.limited_tools]
            manifest_assessments: true
            turn_rewards:
              tool_failure_penalty: 0.02
              manifest_goal_share: 0.5
              manifest_harm_penalty: 0.1
              manifest_harm_cap: 0.3
            mistake_penalty: {per_mistake: 0.02, cap: 0.1}
        retries: {max_retries: 2}
        agent:
          harness: {id: "null"}
          runtime: {type: subprocess}
          timeout: {setup: 120, rollout: 1800, finalize: 60, scoring: 900}
          max_turns: 14
          max_output_tokens: 18432
    sampling: {max_tokens: 6144, temperature: 0.8, top_p: 1.0}
    num_tasks: 85
    num_rollouts: 6
    max_concurrent: 180
