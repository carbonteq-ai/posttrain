      reasoning_parser: gemma4
    sampling:
      max_tokens: 128
      temperature: 0.0
    target: targets/carbonteq-rtx-pro-6000-96gb
    purpose: [screen, smoke]
    performance_acknowledgements:
      VLLM_EAGER_DISABLES_CUDA_GRAPHS: >-
