environment:
  gemma4-gsm8k-mtp-qualification:
    category: math-reasoning
    qualification: deferred
    source:
      package: gsm8k-v1
      repository: https://github.com/carbonteq-ai/verifiers-environments
      revision: 5264ec153a543c62688efaa1ffe28aedb247d5bb
      subdirectory: environments/gsm8k_v1
    activation:
      kind: verifiers-config
      config:
        agent:
          harness:
            id: "null"
          runtime:
            type: subprocess
          timeout:
            setup: 120
            rollout: 180
            finalize: 60
            scoring: 120
        taskset:
          id: gsm8k-v1
          split: train
        harness:
          id: "null"
          runtime:
            type: subprocess
        timeout:
          setup: 600
          rollout: 300
          finalize: 120
          scoring: 120
    sampling:
      max_tokens: 512
      temperature: 1.0
      top_p: 1.0
    num_tasks: 1
    num_rollouts: 2
    max_concurrent: 1
    parameters:
      sampling_seed: 0
    reward_components: [reward]
    observation:
      primary_metric: reward
      pass_rate_metric: reward

training:
  gemma4-12b-it/sft-qualification-v1:
    selection_type: sft-settings
    revision: "1"
    loop:
      max_steps: 2
      max_length: 512
      per_device_batch_size: 1
      gradient_accumulation_steps: 1
      learning_rate: 0.0002
      logging_steps: 1
      checkpoint_steps: 2
      checkpoint_limit: 1
  training/gemma4-12b-it-trl-lora-qualification@1:
    selection_type: training-binding
    revision: "1"
    backend: trl@1.12.0.post8
    renderer:
      id: gemma4-off-v1
      model_family: gemma4
      implementation: default
      reasoning_mode: "off"
    update:
      kind: lora
      rank: 8
      alpha: 16
      target_modules: ^model[.]language_model[.]layers[.]\d+[.](self_attn[.](q_proj|k_proj|v_proj|o_proj)|mlp[.](gate_proj|up_proj|down_proj))$
    target: targets/carbonteq-rtx-pro-6000-96gb
    runtime:
      global_batch_size: 1
    backend_options:
      source_revision: 6e7739b8ec741d21ecd79c0c212694cd15ff20d8
      dependency_lock_sha256: 900ca2610e41c933ed8a08fa54f60415718aa883f1dbb1aff5b2f21696b8efed
  gemma4-31b-it/sft-qualification-v1:
