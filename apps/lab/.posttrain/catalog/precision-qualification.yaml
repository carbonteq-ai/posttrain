# Trainer / rollout precision qualification on the local 8 GB GPU
# (docs/plan/fp16-training-precision.md). Two arms share one seed, dataset,
# settings and LoRA update and differ only in precision, replicating the two
# end points of the precision ablation in Qi et al. 2025, "Defeating the
# Training-Inference Mismatch via FP16" (arXiv 2510.26788, Section 4.4, Fig. 5):
#   arm 1: trainer bf16 / vLLM bf16 (the baseline that collapses in the paper)
#   arm 4: trainer fp16 / vLLM fp16 (the paper's recommendation)
environment:
  # gsm8k-grpo-qualification with enough tasks for 100 shuffled updates of four
  # prompts, and rollouts in parallel (that selection runs 2 tasks, one at a time).
  # Deferred like the other lab GSM8K environments: the taskset downloads the
  # pinned openai/gsm8k revision from the Hugging Face Hub at run time, so a
  # launch needs --allow-deferred-qualification.
  gsm8k-grpo-precision:
    category: math-reasoning
    qualification: deferred
    source:
      package: gsm8k-v1
      repository: https://github.com/carbonteq-ai/verifiers-environments
      revision: 11f4d712806d292c6c6a752af046f4e16c4f037e
      subdirectory: environments/gsm8k_v1
    activation:
      kind: verifiers-config
      config:
        # Verifiers e6a3d9bb accepts the harness and timeouts only under agent.
        agent:
          harness: {id: "null"}
          runtime: {type: subprocess}
          timeout: {setup: 120, rollout: 180, finalize: 60, scoring: 120}
        taskset:
          id: gsm8k-v1
          dataset_repo: openai/gsm8k
          dataset_revision: 740312add88f781978c0658806c59bc2815b9866
          dataset_config: main
          split: train
    sampling: {max_tokens: 384, temperature: 1.0, top_p: 1.0}
    num_tasks: 512
    num_rollouts: 8
    max_concurrent: 8

training:
  qwen3.5-0.8b/gsm8k-grpo-precision-v1:
    selection_type: grpo-settings
    revision: "1"
    loop:
      max_steps: 100
      max_length: 640
      per_device_batch_size: 1
      gradient_accumulation_steps: 32
      learning_rate: 0.00004
      lr_scheduler_type: constant
      logging_steps: 1
      checkpoint_steps: 50
      checkpoint_limit: 1
      gradient_checkpointing: true
      seed: 1729
    num_prompts_per_step: 4
    num_generations: 8
    max_prompt_length: 256
    max_completion_length: 384
    beta: 0.005
    # Token-level truncated importance sampling at cap 2, as the paper's
    # GRPO-Token-TIS LoRA case and the production SAMPO/OLMo 3 runs.
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    shuffle_prompts: true
  training/qwen3.5-0.8b-trl-grpo-precision-bf16@1:
    selection_type: training-binding
    revision: "1"
    backend: trl@1.12.0.post14
    renderer:
      id: qwen3.5-off-v1
      model_family: qwen3.5
      implementation: qwen3.5
      reasoning_mode: "off"
    update: {kind: lora, rank: 8, alpha: 16, target_modules: all-linear}
    target: targets/local-cuda-8gb
    parallelism: {sequence_length_divisor: 2}
    runtime: {global_batch_size: 32, devices_per_node: 1, timeout_seconds: 1800}
    backend_options:
      use_liger_kernel: false
      logits_chunk_size: 64
      training_precision: bf16
      dependency_lock: trl-fork@current
      source_revision: 09312dd1d96603587d1a24c3b714836cf67400f1
      dependency_lock_sha256: ce6586933e9862e10c14662172e251c370c9e718a8d88c3f19a21d8663b38b04
  training/qwen3.5-0.8b-trl-grpo-precision-fp16@1:
    selection_type: training-binding
    revision: "1"
    backend: trl@1.12.0.post14
    renderer:
      id: qwen3.5-off-v1
      model_family: qwen3.5
      implementation: qwen3.5
      reasoning_mode: "off"
    update: {kind: lora, rank: 8, alpha: 16, target_modules: all-linear}
    target: targets/local-cuda-8gb
    parallelism: {sequence_length_divisor: 2}
    runtime: {global_batch_size: 32, devices_per_node: 1, timeout_seconds: 1800}
    backend_options:
      use_liger_kernel: false
      logits_chunk_size: 64
      training_precision: fp16
      dependency_lock: trl-fork@current
      source_revision: 09312dd1d96603587d1a24c3b714836cf67400f1
      dependency_lock_sha256: ce6586933e9862e10c14662172e251c370c9e718a8d88c3f19a21d8663b38b04

  # LFM2.5-2.6B SAMPO precision canaries on the RTX PRO 6000
  # (docs/plan/fp16-training-precision.md, "Workstation runbook"): the
  # continuation's settings (lfm2.5-2.6b/automationbench-sampo-turns-100-g24x6-
  # lr5e-5-kl1e-2-t05-local-v1) cut to five updates. warmup_ratio 0.99 gives five
  # warmup updates, the continuation's own warmup (5 of 100), so both canaries
  # follow the continuation's first five learning rates.
  lfm2.5-2.6b/automationbench-sampo-turns-5-g24x6-lr5e-5-kl1e-2-t05-precision-canary-v1:
    selection_type: sampo-settings
    revision: "1"
    loop:
      max_steps: 5
      max_length: 24576
      per_device_batch_size: 1
      gradient_accumulation_steps: 144
      learning_rate: 0.00005
      lr_scheduler_type: constant_with_warmup
      warmup_ratio: 0.99
      logging_steps: 1
      checkpoint_steps: 5
      checkpoint_limit: 1
    num_prompts_per_step: 24
    num_generations: 6
    max_prompt_length: 20480
    max_completion_length: 4096
    beta: 0.01
    discount_gamma: 0.95
    step_advantage_weight: 1.0
    advantage_normalization: mean
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    active_sampling: {max_candidate_batches: 6}
    adaptive_curriculum:
      class_field: domain
      policy: yield_first
      exploration_share: 0.2
      uncertainty_weight: 4.0
      evidence_half_life_steps: 20.0
      yield_prior_strength: 4.0
      history_groups: 4
      seed: 172846
    truncation_penalty: 0.1
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1
  # training/lfm2.5-2.6b-trl-lora-automationbench-local-g144-w12@1 with the
  # trainer in float16 (dynamic loss scaling, float32 LoRA master weights).
  training/lfm2.5-2.6b-trl-lora-automationbench-local-g144-w12-fp16@1:
    selection_type: training-binding
    revision: "1"
    backend: trl@1.12.0.post14
    renderer:
      id: lfm2.5-tools-thinking@2
      model_family: lfm2.5
      implementation: default
      reasoning_mode: native
    update: {kind: lora, rank: 4, alpha: 8, target_modules: all-linear}
    target: targets/carbonteq-rtx-pro-6000-96gb
    parallelism: {sequence_length_divisor: 2}
    runtime: {global_batch_size: 144, devices_per_node: 1, timeout_seconds: 43200}
    backend_options:
      rollout_execution: {env_workers: 12, episodes_per_worker: 12, worker_native_threads: 1}
      use_liger_kernel: false
      logits_chunk_size: 128
      compile_decoder_layers: true
      importance_sampling_from_training_logps: true
      vllm_policy_parity_max_sequence_tokens: 4096
      training_precision: fp16
      dependency_lock: trl-fork@current
      source_revision: 09312dd1d96603587d1a24c3b714836cf67400f1
      dependency_lock_sha256: ce6586933e9862e10c14662172e251c370c9e718a8d88c3f19a21d8663b38b04

  # LFM2.5-2.6B SAMPO from the base model (fresh LoRA adapter) in fp16 on the
  # trainer and the rollout engine (docs/plan/lfm26-sampo-fp16-base.md; evidence in
  # docs/techniques/grpo/lora-rl.md). The g24x6 lineage with: LoRA rank 4 / alpha 8
  # (as SAMPO r2) at learning rate 6e-5 constant (alpha x LR 4.8e-4, 1.2x r2's
  # stable 4e-4 and below v5's drifting 8e-4), KL 0.01 anchored to the base model
  # (the continuations anchored to their moving start adapter), active sampling
  # that oversamples 4 extra prompt groups in the first round and 5 in each refill,
  # capped at the first round's (24 + 4) x 6 = 168 episodes, and a checkpoint every
  # 20 updates.
  lfm2.5-2.6b/automationbench-sampo-turns-100-g24x6-r4-lr6e-5-kl1e-2-t08-os4r5-v1:
    selection_type: sampo-settings
    revision: "1"
    loop:
      max_steps: 100
      max_length: 24576
      per_device_batch_size: 1
      gradient_accumulation_steps: 144
      learning_rate: 0.00006
      lr_scheduler_type: constant
      logging_steps: 1
      checkpoint_steps: 20
      checkpoint_limit: 5
      gradient_checkpointing: true
    num_prompts_per_step: 24
    num_generations: 6
    max_prompt_length: 20480
    max_completion_length: 4096
    beta: 0.01
    kl_reference: base
    discount_gamma: 0.95
    step_advantage_weight: 1.0
    advantage_normalization: mean
    importance_sampling_mode: token_truncate
    importance_sampling_clip_min: null
    importance_sampling_clip_max: 2.0
    active_sampling: {max_candidate_batches: 6, oversample: 4, oversample_refill: 5}
    adaptive_curriculum:
      class_field: domain
      policy: yield_first
      exploration_share: 0.2
      uncertainty_weight: 4.0
      evidence_half_life_steps: 20.0
      yield_prior_strength: 4.0
      history_groups: 4
      seed: 172846
    truncation_penalty: 0.1
    shuffle_prompts: true
    mask_truncated_completions: false
    max_admission_attempts: 1
  # training/lfm2.5-2.6b-trl-lora-automationbench-local-g144-w12-fp16@1 on TRL
  # 1.12.0.post12 with SAMPO r2's rank-4, alpha-8 LoRA adapter, float32 logits stated explicitly, the
  # 1024 starting loss scale stated explicitly, 180 environment worker slots
  # (12 x 15) for the oversampled rounds, and a 24-hour job limit.
  training/lfm2.5-2.6b-trl-lora-automationbench-local-g144-w12-r4-fp16@1:
    selection_type: training-binding
    revision: "1"
    backend: trl@1.12.0.post14
    renderer:
      id: lfm2.5-tools-thinking@2
      model_family: lfm2.5
      implementation: default
      reasoning_mode: native
    update: {kind: lora, rank: 4, alpha: 8, target_modules: all-linear}
    target: targets/carbonteq-rtx-pro-6000-96gb
    parallelism: {sequence_length_divisor: 2}
    runtime: {global_batch_size: 144, devices_per_node: 1, timeout_seconds: 86400}
    backend_options:
      rollout_execution: {env_workers: 12, episodes_per_worker: 15, worker_native_threads: 1}
      use_liger_kernel: false
      logits_chunk_size: 128
      compile_decoder_layers: true
      importance_sampling_from_training_logps: true
      vllm_policy_parity_max_sequence_tokens: 4096
      training_precision: fp16
      fp16_initial_loss_scale: 1024
      logits_float32: true
      dependency_lock: trl-fork@current
      source_revision: 09312dd1d96603587d1a24c3b714836cf67400f1
      dependency_lock_sha256: ce6586933e9862e10c14662172e251c370c9e718a8d88c3f19a21d8663b38b04

  # veRL precision qualification on the local 8 GB GPU with the veRL runtime
  # (fork 0.9.0.post8, ef1c3771; post4 added the loss scale, skipped steps and
  # the log-prob gap): four GRPO updates, bf16 against fp16 (FSDP fp16 compute
  # over fp32 master weights with dynamic loss scaling).
  qwen3.5-0.8b/verl-gsm8k-grpo-precision-v1:
    selection_type: grpo-settings
    revision: "1"
    loop:
      max_steps: 4
      max_length: 640
      per_device_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 0.00004
      lr_scheduler_type: constant
      logging_steps: 1
      checkpoint_steps: 0
      checkpoint_limit: 1
      seed: 1729
    num_prompts_per_step: 2
    num_generations: 4
    max_prompt_length: 256
    max_completion_length: 384
    beta: 0.005
    shuffle_prompts: true
  training/qwen3.5-0.8b-verl-grpo-precision-bf16-local@1: &verl_precision_training
    selection_type: training-binding
    revision: "1"
    backend: verl@ef1c37715fa75de5973ae5b3c398383cd7e0093d
    renderer:
      id: qwen3.5-off-v1
      model_family: qwen3.5
      implementation: qwen3.5
      reasoning_mode: "off"
    update:
      kind: lora
      rank: 8
      alpha: 16
      target_modules: ".*language_model.*[.](o_proj|down_proj)$"
    target: targets/local-cuda-8gb
    parallelism:
      sequence_length_divisor: 2
    runtime:
      global_batch_size: 8
      nodes: 1
      devices_per_node: 1
      parameter_offload: true
      optimizer_offload: true
    backend_options: &verl_precision_options
      python_executable: /opt/posttrain-verl/bin/python
      working_directory: /opt/posttrain-verl/workdir
      source_revision: ef1c37715fa75de5973ae5b3c398383cd7e0093d
      dependency_lock_sha256: cdd614f2ab442c655ee211ab433030dcddf6367c2b27eaae801a89495807dbdd
      source_dirty: false
      attention_implementation: sdpa
      training_precision: bf16
      hydra_overrides:
        - actor_rollout_ref.model.use_remove_padding=false
        - actor_rollout_ref.model.enable_gradient_checkpointing=true
        - actor_rollout_ref.model.use_fused_kernels=true
        - actor_rollout_ref.model.fused_kernel_options.impl_backend=torch
        - actor_rollout_ref.actor.strategy=fsdp2
        - actor_rollout_ref.actor.entropy_from_logits_with_chunking=true
        - actor_rollout_ref.actor.entropy_from_logits_chunk_size=256
        - actor_rollout_ref.actor.fsdp_config.use_torch_compile=false
        # The 62 GB local host with a desktop hit Ray's 95% RAM threshold: veRL's
        # default 8 reward workers plus 8 TransferQueue storage units took about 7.4 GB.
        - reward.num_workers=2
        - transfer_queue.backend.SimpleStorage.num_data_storage_units=2
  training/qwen3.5-0.8b-verl-grpo-precision-fp16-local@1:
    <<: *verl_precision_training
    backend_options:
      <<: *verl_precision_options
      training_precision: fp16

inference:
  # inference/qwen3.5-0.8b-vllm-distill-rollout@4 with an explicit rollout dtype.
  inference/qwen3.5-0.8b-vllm-precision-rollout-bf16@1:
    revision: "1"
    model: models/qwen3.5-0.8b@bf16
    backend: vllm@0.29.1.dev4
    renderer: qwen3.5-tools@1
    engine: &precision_rollout_engine
      mode: colocate
      sleep_during_optimization: true
      gpu_memory_utilization: 0.37
      tensor_parallel_size: 1
      max_model_len: 768
      max_num_seqs: 32
      max_num_batched_tokens: 8192
      enable_prefix_caching: true
      enable_chunked_prefill: true
      text_only: true
      skip_mm_profiling: true
      kv_cache_memory_bytes: 268435456
      weight_sync_mode: lora
      weight_name_prefix: language_model.
      enforce_eager: false
      dtype: bfloat16
    sampling: {max_tokens: 384, temperature: 1.0, top_p: 1.0}
    target: targets/local-cuda-rollout-8gb
    purpose: [rollout]
  inference/qwen3.5-0.8b-vllm-precision-rollout-fp16@1:
    revision: "1"
    model: models/qwen3.5-0.8b@bf16
    backend: vllm@0.29.1.dev4
    renderer: qwen3.5-tools@1
    engine:
      <<: *precision_rollout_engine
      dtype: float16
    sampling: {max_tokens: 384, temperature: 1.0, top_p: 1.0}
    target: targets/local-cuda-rollout-8gb
    purpose: [rollout]

  # inference/lfm2.5-2.6b-vllm-automationbench-rollout-local-c144-4k-t05@1 with
  # the rollout computed in float16 (the bf16 twin uses that binding unchanged).
  inference/lfm2.5-2.6b-vllm-automationbench-rollout-local-c144-4k-t05-fp16@1:
