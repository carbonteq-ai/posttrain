  # extra 7 GiB (0.60 -> 0.68 of 96 GB). vLLM sleeps during the optimizer step.
  inference/lfm2.5-2.6b-vllm-automationbench-rollout-local-c180-4k-t08-fp16@1:
    revision: "1"
    model: models/lfm2.5-2.6b@bf16
    backend: vllm@0.29.1.dev4
    renderer: lfm2.5-tools-thinking@2
    engine:
      mode: colocate
      request_mode: async
