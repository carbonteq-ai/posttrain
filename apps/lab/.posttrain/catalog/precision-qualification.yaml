      gpu_memory_utilization: 0.68
      tensor_parallel_size: 1
      max_model_len: 24576
      max_num_seqs: 180
      max_num_batched_tokens: 65536
      kv_cache_memory_bytes: 51539607552
      weight_sync_mode: lora
      enforce_eager: false
      enable_chunked_prefill: true
      enable_prefix_caching: true
      flash_attn_version: 2
      attention_backend_priority: [FLASH_ATTN]
      text_only: true
      skip_mm_profiling: true
      speculative_config:
        method: dspark
        model: LiquidAI/LFM2.5-2.6B-DSpark
        revision: 458cedab07d0f7b2b05700c77e1aa463d43d6f04
        num_speculative_tokens: 9
      dtype: float16
    sampling: {max_tokens: 4096, temperature: 0.8, top_p: 1.0}
    target: targets/carbonteq-rtx-pro-6000-96gb
    purpose: [rollout]
    capabilities: [tool-calling]

  inference/qwen3.5-0.8b-vllm-verl-precision-rollout-bf16@1: &verl_precision_rollout
    revision: "1"
    model: models/qwen3.5-0.8b@bf16
    backend: vllm@0.29.1.dev4
    renderer: qwen3.5-tools@1
    engine: &verl_precision_engine
      mode: colocate
      sleep_during_optimization: true
      gpu_memory_utilization: 0.3
      tensor_parallel_size: 1
      max_model_len: 768
      max_num_seqs: 8
      max_num_batched_tokens: 4096
      enable_prefix_caching: true
      enable_chunked_prefill: true
      text_only: true
      skip_mm_profiling: true
      kv_cache_memory_bytes: 268435456
      weight_sync_mode: lora
      enforce_eager: false
      dtype: bfloat16
    sampling: {max_tokens: 384, temperature: 1.0, top_p: 1.0}
    target: targets/local-cuda-rollout-8gb
    purpose: [rollout]
  inference/qwen3.5-0.8b-vllm-verl-precision-rollout-fp16@1:
    <<: *verl_precision_rollout
    engine:
      <<: *verl_precision_engine
      dtype: float16
