      request_mode: async
      sleep_during_optimization: true
      gpu_memory_utilization: 0.60
      tensor_parallel_size: 1
      max_model_len: 24576
      max_num_seqs: 144
      max_num_batched_tokens: 65536
      kv_cache_memory_bytes: 44023414784
      weight_sync_mode: lora
      enforce_eager: false
      enable_chunked_prefill: true
      enable_prefix_caching: true
      flash_attn_version: 2
      attention_backend_priority: [FLASH_ATTN]
      text_only: true
      skip_mm_profiling: true
      speculative_config:
        method: dspark
        model: LiquidAI/LFM2.5-2.6B-DSpark
        revision: 458cedab07d0f7b2b05700c77e1aa463d43d6f04
        num_speculative_tokens: 9
      dtype: float16
    sampling: {max_tokens: 4096, temperature: 0.5, top_p: 0.95}
    target: targets/carbonteq-rtx-pro-6000-96gb
    purpose: [rollout]
    capabilities: [tool-calling]

  # inference/lfm2.5-2.6b-vllm-automationbench-rollout-local-c144-4k-t05-fp16@1
  # for 180 concurrent episodes. c144's 41 GiB cache held about 11K tokens per
  # episode at 144; 48 GiB holds about 1.9M tokens, the same per-episode room
