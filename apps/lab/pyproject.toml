[project]
name = "posttrain-lab"
version = "0.3.0"
description = "Qualification project and scenario CLI for post-training jobs"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common==0.3.0",
    "posttrain-catalog==0.3.0",
    "posttrain-data==0.3.0",
    "posttrain-eval==0.3.0",
    "posttrain-jobs==0.3.0",
    "posttrain-serve==0.3.0",
    "posttrain-tracking==0.3.0",
    "posttrain-tracking-trackio==0.3.0",
    "posttrain-tracking-wandb==0.3.0",
    "posttrain-train==0.3.0",
    "posttrain-work==0.3.0",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
    "carbonteq-trackio @ git+https://github.com/carbonteq-ai/trackio.git@703be3808cb6cac52259cb15e614cad971978d2e",
]

[project.optional-dependencies]
gpu-eval = [
    "posttrain-eval[verifiers]==0.3.0",
    "posttrain-serve[vllm]==0.3.0",
]
gpu-train = [
    "posttrain-train[trl]==0.3.0",
]
gpu-posttrain = [
    "automationbench-v1",
    "posttrain-eval[verifiers]==0.3.0",
    "posttrain-train[trl,trl-vllm]==0.3.0",
]

[project.scripts]
posttrain-lab = "posttrain_lab.cli:main"

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-catalog = { workspace = true }
posttrain-data = { workspace = true }
posttrain-eval = { workspace = true }
posttrain-jobs = { workspace = true }
posttrain-serve = { workspace = true }
posttrain-tracking = { workspace = true }
posttrain-tracking-trackio = { workspace = true }
posttrain-tracking-wandb = { workspace = true }
posttrain-train = { workspace = true }
posttrain-work = { workspace = true }
automationbench-v1 = { path = "../../environments/automationbench_v1" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_lab"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
