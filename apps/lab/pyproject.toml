[project]
name = "posttrain-lab"
version = "0.0.0"
description = "Qualification project and scenario CLI for post-training jobs"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common",
    "posttrain-catalog",
    "posttrain-data",
    "posttrain-eval",
    "posttrain-jobs",
    "posttrain-serve",
    "posttrain-tracking",
    "posttrain-tracking-trackio",
    "posttrain-tracking-wandb",
    "posttrain-train",
    "posttrain-work",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
gpu-eval = [
    "posttrain-eval[verifiers]",
    "posttrain-serve[vllm]",
]
gpu-train = [
    "posttrain-train[trl]",
]
gpu-posttrain = [
    "posttrain-eval[verifiers]",
    "posttrain-train[trl,trl-vllm]",
]

[project.scripts]
posttrain-lab = "posttrain_lab.cli:main"

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-catalog = { workspace = true }
posttrain-data = { workspace = true }
posttrain-eval = { workspace = true }
posttrain-jobs = { workspace = true }
posttrain-serve = { workspace = true }
posttrain-tracking = { workspace = true }
posttrain-tracking-trackio = { workspace = true }
posttrain-tracking-wandb = { workspace = true }
posttrain-train = { workspace = true }
posttrain-work = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_lab"]

[tool.posttrain.pack]
# Lab becomes an independently packable project in Milestone 3.  This
# declaration is deliberately usable before that move: the project source is
# Lab only, while `.posttrain` control data is bundled through the job-package
# closure rather than installed as Python source.
project_packages = ["."]
source_includes = ["README.md", "pyproject.toml", "src"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
