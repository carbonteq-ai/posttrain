[project]
name = "posttrain-runtime"
version = "0.1.0"
description = "Stable worker entrypoint for verified posttrain job manifests"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "posttrain-catalog",
    "posttrain-common",
    "posttrain-data",
    "posttrain-eval",
    "posttrain-execution",
    "posttrain-jobs",
    "posttrain-work",
]

[project.optional-dependencies]
trackio = [
    "posttrain-tracking-trackio",
]
wandb = [
    "posttrain-tracking-wandb",
]

[project.scripts]
posttrain-runtime = "posttrain_runtime.cli:main"

[tool.uv]
package = true

[tool.uv.sources]
posttrain-catalog = { workspace = true }
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }
posttrain-eval = { workspace = true }
posttrain-execution = { workspace = true }
posttrain-jobs = { workspace = true }
posttrain-tracking-trackio = { workspace = true }
posttrain-tracking-wandb = { workspace = true }
posttrain-work = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_runtime"]
