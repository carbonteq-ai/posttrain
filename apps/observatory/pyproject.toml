[project]
name = "posttrain-observatory"
version = "0.1.1"
description = "Dedicated post-training observability and analysis product"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.136.3,<0.137",
    "httpx>=0.28,<1",
    "mcp>=1.28,<2",
    "posttrain-common",
    "posttrain-tracking",
    "posttrain-tracking-trackio",
    "posttrain-tracking-wandb",
    "pydantic>=2.12,<3",
    "uvicorn>=0.51,<0.52",
]

[project.scripts]
posttrain-observatory = "posttrain_observatory.cli:main"

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-tracking = { workspace = true }
posttrain-tracking-trackio = { workspace = true }
posttrain-tracking-wandb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_observatory"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
