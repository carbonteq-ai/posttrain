[project]
name = "posttrain-release"
version = "0.1.9"
description = "Framework-owner tooling that publishes runtime images and pins the release manifest"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-execution==0.1.9",
    "posttrain-execution-buildkit==0.1.9",
    "posttrain-runtime-images==0.1.9",
    "typer>=0.25.1",
]

[project.scripts]
posttrain-release = "posttrain_release.cli:main"

[tool.uv]
package = true

[tool.uv.sources]
posttrain-execution = { workspace = true }
posttrain-execution-buildkit = { workspace = true }
posttrain-runtime-images = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_release"]
