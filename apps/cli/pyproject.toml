[project]
name = "posttrain"
version = "0.3.0"
description = "Command-line interface for portable post-training projects"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-catalog==0.3.0",
    "posttrain-data==0.3.0",
    "posttrain-execution==0.3.0",
    "posttrain-execution-buildkit==0.3.0",
    "posttrain-execution-pack==0.3.0",
    "posttrain-execution-local==0.3.0",
    "posttrain-jobs==0.3.0",
    "posttrain-project==0.3.0",
    "posttrain-runtime-images==0.3.0",
    "posttrain-tracking==0.3.0",
    "posttrain-work==0.3.0",
    "typer>=0.25.1",
]

[project.optional-dependencies]
observatory = [
    "posttrain-observatory==0.3.0",
]
trackio = [
    "posttrain-tracking-trackio==0.3.0",
]
wandb = [
    "posttrain-tracking-wandb==0.3.0",
]
dstack = [
    "posttrain-execution-dstack==0.3.0",
]
trl = [
    "posttrain-train[trl]==0.3.0",
]
verifiers = [
    "posttrain-eval[verifiers]==0.3.0",
]
vllm = [
    "posttrain-serve[vllm]==0.3.0",
]

[project.scripts]
posttrain = "posttrain_cli.cli:main"

[tool.uv.sources]
posttrain-catalog = { workspace = true }
posttrain-data = { workspace = true }
posttrain-execution = { workspace = true }
posttrain-execution-buildkit = { workspace = true }
posttrain-execution-pack = { workspace = true }
posttrain-execution-dstack = { workspace = true }
posttrain-execution-local = { workspace = true }
posttrain-jobs = { workspace = true }
posttrain-project = { workspace = true }
posttrain-runtime-images = { workspace = true }
posttrain-tracking = { workspace = true }
posttrain-observatory = { workspace = true }
posttrain-eval = { workspace = true }
posttrain-serve = { workspace = true }
posttrain-tracking-trackio = { workspace = true }
posttrain-tracking-wandb = { workspace = true }
posttrain-train = { workspace = true }
posttrain-work = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_cli"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
