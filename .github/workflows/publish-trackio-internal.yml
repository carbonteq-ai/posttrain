name: Publish retained Trackio candidate to development

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable carbonteq-v Trackio release tag
        required: true
        type: string
      wheel_sha256:
        description: Expected SHA-256 of the retained wheel
        required: true
        type: string
      sdist_sha256:
        description: Expected SHA-256 of the retained source distribution
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-trackio:
    runs-on: [self-hosted, linux, x64, lan-release]
    env:
      UV_SYSTEM_CERTS: "true"
      INTERNAL_UPLOAD_URL: https://pypi.lan/carbonteq/dev/
      INTERNAL_SIMPLE_URL: https://pypi.lan/carbonteq/dev/+simple/
    steps:
      - name: Download the immutable GitHub Release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#carbonteq-v}"
          test "${RELEASE_TAG}" = "carbonteq-v${version}"
          mkdir -p trackio-dist
          base_url="https://github.com/carbonteq-ai/trackio/releases/download/${RELEASE_TAG}"
          curl --fail --location --retry 3 \
            "${base_url}/carbonteq_trackio-${version}-py3-none-any.whl" \
            --output "trackio-dist/carbonteq_trackio-${version}-py3-none-any.whl"
          curl --fail --location --retry 3 \
            "${base_url}/carbonteq_trackio-${version}.tar.gz" \
            --output "trackio-dist/carbonteq_trackio-${version}.tar.gz"

      - name: Verify the retained artifact identities
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          SDIST_SHA256: ${{ inputs.sdist_sha256 }}
        run: |
          version="${RELEASE_TAG#carbonteq-v}"
          wheel="trackio-dist/carbonteq_trackio-${version}-py3-none-any.whl"
          sdist="trackio-dist/carbonteq_trackio-${version}.tar.gz"
          test "$(sha256sum "${wheel}" | cut -d ' ' -f 1)" = "${WHEEL_SHA256}"
          test "$(sha256sum "${sdist}" | cut -d ' ' -f 1)" = "${SDIST_SHA256}"
          uvx twine check "${wheel}" "${sdist}"
          sha256sum "${wheel}" "${sdist}" > trackio-internal-SHA256SUMS

      - name: Publish exact bytes to the development index
        run: uv publish --publish-url "${INTERNAL_UPLOAD_URL}" --check-url "${INTERNAL_SIMPLE_URL}" trackio-dist/*

      - name: Prove the candidate is stored in development and installs cleanly
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          SDIST_SHA256: ${{ inputs.sdist_sha256 }}
        run: |
          version="${RELEASE_TAG#carbonteq-v}"
          simple_page="$(curl --fail --location --retry 3 "${INTERNAL_SIMPLE_URL}carbonteq-trackio/")"
          printf '%s\n' "${simple_page}" | grep -F "carbonteq_trackio-${version}-py3-none-any.whl" | grep -F '../../+f/'
          printf '%s\n' "${simple_page}" | grep -F "carbonteq_trackio-${version}.tar.gz" | grep -F '../../+f/'
          mkdir -p trackio-index
          uv venv .trackio-index --clear --python 3.12
          for filename in "carbonteq_trackio-${version}-py3-none-any.whl" "carbonteq_trackio-${version}.tar.gz"; do
            href="$(printf '%s\n' "${simple_page}" | grep -F ">${filename}<" | grep -F '../../+f/' | \
              sed -n 's/.*href="\([^"]*\)".*/\1/p' | head -n 1)"
            test -n "${href}"
            href="${href%%#*}"
            url="$(.trackio-index/bin/python -c \
              'import sys; from urllib.parse import urljoin; print(urljoin(sys.argv[1], sys.argv[2]))' \
              "${INTERNAL_SIMPLE_URL}carbonteq-trackio/" "${href}")"
            curl --fail --location --retry 3 "${url}" --output "trackio-index/${filename}"
          done
          test "$(sha256sum "trackio-index/carbonteq_trackio-${version}-py3-none-any.whl" | cut -d ' ' -f 1)" = "${WHEEL_SHA256}"
          test "$(sha256sum "trackio-index/carbonteq_trackio-${version}.tar.gz" | cut -d ' ' -f 1)" = "${SDIST_SHA256}"
          uv venv .trackio-consumer --python 3.12
          uv pip install --python .trackio-consumer/bin/python \
            --index-url "${INTERNAL_SIMPLE_URL}" "carbonteq-trackio==${version}"
          .trackio-consumer/bin/python -c \
            'import importlib.metadata, trackio; assert importlib.metadata.version("carbonteq-trackio") == trackio.__version__'

      - name: Retain the internal publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trackio-candidate-${{ inputs.release_tag }}
          path: trackio-internal-SHA256SUMS
          if-no-files-found: error
