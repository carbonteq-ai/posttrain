name: Build manual runtime-image candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Pushed framework branch to build
        required: true
        type: string
      framework_version:
        description: Unique candidate label recorded in the generated manifest
        required: true
        type: string
      dependency_channel:
        description: Internal package channel used to materialize the retained lock
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stable

permissions:
  contents: read

jobs:
  build-runtime-images:
    runs-on: [self-hosted, linux, x64, lan-release]
    env:
      UV_SYSTEM_CERTS: "true"
      UV_CACHE_DIR: /var/lib/github-runner/.cache/uv
      JOB_REGISTRY: registry.lan/carbonteq
      CANDIDATE_SIMPLE_URL: https://pypi.lan/carbonteq/dev/+simple/
    steps:
      - name: Checkout the explicit source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Verify the selected branch is current
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          git fetch --no-tags origin "refs/heads/${SOURCE_REF}:refs/remotes/origin/${SOURCE_REF}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/${SOURCE_REF}")"

      - name: Validate candidate source and materialize its runtime lock
        env:
          DEPENDENCY_CHANNEL: ${{ inputs.dependency_channel }}
        run: |
          unset TRACKIO_SERVER_URL POSTTRAIN_TRACKIO_SERVER_URL TRACKIO_WRITE_TOKEN
          # The checked-out source keeps stable as its consumer default. This
          # disposable worktree resolves through dev for pre-promotion
          # qualification, or preserves stable after byte-identical promotion.
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("pyproject.toml")
          source = path.read_text(encoding="utf-8")
          stable = 'url = "https://pypi.lan/carbonteq/stable/+simple/"'
          candidate = 'url = "https://pypi.lan/carbonteq/dev/+simple/"'
          assert source.count(stable) == 1, "candidate index source must be unambiguous"
          channel = os.environ["DEPENDENCY_CHANNEL"]
          assert channel in {"dev", "stable"}
          if channel == "dev":
              source = source.replace(stable, candidate)
          path.write_text(source, encoding="utf-8")
          PY
          uv lock --upgrade-package trl --upgrade-package carbonteq-trackio
          uv sync --all-packages --group dev --frozen --python 3.13
          # The authored profile retains stable consumer pins. This disposable
          # candidate checkout must instead constrain images to the same
          # immutable dev receipts as its freshly resolved lock.
          uv run --no-sync posttrain-release sync-runtime-profile-pins
          # The catalog's dependency receipt is another generated runtime
          # input; it must bind this disposable dev-channel resolution before
          # release consistency validates the image candidate.
          uv run --no-sync posttrain-release lock-dependencies
          uv run --no-sync posttrain-release check --allow-pending-runtime-lock
          uv run --no-sync posttrain-release lock-runtime-dependencies
          uv run --no-sync python - <<'PY'
          import os
          import tomllib

          document = tomllib.loads(open("uv.lock", "rb").read().decode())
          internal = [
              package
              for package in document.get("package", [])
              if isinstance(package, dict)
              and isinstance(package.get("source"), dict)
              and str(package["source"].get("registry", "")).startswith("https://pypi.lan/carbonteq/")
          ]
          assert internal, "candidate lock does not contain any internal package receipts"
          expected = f"https://pypi.lan/carbonteq/{os.environ['DEPENDENCY_CHANNEL']}/"
          assert all(str(package["source"]["registry"]).startswith(expected) for package in internal), (
              f"runtime lock resolved an internal package outside {expected}"
          )
          PY

      - name: Build and publish candidate runtime images
        run: |
          mkdir -p .release/image-receipts
          uv run --no-sync posttrain-release images publish \
            --registry "${JOB_REGISTRY}" \
            --framework-version "${{ inputs.framework_version }}" \
            --receipt-root .release/image-receipts \
            --trust-bundle /etc/ssl/certs/ca-certificates.crt
          uv run --no-sync posttrain-release check

      - name: Retain generated image manifest and receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-runtime-${{ inputs.framework_version }}-${{ github.run_id }}
          path: |
            packages/runtime-images/src/posttrain/runtime_images/published.toml
            packages/runtime-images/src/posttrain/runtime_images/containers/posttrain-job-kinds/locks/*.lock.txt
            uv.lock
            .release/image-receipts/**
          if-no-files-found: error
