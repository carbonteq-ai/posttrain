name: Publish retained TRL candidate to development

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable carbonteq-v TRL release tag
        required: true
        type: string
      wheel_sha256:
        description: Expected SHA-256 of the retained wheel
        required: true
        type: string
      sdist_sha256:
        description: Expected SHA-256 of the retained source distribution
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-trl:
    runs-on: [self-hosted, linux, x64, lan-release]
    env:
      UV_SYSTEM_CERTS: "true"
      INTERNAL_UPLOAD_URL: https://pypi.lan/carbonteq/dev/
      INTERNAL_SIMPLE_URL: https://pypi.lan/carbonteq/dev/+simple/
    steps:
      - name: Download immutable release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#carbonteq-v}"
          test "${RELEASE_TAG}" = "carbonteq-v${version}"
          mkdir -p trl-dist
          base_url="https://github.com/carbonteq-ai/trl/releases/download/${RELEASE_TAG}"
          curl --fail --location --retry 3 \
            "${base_url}/trl-${version}-py3-none-any.whl" \
            --output "trl-dist/trl-${version}-py3-none-any.whl"
          curl --fail --location --retry 3 \
            "${base_url}/trl-${version}.tar.gz" \
            --output "trl-dist/trl-${version}.tar.gz"

      - name: Verify retained artifact identities
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          SDIST_SHA256: ${{ inputs.sdist_sha256 }}
        run: |
          version="${RELEASE_TAG#carbonteq-v}"
          wheel="trl-dist/trl-${version}-py3-none-any.whl"
          sdist="trl-dist/trl-${version}.tar.gz"
          test "$(sha256sum "${wheel}" | cut -d ' ' -f 1)" = "${WHEEL_SHA256}"
          test "$(sha256sum "${sdist}" | cut -d ' ' -f 1)" = "${SDIST_SHA256}"
          uvx twine check "${wheel}" "${sdist}"
          sha256sum "${wheel}" "${sdist}" > trl-internal-SHA256SUMS

      - name: Publish exact bytes to the development index
        run: uv publish --publish-url "${INTERNAL_UPLOAD_URL}" --check-url "${INTERNAL_SIMPLE_URL}" trl-dist/*

      - name: Prove the candidate is stored in development and installs cleanly
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          SDIST_SHA256: ${{ inputs.sdist_sha256 }}
        run: |
          version="${RELEASE_TAG#carbonteq-v}"
          simple_page="$(curl --fail --location --retry 3 "${INTERNAL_SIMPLE_URL}trl/")"
          printf '%s\n' "${simple_page}" | grep -F "trl-${version}-py3-none-any.whl" | grep -F '../../+f/'
          printf '%s\n' "${simple_page}" | grep -F "trl-${version}.tar.gz" | grep -F '../../+f/'
          mkdir -p trl-index
          uv venv .trl-index --clear --python 3.13
          for filename in "trl-${version}-py3-none-any.whl" "trl-${version}.tar.gz"; do
            href="$(printf '%s\n' "${simple_page}" | grep -F ">${filename}<" | grep -F '../../+f/' | \
              sed -n 's/.*href="\([^"]*\)".*/\1/p' | head -n 1)"
            test -n "${href}"
            href="${href%%#*}"
            url="$(.trl-index/bin/python -c \
              'import sys; from urllib.parse import urljoin; print(urljoin(sys.argv[1], sys.argv[2]))' \
              "${INTERNAL_SIMPLE_URL}trl/" "${href}")"
            curl --fail --location --retry 3 "${url}" --output "trl-index/${filename}"
          done
          test "$(sha256sum "trl-index/trl-${version}-py3-none-any.whl" | cut -d ' ' -f 1)" = "${WHEEL_SHA256}"
          test "$(sha256sum "trl-index/trl-${version}.tar.gz" | cut -d ' ' -f 1)" = "${SDIST_SHA256}"
          uv venv .trl-consumer --clear --python 3.13
          uv pip install --python .trl-consumer/bin/python \
            --index-url "${INTERNAL_SIMPLE_URL}" "trl==${version}"
          export EXPECTED_VERSION="${version}"
          .trl-consumer/bin/python - <<'PY'
          import importlib.metadata
          import os
          from trl.trainer.olmo3_grpo_config import Olmo3GRPOConfig

          assert importlib.metadata.version("trl") == os.environ["EXPECTED_VERSION"]
          assert Olmo3GRPOConfig.__name__ == "Olmo3GRPOConfig"
          PY

      - name: Retain internal-publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trl-candidate-${{ inputs.release_tag }}
          path: trl-internal-SHA256SUMS
          if-no-files-found: error
