name: Publish retained TRL release internally

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable carbonteq-v TRL release tag
        required: true
        type: string
      wheel_sha256:
        description: Expected SHA-256 of the retained wheel
        required: true
        type: string
      sdist_sha256:
        description: Expected SHA-256 of the retained source distribution
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-trl:
    runs-on: [self-hosted, linux, x64, lan-release]
    env:
      UV_SYSTEM_CERTS: "true"
      INTERNAL_UPLOAD_URL: https://pypi.lan/carbonteq/stable/
      INTERNAL_SIMPLE_URL: https://pypi.lan/carbonteq/stable/+simple/
    steps:
      - name: Download immutable release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#carbonteq-v}"
          test "${RELEASE_TAG}" = "carbonteq-v${version}"
          mkdir -p trl-dist
          base_url="https://github.com/carbonteq-ai/trl/releases/download/${RELEASE_TAG}"
          curl --fail --location --retry 3 \
            "${base_url}/trl-${version}-py3-none-any.whl" \
            --output "trl-dist/trl-${version}-py3-none-any.whl"
          curl --fail --location --retry 3 \
            "${base_url}/trl-${version}.tar.gz" \
            --output "trl-dist/trl-${version}.tar.gz"

      - name: Verify retained artifact identities
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          SDIST_SHA256: ${{ inputs.sdist_sha256 }}
        run: |
          version="${RELEASE_TAG#carbonteq-v}"
          wheel="trl-dist/trl-${version}-py3-none-any.whl"
          sdist="trl-dist/trl-${version}.tar.gz"
          test "$(sha256sum "${wheel}" | cut -d ' ' -f 1)" = "${WHEEL_SHA256}"
          test "$(sha256sum "${sdist}" | cut -d ' ' -f 1)" = "${SDIST_SHA256}"
          uvx twine check "${wheel}" "${sdist}"
          sha256sum "${wheel}" "${sdist}" > trl-internal-SHA256SUMS

      - name: Publish exact bytes to the stable internal index
        run: uv publish --publish-url "${INTERNAL_UPLOAD_URL}" trl-dist/*

      - name: Prove a clean stable-index install
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#carbonteq-v}"
          uv venv .trl-consumer --clear --python 3.13
          uv pip install --python .trl-consumer/bin/python \
            --index-url "${INTERNAL_SIMPLE_URL}" "trl==${version}"
          export EXPECTED_VERSION="${version}"
          .trl-consumer/bin/python - <<'PY'
          import importlib.metadata
          import os
          from trl.experimental.iw_opd import IWOPDConfig
          from trl.trainer.olmo3_grpo_config import Olmo3GRPOConfig

          assert importlib.metadata.version("trl") == os.environ["EXPECTED_VERSION"]
          assert Olmo3GRPOConfig.__name__ == "Olmo3GRPOConfig"
          config = IWOPDConfig(
              min_p=0.01,
              repetition_penalty=1.1,
              generation_kwargs={"presence_penalty": 1.5},
          )
          assert config.min_p == 0.01
          assert config.repetition_penalty == 1.1
          assert config.generation_kwargs == {"presence_penalty": 1.5}
          PY

      - name: Retain internal-publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trl-internal-${{ inputs.release_tag }}
          path: trl-internal-SHA256SUMS
          if-no-files-found: error
