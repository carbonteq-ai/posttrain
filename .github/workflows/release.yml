name: Publish release

on:
  workflow_dispatch:
    inputs:
      merged_sha:
        description: Exact merged default-branch commit accepted by the candidate gate
        required: true
        type: string
      candidate_run_id:
        description: Successful release-candidate run whose RC and OCI materialization qualify this final release
        required: true
        type: string
      resume_from_run_id:
        description: Optional prior final run whose retained receipt and wheelhouse must be resumed
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: posttrain-release-final
  cancel-in-progress: false

env:
  UV_SYSTEM_CERTS: "true"
  UV_CACHE_DIR: /var/lib/github-runner/.cache/uv
  PYPI_DEV_SIMPLE: https://pypi.lan/carbonteq/dev/+simple/
  PYPI_DEV_PROJECT_SIMPLE: https://pypi.lan/carbonteq/dev/+simple/
  PYPI_DEV_UPLOAD: https://pypi.lan/carbonteq/dev/
  PYPI_STABLE_SIMPLE: https://pypi.lan/carbonteq/stable/+simple/
  PYPI_STABLE_UPLOAD: https://pypi.lan/carbonteq/stable/
  JOB_REGISTRY: registry.lan/carbonteq

jobs:
  publish:
    environment: release
    runs-on: [self-hosted, linux, x64, lan-release]
    steps:
      - name: Checkout the exact merged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.merged_sha }}
          fetch-depth: 0

      - name: Prepare release evidence directory
        run: mkdir -p .release

      - name: Verify the merge target
        env:
          MERGED_SHA: ${{ inputs.merged_sha }}
        run: |
          test "${GITHUB_REPOSITORY}" = carbonteq-ai/posttrain
          git fetch --no-tags origin main
          test "${MERGED_SHA}" = "$(git rev-parse origin/main)"

      - name: Restore retained final evidence for a release resume
        if: inputs.resume_from_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ inputs.merged_sha }}
          RESUME_FROM_RUN_ID: ${{ inputs.resume_from_run_id }}
        run: |
          mkdir -p .release/resume
          resume_run="$(gh run view "${RESUME_FROM_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json workflowName,event,status,conclusion)"
          test "$(jq -r '.workflowName // empty' <<<"${resume_run}")" = "Publish release"
          test "$(jq -r '.event // empty' <<<"${resume_run}")" = workflow_dispatch
          test "$(jq -r '.status // empty' <<<"${resume_run}")" = completed
          test "$(jq -r '.conclusion // empty' <<<"${resume_run}")" = success
          gh run download "${RESUME_FROM_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir .release/resume
          receipt_path="$(find .release/resume -type f -name python-release-receipt.json -print -quit)"
          test -n "${receipt_path}"
          receipt_root="$(dirname "${receipt_path}")"
          cp "${receipt_root}"/* .release/
          source_sha="$(jq -r '.revision // empty' .release/python-release-receipt.json)"
          version="$(jq -r '.version // empty' .release/python-release-receipt.json)"
          test "${#source_sha}" -eq 40
          test -n "${version}"
          git cat-file -e "${source_sha}^{commit}"
          git merge-base --is-ancestor "${source_sha}" "$(git rev-parse origin/main)"
          test "$(git show "${source_sha}:release/manifest.toml" | sed -n 's/^version = "\([^"]*\)"$/\1/p')" = "${version}"
          echo "POSTTRAIN_RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "RELEASE_SOURCE_SHA=${MERGED_SHA}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG_SHA=${MERGED_SHA}" >> "$GITHUB_ENV"
          echo "resuming immutable ${version} artifacts from ${source_sha}"

      - name: Verify the final source and lock
        run: |
          # Broad source checks run once on the exact merged SHA in required
          # CI. The release runner only needs a locked environment and the
          # release-specific manifest check before it handles remote state.
          uv sync --all-packages --group dev --python 3.13 --locked
          uv run --no-sync posttrain-release check

      - name: Materialize and verify the retained release wheelhouse
        if: inputs.resume_from_run_id != ''
        run: |
          archive="$(find .release -maxdepth 1 -type f -name 'posttrain-wheelhouse-*.tar.gz' -print -quit)"
          test -n "${archive}"
          mkdir -p .release/wheelhouse
          tar -xzf "${archive}" -C .release/wheelhouse
          uv run --no-sync posttrain-release receipt-check .release/python-release-receipt.json \
            --distribution-root .release/wheelhouse

      - name: Capture the pre-build BuildKit cache
        if: inputs.resume_from_run_id == ''
        run: buildctl --addr unix:///var/lib/github-runner/buildkit/buildkitd.sock du

      - name: Restore the accepted candidate runtime image manifest
        if: inputs.resume_from_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_SOURCE_SHA: ${{ inputs.merged_sha }}
        run: |
          candidate_run="$(gh run view "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json workflowName,event,status,conclusion,headSha)"
          test "$(jq -r '.workflowName // empty' <<<"${candidate_run}")" = "Prepare release candidate"
          test "$(jq -r '.event // empty' <<<"${candidate_run}")" = "workflow_dispatch"
          test "$(jq -r '.status // empty' <<<"${candidate_run}")" = "completed"
          test "$(jq -r '.conclusion // empty' <<<"${candidate_run}")" = "success"
          candidate_sha="$(jq -r '.headSha // empty' <<<"${candidate_run}")"
          candidate_tree="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${candidate_sha}" \
            --jq '.commit.tree.sha')"
          release_tree="$(git rev-parse "${RELEASE_SOURCE_SHA}^{tree}")"
          # The final wheel carries final version metadata, so it is rebuilt
          # from the accepted materialization rather than byte-promoted from
          # the RC. Ancestry alone is insufficient: an ancestor may be followed
          # by arbitrary package changes. Compare the exact trees and reject
          # every non-release-only change before rebuilding.
          if [[ "${candidate_tree}" = "${release_tree}" ]]; then
            echo "candidate source and merged release tree are identical"
          else
            candidate_ref="refs/remotes/origin/release-candidate-${CANDIDATE_RUN_ID}"
            git fetch --no-tags origin "${candidate_sha}:${candidate_ref}"
            test "$(git rev-parse "${candidate_ref}")" = "${candidate_sha}"
            unsafe_files="$(git diff --name-only "${candidate_sha}" "${RELEASE_SOURCE_SHA}" \
              | while IFS= read -r path; do
                  case "${path}" in
                    .github/*|apps/release/tests/*|docs/plan/*|docs/publishing.md) ;;
                    packages/runtime-images/src/posttrain/runtime_images/published.toml) ;;
                    *) printf '%s\\n' "${path}" ;;
                  esac
                done)"
            if [[ -n "${unsafe_files}" ]]; then
              printf 'candidate build inputs changed:\\n%s\\n' "${unsafe_files}" >&2
              exit 1
            fi
            echo "candidate build inputs are unchanged; only release plumbing differs"
          fi
          candidate_artifact="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.expired == false and (.name | endswith("-evidence"))) | .name' \
            | head -n 1)"
          test -n "${candidate_artifact}"
          mkdir -p .release/candidate
          gh run download "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${candidate_artifact}" \
            --dir .release/candidate
          candidate_manifest="$(find .release/candidate -type f -name published.toml -print -quit)"
          test -n "${candidate_manifest}"
          candidate_runtime_locks="$(find .release/candidate -type d -name runtime-locks -print -quit)"
          test -n "${candidate_runtime_locks}"
          candidate_receipt="$(find .release/candidate -type f -name python-release-receipt.json -print -quit)"
          test -n "${candidate_receipt}"
          candidate_wheelhouse="$(find .release/candidate -type f -name 'posttrain-wheelhouse-*.tar.gz' -print -quit)"
          test -n "${candidate_wheelhouse}"
          candidate_checksums="$(find .release/candidate -type f -name release-SHA256SUMS -print -quit)"
          test -n "${candidate_checksums}"
          candidate_readiness="$(find .release/candidate -type f -name readiness.json -print -quit)"
          test -n "${candidate_readiness}"
          test "$(jq -r '.source_sha // empty' "${candidate_readiness}")" = "${candidate_sha}"
          test "$(jq -r '.source_tree // empty' "${candidate_readiness}")" = "${candidate_tree}"
          candidate_version="$(jq -r '.version // empty' "${candidate_receipt}")"
          release_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' release/manifest.toml)"
          [[ "${candidate_version}" =~ ^${release_version//./\\.}rc[1-9][0-9]*$ ]]
          test "$(sed -n 's/^framework_version = "\([^"]*\)"$/\1/p' "${candidate_manifest}")" = "${release_version}"
          if ! cmp -s \
            "${candidate_manifest}" \
            packages/runtime-images/src/posttrain/runtime_images/published.toml; then
            echo "committed runtime image manifest differs from the accepted candidate" >&2
            exit 1
          fi
          cp "${candidate_manifest}" packages/runtime-images/src/posttrain/runtime_images/published.toml
          cp -a "${candidate_runtime_locks}/." \
            packages/runtime-images/src/posttrain/runtime_images/containers/posttrain-job-kinds/locks/
          cp "${candidate_manifest}" .release/published.toml
          cp -a "${candidate_runtime_locks}" .release/runtime-locks
          cp "${candidate_receipt}" .release/candidate-python-release-receipt.json
          cp "${candidate_wheelhouse}" .release/candidate-wheelhouse.tar.gz
          cp "${candidate_checksums}" .release/candidate-SHA256SUMS
          echo "POSTTRAIN_RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"
          echo "POSTTRAIN_CANDIDATE_VERSION=${candidate_version}" >> "$GITHUB_ENV"
          echo "RELEASE_SOURCE_SHA=${RELEASE_SOURCE_SHA}" >> "$GITHUB_ENV"
          # The tag names the reviewed, CI-green default-branch commit. The
          # promotion receipt separately binds its released bytes to the exact
          # qualified candidate source and tree.
          echo "RELEASE_TAG_SHA=${RELEASE_SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "CANDIDATE_SOURCE_SHA=${candidate_sha}" >> "$GITHUB_ENV"
          echo "CANDIDATE_SOURCE_TREE=${candidate_tree}" >> "$GITHUB_ENV"

      - name: Verify the accepted RC remains intact in development
        if: inputs.resume_from_run_id == ''
        run: |
          mkdir -p .release/candidate-wheelhouse
          tar -xzf .release/candidate-wheelhouse.tar.gz -C .release/candidate-wheelhouse
          uv run --no-sync posttrain-release receipt-check \
            .release/candidate-python-release-receipt.json \
            --distribution-root .release/candidate-wheelhouse
          uv run --no-sync posttrain-release index-check .release/candidate-python-release-receipt.json \
            --simple-base-url "${PYPI_DEV_SIMPLE}"

      - name: Build final-version Python artifacts from the accepted materialization
        if: inputs.resume_from_run_id == ''
        run: |
          scripts/release/build-python-distributions \
            "${POSTTRAIN_RELEASE_VERSION}" \
            "${RELEASE_SOURCE_SHA}" \
            .release
          uv run --no-sync posttrain-release receipt-check .release/python-release-receipt.json \
            --distribution-root .release/distributions

      - name: Bind candidate evidence to the merged release target
        if: inputs.resume_from_run_id == ''
        run: |
          uv run --no-sync posttrain-release promotion-receipt \
            .release/candidate-python-release-receipt.json \
            --final-receipt .release/python-release-receipt.json \
            --target-version "${POSTTRAIN_RELEASE_VERSION}" \
            --destination .release/promotion-receipt.json \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --candidate-source-sha "${CANDIDATE_SOURCE_SHA}" \
            --candidate-source-tree "${CANDIDATE_SOURCE_TREE}" \
            --merged-sha "${RELEASE_SOURCE_SHA}" \
            --merged-tree "$(git rev-parse "${RELEASE_SOURCE_SHA}^{tree}")"

      - name: Publish the final version only to the stable index
        run: |
          if uv run --no-sync posttrain-release index-check .release/python-release-receipt.json \
            --simple-base-url "${PYPI_STABLE_SIMPLE}"; then
            echo "exact final bytes are already present in the stable index; reusing them"
          else
            uv publish --publish-url "${PYPI_STABLE_UPLOAD}" .release/distributions/*
            uv run --no-sync posttrain-release index-check .release/python-release-receipt.json \
              --simple-base-url "${PYPI_STABLE_SIMPLE}"
          fi

      - name: Prove a clean stable-index consumer install
        run: |
          uv venv .release/stable-consumer-venv --python 3.13
          uv pip install \
            --no-cache \
            --python .release/stable-consumer-venv/bin/python \
            --index-url "${PYPI_STABLE_SIMPLE}" \
            "posttrain[dstack,trackio]==${POSTTRAIN_RELEASE_VERSION}" \
            "posttrain-lab==${POSTTRAIN_RELEASE_VERSION}"
          .release/stable-consumer-venv/bin/posttrain --help >/dev/null

      - name: Capture bounded cache evidence
        if: always()
        run: buildctl --addr unix:///var/lib/github-runner/buildkit/buildkitd.sock du > .release/buildkit-cache-after.txt || true

      - name: Retain final receipt and cache evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: posttrain-${{ env.POSTTRAIN_RELEASE_VERSION }}-final-evidence
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .release/python-release-receipt.json
            .release/candidate-python-release-receipt.json
            .release/candidate-wheelhouse.tar.gz
            .release/candidate-SHA256SUMS
            .release/promotion-receipt.json
            .release/posttrain-wheelhouse-*.tar.gz
            .release/release-SHA256SUMS
            .release/SHA256SUMS
            .release/published.toml
            .release/runtime-images-verify.json
            .release/dstack-capacity.json
            .release/buildkit-cache-after.txt

      - name: Tag and create the GitHub release last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code origin "refs/tags/v${POSTTRAIN_RELEASE_VERSION}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/v${POSTTRAIN_RELEASE_VERSION}:refs/tags/v${POSTTRAIN_RELEASE_VERSION}"
            test "$(git rev-parse "v${POSTTRAIN_RELEASE_VERSION}^{}")" = "${RELEASE_TAG_SHA}"
            echo "final tag already points to the immutable artifact commit; reusing it"
          else
            git config user.name carbonteq-release-bot
            git config user.email release-bot@carbonteq.ai
            git tag -a "v${POSTTRAIN_RELEASE_VERSION}" "${RELEASE_TAG_SHA}" -m "Posttrain ${POSTTRAIN_RELEASE_VERSION}"
            git push origin "v${POSTTRAIN_RELEASE_VERSION}"
          fi
          release_assets=(
            ".release/posttrain-wheelhouse-${POSTTRAIN_RELEASE_VERSION}.tar.gz"
            .release/release-SHA256SUMS
            .release/python-release-receipt.json
            .release/promotion-receipt.json
          )
          if gh release view "v${POSTTRAIN_RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${POSTTRAIN_RELEASE_VERSION}" "${release_assets[@]}" --clobber
          else
            gh release create "v${POSTTRAIN_RELEASE_VERSION}" \
            .release/posttrain-wheelhouse-${POSTTRAIN_RELEASE_VERSION}.tar.gz \
            .release/release-SHA256SUMS \
            .release/python-release-receipt.json \
            .release/promotion-receipt.json \
            --title "Posttrain ${POSTTRAIN_RELEASE_VERSION}" \
            --generate-notes
          fi

      - name: Remove only this run's temporary release material
        if: always()
        run: |
          if [[ -d .release ]]; then
            find .release -mindepth 1 -delete
          fi
