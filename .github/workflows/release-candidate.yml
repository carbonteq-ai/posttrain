name: Prepare release candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Internal release branch containing the candidate source
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: posttrain-release-candidate
  cancel-in-progress: false

env:
  UV_SYSTEM_CERTS: "true"
  UV_CACHE_DIR: /var/lib/github-runner/.cache/uv
  PYPI_DEV_SIMPLE: https://pypi.lan/carbonteq/dev/+simple/
  PYPI_DEV_PROJECT_SIMPLE: https://pypi.lan/carbonteq/dev/+simple/posttrain/
  PYPI_DEV_UPLOAD: https://pypi.lan/carbonteq/dev/
  JOB_REGISTRY: registry.lan/carbonteq

jobs:
  candidate:
    environment: release-candidate
    runs-on: [self-hosted, linux, x64, lan-release]
    steps:
      - name: Checkout the approved internal release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Reject stale, forked, or automatic sources
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          test "${GITHUB_REPOSITORY}" = carbonteq-ai/posttrain
          git fetch --no-tags origin main "refs/heads/${SOURCE_REF}:refs/remotes/origin/${SOURCE_REF}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/${SOURCE_REF}")"
          runs="$(gh run list --workflow quality.yml --branch "${SOURCE_REF}" --limit 1 --json headSha,conclusion)"
          test "$(jq -r '.[0].headSha // empty' <<<"${runs}")" = "$(git rev-parse HEAD)"
          test "$(jq -r '.[0].conclusion // empty' <<<"${runs}")" = success

      - name: Validate the source and lock
        run: |
          # The runner service has production Trackio variables for real
          # canaries. Keep the unit/integration suite hermetic so its SQLite
          # fixtures cannot accidentally read or mutate live Trackio.
          unset TRACKIO_SERVER_URL POSTTRAIN_TRACKIO_SERVER_URL TRACKIO_WRITE_TOKEN
          uv sync --all-packages --group dev --python 3.13
          uv run --no-sync posttrain-release check
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync pyright
          uv run --no-sync lint-imports
          uv run --no-sync pytest

      - name: Allocate the next immutable RC
        id: version
        run: |
          version="$(uv run --no-sync posttrain-release candidate-version --simple-url "${PYPI_DEV_PROJECT_SIMPLE}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "candidate=${version}"

      - name: Capture the pre-build BuildKit cache
        run: buildctl --addr unix:///var/lib/github-runner/buildkit/buildkitd.sock du

      - name: Build and hash the Python wheelhouse
        run: |
          scripts/release/build-python-distributions "${{ steps.version.outputs.version }}" "$(git rev-parse HEAD)" .release
          uv run --no-sync posttrain-release receipt-check .release/python-release-receipt.json \
            --distribution-root .release/distributions

      - name: Publish the candidate only to the development index
        run: |
          uv publish --publish-url "${PYPI_DEV_UPLOAD}" .release/distributions/*
          uv run --no-sync posttrain-release index-check .release/python-release-receipt.json \
            --simple-base-url "${PYPI_DEV_SIMPLE}"

      - name: Prove a clean index-only consumer install
        run: |
          uv venv .release/consumer-venv --python 3.13
          uv pip install \
            --python .release/consumer-venv/bin/python \
            --index-url "${PYPI_DEV_SIMPLE}" \
            "posttrain==${{ steps.version.outputs.version }}"
          .release/consumer-venv/bin/posttrain --help >/dev/null

      - name: Build changed OCI inputs and retain the generated manifest
        run: |
          git fetch --no-tags origin main
          if git diff --quiet origin/main...HEAD -- containers packages/runtime-images packages/catalog uv.lock release; then
            echo "No OCI input changed; committed immutable image manifest remains authoritative."
          else
            uv run --no-sync posttrain-release images publish \
              --registry "${JOB_REGISTRY}" \
              --framework-version "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' release/manifest.toml)" \
              --receipt-root .release/image-receipts \
              --trust-bundle /etc/ssl/certs/ca-certificates.crt
          fi
          cp packages/runtime-images/src/posttrain/runtime_images/published.toml .release/published.toml
          uv run --no-sync posttrain-release check
          # Runtime-image verification reads only registry and manifest state;
          # it must not inherit the runner's production Trackio credentials.
          env -u TRACKIO_SERVER_URL -u POSTTRAIN_TRACKIO_SERVER_URL -u TRACKIO_WRITE_TOKEN \
            POSTTRAIN_REGISTRY="${JOB_REGISTRY}" uv run --no-sync posttrain \
            --project-root apps/lab runtime images verify > .release/runtime-images-verify.json

      - name: Run one real packed GPU qualification through dstack
        id: qualification
        run: |
          set +e
          scripts/release/verify-dstack-capacity .release/dstack-capacity.json
          capacity_status=$?
          if [[ "${capacity_status}" -ne 0 ]]; then
            exit "${capacity_status}"
          fi
          uv run --no-sync posttrain --project-root apps/lab job run \
            apps/lab/.posttrain/work_packages/qwen08b_transform_qualification.yaml \
            --job transform \
            --provider dstack \
            --target targets/carbonteq-rtx-pro-6000-96gb \
            --registry "${JOB_REGISTRY}" \
            --framework-wheelhouse .release/wheelhouse \
            --run-id "release-candidate-${{ github.run_id }}"
          status=$?
          uv run --no-sync posttrain --project-root apps/lab run reconcile --last || true
          uv run --no-sync posttrain --project-root apps/lab run cleanup --last || true
          exit "$status"

      - name: Capture the post-build cache and release evidence
        if: always()
        run: |
          buildctl --addr unix:///var/lib/github-runner/buildkit/buildkitd.sock du > .release/buildkit-cache-after.txt || true
          git diff -- packages/runtime-images/src/posttrain/runtime_images/published.toml > .release/published-manifest.diff || true

      - name: Upload candidate receipt and wheelhouse
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: posttrain-${{ steps.version.outputs.version }}-evidence
          path: |
            .release/python-release-receipt.json
            .release/posttrain-wheelhouse-*.tar.gz
            .release/release-SHA256SUMS
            .release/SHA256SUMS
            .release/image-receipts/**
            .release/published.toml
            .release/published-manifest.diff
            .release/runtime-images-verify.json
            .release/dstack-capacity.json
            .release/buildkit-cache-after.txt

      - name: Remove only this run's temporary release material
        if: always()
        run: |
          if [[ -d .release ]]; then
            find .release -mindepth 1 -delete
          fi
