name: Prepare release candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Internal release branch containing the candidate source
        required: true
        type: string
      qualification_profile:
        description: Named hardware profile for the bounded packed-GPU qualification
        required: false
        default: rtx-pro-96gb
        type: choice
        options:
          - rtx-pro-96gb
      retire_failed_candidate_run_id:
        description: Optional failed candidate run whose complete development version may be retired after receipt verification
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: posttrain-release-candidate
  cancel-in-progress: false

env:
  UV_SYSTEM_CERTS: "true"
  UV_CACHE_DIR: /var/lib/github-runner/.cache/uv
  PYPI_DEV_SIMPLE: https://pypi.lan/carbonteq/dev/+simple/
  PYPI_DEV_PROJECT_SIMPLE: https://pypi.lan/carbonteq/dev/+simple/posttrain/
  PYPI_DEV_UPLOAD: https://pypi.lan/carbonteq/dev/
  PYPI_STABLE_SIMPLE: https://pypi.lan/carbonteq/stable/+simple/
  JOB_REGISTRY: registry.lan/carbonteq

jobs:
  candidate:
    environment: release-candidate
    runs-on: [self-hosted, linux, x64, lan-release]
    steps:
      - name: Checkout the approved internal release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Prepare release evidence directory
        run: mkdir -p .release

      - name: Reject stale, forked, or automatic sources
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          test "${GITHUB_REPOSITORY}" = carbonteq-ai/posttrain
          git fetch --no-tags origin main "refs/heads/${SOURCE_REF}:refs/remotes/origin/${SOURCE_REF}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/${SOURCE_REF}")"
          source_sha="$(git rev-parse HEAD)"
          quality_conclusion=""
          quality_status=""
          for attempt in $(seq 1 120); do
            runs="$(gh run list --workflow quality.yml --branch "${SOURCE_REF}" --limit 20 \
              --json databaseId,headSha,conclusion,status,event,createdAt)"
            quality_conclusion="$(jq -r --arg sha "${source_sha}" \
              '[.[] | select(.headSha == $sha and (.event == "push" or .event == "pull_request" or .event == "workflow_dispatch"))] | sort_by(.createdAt) | last.conclusion // empty' \
              <<<"${runs}")"
            quality_status="$(jq -r --arg sha "${source_sha}" \
              '[.[] | select(.headSha == $sha and (.event == "push" or .event == "pull_request" or .event == "workflow_dispatch"))] | sort_by(.createdAt) | last.status // empty' \
              <<<"${runs}")"
            case "${quality_conclusion}" in
              success)
                quality_run_id="$(jq -r --arg sha "${source_sha}" \
                  '[.[] | select(.headSha == $sha and (.event == "push" or .event == "pull_request" or .event == "workflow_dispatch"))] | sort_by(.createdAt) | last.databaseId // empty' \
                  <<<"${runs}")"
                test -n "${quality_run_id}"
                echo "QUALITY_RUN_ID=${quality_run_id}" >> "$GITHUB_ENV"
                break
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "quality run for ${source_sha} ended with ${quality_conclusion}" >&2
                exit 1
                ;;
            esac
            echo "waiting for quality run for ${source_sha}: status=${quality_status:-not-found} attempt=${attempt}/120"
            sleep 5
          done
          test "${quality_conclusion}" = success

      - name: Install locked release tooling
        run: |
          uv sync --all-packages --group dev --python 3.13 --locked

      - name: Restore and verify exact-source readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .release/readiness
          gh run download "${QUALITY_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name posttrain-readiness \
            --dir .release/readiness
          readiness_receipt="$(find .release/readiness -type f -name readiness.json -print -quit)"
          test -n "${readiness_receipt}"
          uv run --no-sync posttrain-release readiness-check "${readiness_receipt}"
          cp "${readiness_receipt}" .release/readiness.json

      - name: Resolve the immutable final version
        id: version
        run: |
          version="$(sed -n 's/^version = "\([^" ]*\)"$/\1/p' release/manifest.toml)"
          test -n "${version}"
          if curl --fail --silent --show-error --max-time 20 \
            "${PYPI_STABLE_SIMPLE}posttrain/" \
            | grep -Eq -- "posttrain-${version}(-py3-none-any[.]whl|[.]tar[.]gz)([<#])"; then
            echo "release/manifest.toml version ${version} is already immutable in stable; advance the release manifest before preparing a candidate" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "final development candidate=${version}"

      - name: Capture the pre-build BuildKit cache
        run: buildctl --addr unix:///var/lib/github-runner/buildkit/buildkitd.sock du

      # Publish OCI inputs before building the wheelhouse. The runtime image
      # manifest is packaged into posttrain-runtime-images, so the consumer
      # venv used by the canary must contain the freshly generated digests.
      - name: Build changed OCI inputs and retain the generated manifest
        run: |
          uv run --no-sync posttrain-release lock-runtime-dependencies
          git fetch --no-tags origin main
          authored_framework_version="$(sed -n 's/^version = "\([^" ]*\)"$/\1/p' release/manifest.toml)"
          published_framework_version="$(sed -n 's/^framework_version = "\([^" ]*\)"$/\1/p' \
            packages/runtime-images/src/posttrain/runtime_images/published.toml)"
          if [[ "${published_framework_version}" = "${authored_framework_version}" ]] \
            && git diff --quiet origin/main...HEAD -- containers packages/runtime-images packages/catalog uv.lock release; then
            echo "No OCI input or framework-version change; committed immutable image manifest remains authoritative."
          else
            uv run --no-sync posttrain-release images publish \
              --registry "${JOB_REGISTRY}" \
              --framework-version "${authored_framework_version}" \
              --receipt-root .release/image-receipts \
              --trust-bundle /etc/ssl/certs/ca-certificates.crt
          fi
          cp packages/runtime-images/src/posttrain/runtime_images/published.toml .release/published.toml
          mkdir -p .release/runtime-locks
          cp -a packages/runtime-images/src/posttrain/runtime_images/containers/posttrain-job-kinds/locks/. \
            .release/runtime-locks/
          uv run --no-sync posttrain-release check
          image_verify_config="${RUNNER_TEMP}/posttrain-image-verify-config"
          mkdir -p "${image_verify_config}"
          image_verify_env="apps/lab/posttrain.env"
          test ! -e "${image_verify_env}"
          printf 'POSTTRAIN_REGISTRY=%s\n' "${JOB_REGISTRY}" > "${image_verify_env}"
          chmod 600 "${image_verify_env}"
          trap 'rm -f "${image_verify_env}"' EXIT
          env -u TRACKIO_SERVER_URL -u POSTTRAIN_TRACKIO_SERVER_URL -u TRACKIO_WRITE_TOKEN \
            XDG_CONFIG_HOME="${image_verify_config}" \
            uv run --no-sync posttrain \
            --project-root apps/lab runtime images verify > .release/runtime-images-verify.json

      - name: Build and hash the Python wheelhouse
        run: |
          scripts/release/build-python-distributions "${{ steps.version.outputs.version }}" "$(git rev-parse HEAD)" .release
          uv run --no-sync posttrain-release receipt-check .release/python-release-receipt.json \
            --distribution-root .release/distributions

      - name: Verify failed candidate retirement authority
        if: inputs.retire_failed_candidate_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_CANDIDATE_RUN_ID: ${{ inputs.retire_failed_candidate_run_id }}
        run: |
          failed_run="$(gh run view "${FAILED_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json workflowName,event,status,conclusion,headSha)"
          test "$(jq -r '.workflowName // empty' <<<"${failed_run}")" = "Prepare release candidate"
          test "$(jq -r '.event // empty' <<<"${failed_run}")" = "workflow_dispatch"
          test "$(jq -r '.status // empty' <<<"${failed_run}")" = "completed"
          test "$(jq -r '.conclusion // empty' <<<"${failed_run}")" = "failure"
          failed_source_sha="$(jq -r '.headSha // empty' <<<"${failed_run}")"
          test -n "${failed_source_sha}"
          mkdir -p .release/failed-candidate
          gh run download "${FAILED_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "posttrain-${{ steps.version.outputs.version }}-evidence" \
            --dir .release/failed-candidate
          failed_receipt="$(find .release/failed-candidate -type f -name python-release-receipt.json -print -quit)"
          test -n "${failed_receipt}"
          test "$(jq -r '.version // empty' "${failed_receipt}")" = "${{ steps.version.outputs.version }}"
          test "$(jq -r '.revision // empty' "${failed_receipt}")" = "${failed_source_sha}"
          cp "${failed_receipt}" .release/failed-candidate-receipt.json
          uv run --no-sync posttrain-release candidate-retirement-check \
            .release/failed-candidate-receipt.json \
            .release/python-release-receipt.json \
            --failed-run-id "${FAILED_CANDIDATE_RUN_ID}" \
            --development-simple-url "${PYPI_DEV_SIMPLE}" \
            --stable-simple-url "${PYPI_STABLE_SIMPLE}" \
            --destination .release/candidate-retirement-preflight.json

      - name: Retire the verified failed development candidate
        if: inputs.retire_failed_candidate_run_id != ''
        env:
          DEVPI_CLIENT: /opt/posttrain-dstack-client/bin/devpi
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: |
          test -x "${DEVPI_CLIENT}"
          "${DEVPI_CLIENT}" use https://pypi.lan/carbonteq/dev
          "${DEVPI_CLIENT}" login "${UV_PUBLISH_USERNAME}" --password "${UV_PUBLISH_PASSWORD}"
          while read -r package; do
            removed=false
            for attempt in 1 2 3; do
              if "${DEVPI_CLIENT}" remove -y --index carbonteq/dev \
                "${package}==${{ steps.version.outputs.version }}"; then
                removed=true
                break
              fi
              echo "retrying retirement of ${package}: attempt ${attempt}/3" >&2
            done
            if [[ "${removed}" != true ]]; then
              echo "could not retire ${package}; completion verification will report remaining files" >&2
            fi
          done < <(jq -r '.packages[]' .release/candidate-retirement-preflight.json)
          uv run --no-sync posttrain-release candidate-retirement-complete \
            .release/failed-candidate-receipt.json \
            .release/python-release-receipt.json \
            --preflight .release/candidate-retirement-preflight.json \
            --development-simple-url "${PYPI_DEV_SIMPLE}" \
            --stable-simple-url "${PYPI_STABLE_SIMPLE}" \
            --destination .release/candidate-retirement.json

      - name: Publish the final candidate only to the development index
        run: |
          if uv run --no-sync posttrain-release index-check .release/python-release-receipt.json \
            --simple-base-url "${PYPI_DEV_SIMPLE}"; then
            echo "exact final bytes are already present in the development index; reusing them"
          else
            while read -r package; do
              normalized="$(printf '%s' "${package}" | tr '[:upper:]' '[:lower:]' | sed 's/[_.]/-/g')"
              if curl --fail --silent --show-error --max-time 20 \
                "${PYPI_DEV_SIMPLE}${normalized}/" \
                | grep -Eqi -- "${normalized}-${{ steps.version.outputs.version }}([.]|$)"; then
                echo "development index already contains ${package} ${{ steps.version.outputs.version }}, but the receipt did not match" >&2
                exit 1
              fi
            done < <(jq -r '.packages[]' .release/python-release-receipt.json)
            uv publish --publish-url "${PYPI_DEV_UPLOAD}" .release/distributions/*
            uv run --no-sync posttrain-release index-check .release/python-release-receipt.json \
              --simple-base-url "${PYPI_DEV_SIMPLE}"
          fi

      - name: Prove a clean index-only consumer install
        run: |
          uv venv .release/consumer-venv --python 3.13
          uv pip install \
            --python .release/consumer-venv/bin/python \
            --index-url "${PYPI_DEV_SIMPLE}" \
            "posttrain[dstack,trackio]==${{ steps.version.outputs.version }}" \
            "posttrain-lab==${{ steps.version.outputs.version }}"
          .release/consumer-venv/bin/posttrain --help >/dev/null

      # The OCI manifest was generated before the wheelhouse was staged.
      - name: Legacy OCI publication location (disabled)
        if: ${{ false }}
        run: |
          git fetch --no-tags origin main
          if git diff --quiet origin/main...HEAD -- containers packages/runtime-images packages/catalog uv.lock release; then
            echo "No OCI input changed; committed immutable image manifest remains authoritative."
          else
            uv run --no-sync posttrain-release images publish \
              --registry "${JOB_REGISTRY}" \
              --framework-version "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' release/manifest.toml)" \
              --receipt-root .release/image-receipts \
              --trust-bundle /etc/ssl/certs/ca-certificates.crt
          fi
          cp packages/runtime-images/src/posttrain/runtime_images/published.toml .release/published.toml
          uv run --no-sync posttrain-release check
          # Runtime-image verification reads only registry and manifest state;
          # it must not inherit the runner's production Trackio credentials.
          image_verify_config="${RUNNER_TEMP}/posttrain-image-verify-config"
          mkdir -p "${image_verify_config}"
          image_verify_env="apps/lab/posttrain.env"
          test ! -e "${image_verify_env}"
          printf 'POSTTRAIN_REGISTRY=%s\n' "${JOB_REGISTRY}" > "${image_verify_env}"
          chmod 600 "${image_verify_env}"
          trap 'rm -f "${image_verify_env}"' EXIT
          env -u TRACKIO_SERVER_URL -u POSTTRAIN_TRACKIO_SERVER_URL -u TRACKIO_WRITE_TOKEN \
            XDG_CONFIG_HOME="${image_verify_config}" \
            uv run --no-sync posttrain \
            --project-root apps/lab runtime images verify > .release/runtime-images-verify.json

      - name: Run one real packed GPU qualification through dstack
        id: qualification
        run: |
          set +e
          case "${{ inputs.qualification_profile }}" in
            rtx-pro-96gb)
              qualification_host="carbonteq-ai-workstation.lan"
              qualification_min_gpu_memory_mib=90112
              ;;
            *)
              echo "unsupported qualification profile: ${{ inputs.qualification_profile }}" >&2
              exit 2
              ;;
          esac
          export POSTTRAIN_DSTACK_HOST="${qualification_host}"
          export POSTTRAIN_DSTACK_MIN_GPU_MEMORY_MIB="${qualification_min_gpu_memory_mib}"
          candidate_version="${{ steps.version.outputs.version }}"
          framework_wheelhouse="$(realpath .release/wheelhouse)"
          # The qualification must pack the same immutable framework bytes that
          # the clean consumer just installed.  Keep this check immediately
          # before packing so a stale runner directory, relative-path change,
          # or versioned candidate mismatch fails with an actionable error.
          .release/consumer-venv/bin/python - "${candidate_version}" "${framework_wheelhouse}" <<'PY'
          import importlib.metadata as metadata
          import sys
          from pathlib import Path

          expected, wheelhouse_name = sys.argv[1:]
          wheelhouse = Path(wheelhouse_name)
          if not wheelhouse.is_dir():
              raise SystemExit(f"framework wheelhouse is not a directory: {wheelhouse}")
          if metadata.version("posttrain") != expected:
              raise SystemExit(
                  "consumer framework version differs from candidate: "
                  f"{metadata.version('posttrain')} != {expected}"
              )
          names = sorted(path.name for path in wheelhouse.glob("*.whl"))
          if not names:
              raise SystemExit(f"framework wheelhouse is empty: {wheelhouse}")
          mismatched = [name for name in names if f"-{expected}-" not in name]
          if mismatched:
              raise SystemExit(
                  f"framework wheelhouse contains non-candidate wheels: {mismatched}"
              )
          print(f"verified consumer and {len(names)} staged framework wheels at {expected}")
          PY
          scripts/release/verify-dstack-capacity .release/dstack-capacity.json
          capacity_status=$?
          if [[ "${capacity_status}" -ne 0 ]]; then
            exit "${capacity_status}"
          fi
          .release/consumer-venv/bin/posttrain --project-root apps/lab job run \
            apps/lab/.posttrain/work_packages/qwen08b_transform_qualification.yaml \
            --job transform \
            --provider dstack \
            --registry "${JOB_REGISTRY}" \
            --framework-wheelhouse "${framework_wheelhouse}" \
            --run-id "release-candidate-${{ github.run_id }}"
          status=$?
          if [[ "${status}" -eq 0 ]]; then
            .release/consumer-venv/bin/posttrain --project-root apps/lab run wait \
              "release-candidate-${{ github.run_id }}" \
              --timeout-seconds 3600 \
              --poll-interval-seconds 10
            status=$?
          fi
          .release/consumer-venv/bin/posttrain --project-root apps/lab run reconcile \
            "release-candidate-${{ github.run_id }}" || true
          .release/consumer-venv/bin/posttrain --project-root apps/lab run cleanup \
            "release-candidate-${{ github.run_id }}" || true
          exit "$status"

      - name: Capture the post-build cache and release evidence
        if: always()
        run: |
          buildctl --addr unix:///var/lib/github-runner/buildkit/buildkitd.sock du > .release/buildkit-cache-after.txt || true
          git diff -- packages/runtime-images/src/posttrain/runtime_images/published.toml > .release/published-manifest.diff || true

      - name: Upload candidate receipt and wheelhouse
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: posttrain-${{ steps.version.outputs.version }}-evidence
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .release/python-release-receipt.json
            .release/readiness.json
            .release/posttrain-wheelhouse-*.tar.gz
            .release/release-SHA256SUMS
            .release/SHA256SUMS
            .release/image-receipts/**
            .release/published.toml
            .release/runtime-locks/**
            .release/published-manifest.diff
            .release/runtime-images-verify.json
            .release/dstack-capacity.json
            .release/buildkit-cache-after.txt
            .release/failed-candidate-receipt.json
            .release/candidate-retirement-preflight.json
            .release/candidate-retirement.json

      - name: Remove only this run's temporary release material
        if: always()
        run: |
          if [[ -d .release ]]; then
            find .release -mindepth 1 -delete
          fi
