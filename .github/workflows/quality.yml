name: Quality

on:
  workflow_dispatch:
    inputs:
      allow_pending_runtime_lock:
        description: Allow the protected candidate workflow to materialize a changed runtime lock
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  CARBONTEQ_TRACKIO_WHEEL_URL: https://github.com/carbonteq-ai/trackio/releases/download/carbonteq-v0.31.5.post14.dev32/carbonteq_trackio-0.31.5.post14.dev32-py3-none-any.whl
  CARBONTEQ_TRACKIO_WHEEL_SHA256: 78e3ecf207c074c43281edff75343086bf379a22cc281308cc12436e5a5260a3
  CARBONTEQ_TRACKIO_WHEEL_PATH: /tmp/carbonteq_trackio-0.31.5.post14.dev32-py3-none-any.whl
  CARBONTEQ_RENDERERS_WHEEL_URL: https://github.com/carbonteq-ai/renderers/releases/download/carbonteq-v0.1.12.post1.dev3/carbonteq_renderers-0.1.12.post1.dev3-py3-none-any.whl
  CARBONTEQ_RENDERERS_WHEEL_SHA256: 57dcc6f8ba2db7bec21c75d40177059f704bb817a772558435e4d34c262ab5eb
  CARBONTEQ_RENDERERS_WHEEL_PATH: /tmp/carbonteq_renderers-0.1.12.post1.dev3-py3-none-any.whl
  CARBONTEQ_TRL_WHEEL_URL: https://github.com/carbonteq-ai/trl/releases/download/carbonteq-v1.12.0.post14/trl-1.12.0.post14-py3-none-any.whl
  CARBONTEQ_TRL_WHEEL_SHA256: ef77a1f07154d3958d9f32eb90d2ce01e16048ff5d7e33bbf5be9e215666dc40
  CARBONTEQ_TRL_WHEEL_PATH: /tmp/trl-1.12.0.post14-py3-none-any.whl
  # Wheel-only fork release; GitHub percent-encodes '+' in the asset URL.
  CARBONTEQ_CAUSAL_CONV1D_WHEEL_URL: https://github.com/carbonteq-ai/causal-conv1d/releases/download/carbonteq-v1.7.0%2Bcu130torch2.13/causal_conv1d-1.7.0%2Bcu130torch2.13-cp313-cp313-linux_x86_64.whl
  CARBONTEQ_CAUSAL_CONV1D_WHEEL_SHA256: b69f39142ac88cac91cba5f954cb616c50bc49933cd84f349319420470a4947a
  CARBONTEQ_CAUSAL_CONV1D_WHEEL_PATH: /tmp/causal_conv1d-1.7.0+cu130torch2.13-cp313-cp313-linux_x86_64.whl
  POSTTRAIN_CONSUMER_EXTRA_WHEELS: /tmp/carbonteq_trackio-0.31.5.post14.dev32-py3-none-any.whl:/tmp/trl-1.12.0.post14-py3-none-any.whl:/tmp/carbonteq_renderers-0.1.12.post1.dev3-py3-none-any.whl:/tmp/causal_conv1d-1.7.0+cu130torch2.13-cp313-cp313-linux_x86_64.whl

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Candidate promotion needs a receipt for the immutable source branch,
          # not GitHub's synthetic pull-request merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.13"
      - name: Bootstrap maintained internal distributions
        run: |
          uv venv --python 3.13
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRACKIO_WHEEL_PATH}" \
            "${CARBONTEQ_TRACKIO_WHEEL_URL}"
          echo "${CARBONTEQ_TRACKIO_WHEEL_SHA256}  ${CARBONTEQ_TRACKIO_WHEEL_PATH}" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_RENDERERS_WHEEL_PATH}" \
            "${CARBONTEQ_RENDERERS_WHEEL_URL}"
          echo "${CARBONTEQ_RENDERERS_WHEEL_SHA256}  ${CARBONTEQ_RENDERERS_WHEEL_PATH}" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRL_WHEEL_PATH}" \
            "${CARBONTEQ_TRL_WHEEL_URL}"
          echo "${CARBONTEQ_TRL_WHEEL_SHA256}  ${CARBONTEQ_TRL_WHEEL_PATH}" | sha256sum --check --strict
          VIRTUAL_ENV=.venv uv pip install --no-deps "${CARBONTEQ_TRACKIO_WHEEL_PATH}" "${CARBONTEQ_RENDERERS_WHEEL_PATH}"
      - name: Install workspace and quality tools
        # The committed lock records the internal stable index. Public runners
        # consume its hash-identical GitHub Release wheel and must not resolve
        # the private index while installing the remaining frozen lock.
        # causal-conv1d (a CUDA extension served only by the internal index) is
        # skipped: no test imports it, and it needs the images' CUDA PyTorch.
        run: |
          uv sync --frozen --all-packages --group dev --extra trl --python 3.13 \
            --no-install-package carbonteq-renderers --no-install-package carbonteq-trackio --no-install-package trl \
            --no-install-package causal-conv1d --inexact
          uv pip install --python .venv/bin/python --no-deps "${CARBONTEQ_TRL_WHEEL_PATH}"
      - name: Verify repository ownership
        run: uv run --no-sync posttrain-release repository-check
      - name: Run deterministic release readiness
        run: |
          if [[ "${GITHUB_EVENT_NAME}" = "pull_request" \
            || ( "${GITHUB_EVENT_NAME}" = "push" && "${GITHUB_REF_NAME}" = "main" ) \
            || "${{ inputs.allow_pending_runtime_lock || false }}" = "true" ]]; then
            pending_lock=--allow-pending-runtime-lock
            # Generated runtime locks are candidate materialization, not
            # authored Git state. Project them in the disposable CI checkout
            # before the test suite so dependency-changing PRs and their exact
            # merged main commit validate the closure that the protected
            # candidate builder published. Final release replays and verifies
            # that retained materialization instead of committing these locks.
            uv run --no-sync posttrain-release lock-runtime-dependencies
            uv export \
              --project tools/quantization \
              --frozen \
              --python 3.13.12 \
              --no-emit-project \
              --no-dev \
              --format requirements.txt \
              --output-file packages/runtime-images/src/posttrain/runtime_images/containers/posttrain-job-kinds/locks/transform.lock.txt
          else
            pending_lock=
          fi
          uv run --no-sync posttrain-release readiness \
            --destination .release/readiness.json \
            ${pending_lock}
      - name: Retain source-readiness receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: posttrain-readiness
          if-no-files-found: error
          path: .release/readiness.json

  package-imports:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: posttrain
            import_name: posttrain_cli
          - package: posttrain-common
            import_name: posttrain.common
          - package: posttrain-catalog
            import_name: posttrain.catalog
          - package: posttrain-data
            import_name: posttrain.data
          - package: posttrain-lab
            import_name: posttrain_lab
          - package: posttrain-eval
            import_name: posttrain.eval
          - package: posttrain-serve
            import_name: posttrain.serve
          - package: posttrain-tracking
            import_name: posttrain.tracking
          - package: posttrain-tracking-trackio
            import_name: posttrain_tracking_trackio
          - package: posttrain-tracking-wandb
            import_name: posttrain_tracking_wandb
          - package: posttrain-train
            import_name: posttrain.train
          - package: posttrain-work
            import_name: posttrain.work
          - package: posttrain-observatory
            import_name: posttrain_observatory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.13"
      - name: Bootstrap maintained internal distributions
        run: |
          uv venv --python 3.13
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRACKIO_WHEEL_PATH}" \
            "${CARBONTEQ_TRACKIO_WHEEL_URL}"
          echo "${CARBONTEQ_TRACKIO_WHEEL_SHA256}  ${CARBONTEQ_TRACKIO_WHEEL_PATH}" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_RENDERERS_WHEEL_PATH}" \
            "${CARBONTEQ_RENDERERS_WHEEL_URL}"
          echo "${CARBONTEQ_RENDERERS_WHEEL_SHA256}  ${CARBONTEQ_RENDERERS_WHEEL_PATH}" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRL_WHEEL_PATH}" \
            "${CARBONTEQ_TRL_WHEEL_URL}"
          echo "${CARBONTEQ_TRL_WHEEL_SHA256}  ${CARBONTEQ_TRL_WHEEL_PATH}" | sha256sum --check --strict
          VIRTUAL_ENV=.venv uv pip install --no-deps "${CARBONTEQ_TRACKIO_WHEEL_PATH}" "${CARBONTEQ_RENDERERS_WHEEL_PATH}"
      - name: Install package
        run: uv sync --frozen --package ${{ matrix.package }} --python 3.13 --no-install-package carbonteq-renderers --no-install-package carbonteq-trackio --inexact
      - name: Import package
        run: uv run --no-sync --package ${{ matrix.package }} python -c "import ${{ matrix.import_name }}"

  external-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.13"
      - name: Bootstrap maintained internal distributions
        run: |
          uv venv --python 3.13
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRACKIO_WHEEL_PATH}" \
            "${CARBONTEQ_TRACKIO_WHEEL_URL}"
          echo "${CARBONTEQ_TRACKIO_WHEEL_SHA256}  ${CARBONTEQ_TRACKIO_WHEEL_PATH}" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_RENDERERS_WHEEL_PATH}" \
            "${CARBONTEQ_RENDERERS_WHEEL_URL}"
          echo "${CARBONTEQ_RENDERERS_WHEEL_SHA256}  ${CARBONTEQ_RENDERERS_WHEEL_PATH}" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRL_WHEEL_PATH}" \
            "${CARBONTEQ_TRL_WHEEL_URL}"
          echo "${CARBONTEQ_TRL_WHEEL_SHA256}  ${CARBONTEQ_TRL_WHEEL_PATH}" | sha256sum --check --strict
          # The SFT starter installs posttrain[trl], which selects this rebuild.
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_CAUSAL_CONV1D_WHEEL_PATH}" \
            "${CARBONTEQ_CAUSAL_CONV1D_WHEEL_URL}"
          echo "${CARBONTEQ_CAUSAL_CONV1D_WHEEL_SHA256}  ${CARBONTEQ_CAUSAL_CONV1D_WHEEL_PATH}" | sha256sum --check --strict
          VIRTUAL_ENV=.venv uv pip install --no-deps "${CARBONTEQ_TRACKIO_WHEEL_PATH}" "${CARBONTEQ_RENDERERS_WHEEL_PATH}"
      - name: Install workspace and test tools
        run: uv sync --frozen --all-packages --group dev --python 3.13 --no-install-package carbonteq-renderers --no-install-package carbonteq-trackio --inexact
      - name: Build wheels and run outside the workspace
        run: uv run --no-sync pytest -q tests/consumer

  optional-verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.13"
      - name: Bootstrap maintained internal distributions
        run: |
          uv venv --python 3.13
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRACKIO_WHEEL_PATH}" \
            "${CARBONTEQ_TRACKIO_WHEEL_URL}"
          echo "${CARBONTEQ_TRACKIO_WHEEL_SHA256}  ${CARBONTEQ_TRACKIO_WHEEL_PATH}" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_RENDERERS_WHEEL_PATH}" \
            "${CARBONTEQ_RENDERERS_WHEEL_URL}"
          echo "${CARBONTEQ_RENDERERS_WHEEL_SHA256}  ${CARBONTEQ_RENDERERS_WHEEL_PATH}" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRL_WHEEL_PATH}" \
            "${CARBONTEQ_TRL_WHEEL_URL}"
          echo "${CARBONTEQ_TRL_WHEEL_SHA256}  ${CARBONTEQ_TRL_WHEEL_PATH}" | sha256sum --check --strict
          VIRTUAL_ENV=.venv uv pip install --no-deps "${CARBONTEQ_TRACKIO_WHEEL_PATH}" "${CARBONTEQ_RENDERERS_WHEEL_PATH}"
      - name: Install the Verifiers integration
        # gsm8k-v1 at 11f4d712 (the revision the lab catalog pins) depends on the
        # framework's Verifiers e6a3d9bb; the constraint makes any environment
        # that selects another Verifiers fail to install instead of replacing it.
        run: |
          uv sync --frozen --all-packages --extra verifiers --python 3.13 --no-install-package carbonteq-renderers --no-install-package carbonteq-trackio --inexact
          .venv/bin/python scripts/ci/locked_verifiers.py constraint > /tmp/locked-verifiers.txt
          uv pip install --python .venv/bin/python --constraint /tmp/locked-verifiers.txt \
            "gsm8k-v1 @ git+https://github.com/carbonteq-ai/verifiers-environments.git@11f4d712806d292c6c6a752af046f4e16c4f037e#subdirectory=environments/gsm8k_v1"
      - name: Require the locked Verifiers build
        run: .venv/bin/python scripts/ci/locked_verifiers.py check
      - name: Test the Verifiers bridge
        run: |
          uv run \
            --no-sync \
            --all-packages \
            --extra verifiers \
            --with pytest \
            --with pytest-asyncio \
            pytest -q \
              packages/train/tests/test_verifiers_grpo_bridge.py \
              packages/train/tests/test_trl_async_collection_runtime.py \
              packages/eval/tests/test_runtime_bootstrap.py
