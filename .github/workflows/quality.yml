name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Verify lockfile
        run: uv lock --check
      - name: Install workspace and quality tools
        run: uv sync --all-packages --group dev --python 3.12
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Check package boundaries
        run: uv run lint-imports

  package-imports:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [common, eval, reports, serve, train]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install package
        run: uv sync --package ${{ matrix.package }} --python 3.12
      - name: Import package
        run: uv run python -c "import ${{ matrix.package }}"
