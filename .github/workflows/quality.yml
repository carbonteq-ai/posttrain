name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARBONTEQ_TRACKIO_WHEEL_URL: https://github.com/carbonteq-ai/trackio/releases/download/carbonteq-v0.31.5.post10/carbonteq_trackio-0.31.5.post10-py3-none-any.whl
  CARBONTEQ_TRACKIO_WHEEL_SHA256: df549d81a9ee087e213c7d02735997707abf06b2992e8e09de57f2c840a7611d
  POSTTRAIN_CONSUMER_EXTRA_WHEELS: /tmp/carbonteq_trackio-0.31.5.post10-py3-none-any.whl

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Bootstrap the internal Trackio distribution
        run: |
          uv venv --python 3.13
          curl --fail --location --silent --show-error \
            --output "${POSTTRAIN_CONSUMER_EXTRA_WHEELS}" \
            "${CARBONTEQ_TRACKIO_WHEEL_URL}"
          echo "${CARBONTEQ_TRACKIO_WHEEL_SHA256}  ${POSTTRAIN_CONSUMER_EXTRA_WHEELS}" | sha256sum --check --strict
          VIRTUAL_ENV=.venv uv pip install --no-deps "${POSTTRAIN_CONSUMER_EXTRA_WHEELS}"
      - name: Install workspace and quality tools
        # The committed lock records the internal stable index. Public runners
        # consume its hash-identical GitHub Release wheel and must not resolve
        # the private index while installing the remaining frozen lock.
        run: uv sync --frozen --all-packages --group dev --python 3.13 --no-install-package carbonteq-trackio --inexact
      - name: Verify release metadata
        run: uv run --no-sync posttrain-release check
      - name: Verify repository ownership
        run: uv run --no-sync posttrain-release repository-check
      - name: Test
        run: uv run --no-sync pytest --cov --cov-report=term-missing
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync pyright
      - name: Check package boundaries
        run: uv run --no-sync lint-imports

  package-imports:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: posttrain
            import_name: posttrain_cli
          - package: posttrain-common
            import_name: posttrain.common
          - package: posttrain-catalog
            import_name: posttrain.catalog
          - package: posttrain-data
            import_name: posttrain.data
          - package: posttrain-lab
            import_name: posttrain_lab
          - package: posttrain-eval
            import_name: posttrain.eval
          - package: posttrain-serve
            import_name: posttrain.serve
          - package: posttrain-tracking
            import_name: posttrain.tracking
          - package: posttrain-tracking-trackio
            import_name: posttrain_tracking_trackio
          - package: posttrain-tracking-wandb
            import_name: posttrain_tracking_wandb
          - package: posttrain-train
            import_name: posttrain.train
          - package: posttrain-work
            import_name: posttrain.work
          - package: posttrain-observatory
            import_name: posttrain_observatory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Bootstrap the internal Trackio distribution
        run: |
          uv venv --python 3.13
          curl --fail --location --silent --show-error \
            --output "${POSTTRAIN_CONSUMER_EXTRA_WHEELS}" \
            "${CARBONTEQ_TRACKIO_WHEEL_URL}"
          echo "${CARBONTEQ_TRACKIO_WHEEL_SHA256}  ${POSTTRAIN_CONSUMER_EXTRA_WHEELS}" | sha256sum --check --strict
          VIRTUAL_ENV=.venv uv pip install --no-deps "${POSTTRAIN_CONSUMER_EXTRA_WHEELS}"
      - name: Install package
        run: uv sync --frozen --package ${{ matrix.package }} --python 3.13 --no-install-package carbonteq-trackio --inexact
      - name: Import package
        run: uv run --no-sync --package ${{ matrix.package }} python -c "import ${{ matrix.import_name }}"

  external-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Bootstrap the internal Trackio distribution
        run: |
          uv venv --python 3.13
          curl --fail --location --silent --show-error \
            --output "${POSTTRAIN_CONSUMER_EXTRA_WHEELS}" \
            "${CARBONTEQ_TRACKIO_WHEEL_URL}"
          echo "${CARBONTEQ_TRACKIO_WHEEL_SHA256}  ${POSTTRAIN_CONSUMER_EXTRA_WHEELS}" | sha256sum --check --strict
          VIRTUAL_ENV=.venv uv pip install --no-deps "${POSTTRAIN_CONSUMER_EXTRA_WHEELS}"
      - name: Install workspace and test tools
        run: uv sync --frozen --all-packages --group dev --python 3.13 --no-install-package carbonteq-trackio --inexact
      - name: Build wheels and run outside the workspace
        run: uv run --no-sync pytest -q tests/consumer

  optional-verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Bootstrap the internal Trackio distribution
        run: |
          uv venv --python 3.13
          curl --fail --location --silent --show-error \
            --output "${POSTTRAIN_CONSUMER_EXTRA_WHEELS}" \
            "${CARBONTEQ_TRACKIO_WHEEL_URL}"
          echo "${CARBONTEQ_TRACKIO_WHEEL_SHA256}  ${POSTTRAIN_CONSUMER_EXTRA_WHEELS}" | sha256sum --check --strict
          VIRTUAL_ENV=.venv uv pip install --no-deps "${POSTTRAIN_CONSUMER_EXTRA_WHEELS}"
      - name: Install the Verifiers integration
        run: uv sync --frozen --all-packages --extra verifiers --python 3.13 --no-install-package carbonteq-trackio --inexact
      - name: Test the Verifiers bridge
        run: |
          uv run \
            --no-sync \
            --all-packages \
            --extra verifiers \
            --with pytest \
            --with pytest-asyncio \
            pytest -q packages/train/tests/test_verifiers_grpo_bridge.py
