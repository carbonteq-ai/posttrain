name: Quality

on:
  workflow_dispatch:
    inputs:
      allow_pending_runtime_lock:
        description: Allow the protected candidate workflow to materialize a changed runtime lock
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  CARBONTEQ_TRACKIO_WHEEL_URL: https://github.com/carbonteq-ai/trackio/releases/download/carbonteq-v0.31.5.post14.dev24/carbonteq_trackio-0.31.5.post14.dev24-py3-none-any.whl
  CARBONTEQ_TRACKIO_WHEEL_SHA256: fea18a183a7493a0a1cd69218ccc2e1442cfcdbdea9c7d19f247ab7bbbf0fc21
  CARBONTEQ_TRACKIO_WHEEL_PATH: /tmp/carbonteq_trackio-0.31.5.post14.dev24-py3-none-any.whl
  CARBONTEQ_TRL_WHEEL_URL: https://github.com/carbonteq-ai/trl/releases/download/carbonteq-v1.12.0.post9/trl-1.12.0.post9-py3-none-any.whl
  CARBONTEQ_TRL_WHEEL_SHA256: c5d204da587a9a45dd279f1407d0e20816344075d001da9fe03f6dd4879fa710
  CARBONTEQ_TRL_WHEEL_PATH: /tmp/trl-1.12.0.post9-py3-none-any.whl
  POSTTRAIN_CONSUMER_EXTRA_WHEELS: /tmp/carbonteq_trackio-0.31.5.post14.dev24-py3-none-any.whl:/tmp/trl-1.12.0.post9-py3-none-any.whl

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Candidate promotion needs a receipt for the immutable source branch,
          # not GitHub's synthetic pull-request merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.13"
      - name: Bootstrap maintained internal distributions
        run: |
          uv venv --python 3.13
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRACKIO_WHEEL_PATH}" \
            "${CARBONTEQ_TRACKIO_WHEEL_URL}"
          echo "${CARBONTEQ_TRACKIO_WHEEL_SHA256}  ${CARBONTEQ_TRACKIO_WHEEL_PATH}" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRL_WHEEL_PATH}" \
            "${CARBONTEQ_TRL_WHEEL_URL}"
          echo "${CARBONTEQ_TRL_WHEEL_SHA256}  ${CARBONTEQ_TRL_WHEEL_PATH}" | sha256sum --check --strict
          VIRTUAL_ENV=.venv uv pip install --no-deps "${CARBONTEQ_TRACKIO_WHEEL_PATH}"
      - name: Install workspace and quality tools
        # The committed lock records the internal stable index. Public runners
        # consume its hash-identical GitHub Release wheel and must not resolve
        # the private index while installing the remaining frozen lock.
        run: |
          uv sync --frozen --all-packages --group dev --extra trl --python 3.13 \
            --no-install-package carbonteq-trackio --no-install-package trl --inexact
          uv pip install --python .venv/bin/python --no-deps "${CARBONTEQ_TRL_WHEEL_PATH}"
      - name: Verify repository ownership
        run: uv run --no-sync posttrain-release repository-check
      - name: Run deterministic release readiness
        run: |
          if [[ "${GITHUB_EVENT_NAME}" = "pull_request" \
            || ( "${GITHUB_EVENT_NAME}" = "push" && "${GITHUB_REF_NAME}" = "main" ) \
            || "${{ inputs.allow_pending_runtime_lock || false }}" = "true" ]]; then
            pending_lock=--allow-pending-runtime-lock
            # Generated runtime locks are candidate materialization, not
            # authored Git state. Project them in the disposable CI checkout
            # before the test suite so dependency-changing PRs and their exact
            # merged main commit validate the closure that the protected
            # candidate builder published. Final release replays and verifies
            # that retained materialization instead of committing these locks.
            uv run --no-sync posttrain-release lock-runtime-dependencies
            uv export \
              --project tools/quantization \
              --frozen \
              --python 3.13.12 \
              --no-emit-project \
              --no-dev \
              --format requirements.txt \
              --output-file packages/runtime-images/src/posttrain/runtime_images/containers/posttrain-job-kinds/locks/transform.lock.txt
          else
            pending_lock=
          fi
          uv run --no-sync posttrain-release readiness \
            --destination .release/readiness.json \
            ${pending_lock}
      - name: Retain source-readiness receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: posttrain-readiness
          if-no-files-found: error
          path: .release/readiness.json

  package-imports:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: posttrain
            import_name: posttrain_cli
          - package: posttrain-common
            import_name: posttrain.common
          - package: posttrain-catalog
            import_name: posttrain.catalog
          - package: posttrain-data
            import_name: posttrain.data
          - package: posttrain-lab
            import_name: posttrain_lab
          - package: posttrain-eval
            import_name: posttrain.eval
          - package: posttrain-serve
            import_name: posttrain.serve
          - package: posttrain-tracking
            import_name: posttrain.tracking
          - package: posttrain-tracking-trackio
            import_name: posttrain_tracking_trackio
          - package: posttrain-tracking-wandb
            import_name: posttrain_tracking_wandb
          - package: posttrain-train
            import_name: posttrain.train
          - package: posttrain-work
            import_name: posttrain.work
          - package: posttrain-observatory
            import_name: posttrain_observatory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.13"
      - name: Bootstrap maintained internal distributions
        run: |
          uv venv --python 3.13
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRACKIO_WHEEL_PATH}" \
            "${CARBONTEQ_TRACKIO_WHEEL_URL}"
          echo "${CARBONTEQ_TRACKIO_WHEEL_SHA256}  ${CARBONTEQ_TRACKIO_WHEEL_PATH}" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRL_WHEEL_PATH}" \
            "${CARBONTEQ_TRL_WHEEL_URL}"
          echo "${CARBONTEQ_TRL_WHEEL_SHA256}  ${CARBONTEQ_TRL_WHEEL_PATH}" | sha256sum --check --strict
          VIRTUAL_ENV=.venv uv pip install --no-deps "${CARBONTEQ_TRACKIO_WHEEL_PATH}"
      - name: Install package
        run: uv sync --frozen --package ${{ matrix.package }} --python 3.13 --no-install-package carbonteq-trackio --inexact
      - name: Import package
        run: uv run --no-sync --package ${{ matrix.package }} python -c "import ${{ matrix.import_name }}"

  external-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.13"
      - name: Bootstrap maintained internal distributions
        run: |
          uv venv --python 3.13
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRACKIO_WHEEL_PATH}" \
            "${CARBONTEQ_TRACKIO_WHEEL_URL}"
          echo "${CARBONTEQ_TRACKIO_WHEEL_SHA256}  ${CARBONTEQ_TRACKIO_WHEEL_PATH}" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRL_WHEEL_PATH}" \
            "${CARBONTEQ_TRL_WHEEL_URL}"
          echo "${CARBONTEQ_TRL_WHEEL_SHA256}  ${CARBONTEQ_TRL_WHEEL_PATH}" | sha256sum --check --strict
          VIRTUAL_ENV=.venv uv pip install --no-deps "${CARBONTEQ_TRACKIO_WHEEL_PATH}"
      - name: Install workspace and test tools
        run: uv sync --frozen --all-packages --group dev --python 3.13 --no-install-package carbonteq-trackio --inexact
      - name: Build wheels and run outside the workspace
        run: uv run --no-sync pytest -q tests/consumer

  optional-verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.13"
      - name: Bootstrap maintained internal distributions
        run: |
          uv venv --python 3.13
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRACKIO_WHEEL_PATH}" \
            "${CARBONTEQ_TRACKIO_WHEEL_URL}"
          echo "${CARBONTEQ_TRACKIO_WHEEL_SHA256}  ${CARBONTEQ_TRACKIO_WHEEL_PATH}" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "${CARBONTEQ_TRL_WHEEL_PATH}" \
            "${CARBONTEQ_TRL_WHEEL_URL}"
          echo "${CARBONTEQ_TRL_WHEEL_SHA256}  ${CARBONTEQ_TRL_WHEEL_PATH}" | sha256sum --check --strict
          VIRTUAL_ENV=.venv uv pip install --no-deps "${CARBONTEQ_TRACKIO_WHEEL_PATH}"
      - name: Install the Verifiers integration
        run: |
          uv sync --frozen --all-packages --extra verifiers --python 3.13 --no-install-package carbonteq-trackio --inexact
          uv pip install --python .venv/bin/python \
            "gsm8k-v1 @ git+https://github.com/carbonteq-ai/verifiers-environments.git@d994073b9632e73c96a57865683133d7a6ebc4bf#subdirectory=environments/gsm8k_v1"
      - name: Test the Verifiers bridge
        run: |
          uv run \
            --no-sync \
            --all-packages \
            --extra verifiers \
            --with pytest \
            --with pytest-asyncio \
            pytest -q \
              packages/train/tests/test_verifiers_grpo_bridge.py \
              packages/train/tests/test_trl_async_collection_runtime.py
