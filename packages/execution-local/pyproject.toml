[project]
name = "posttrain-execution-local"
version = "0.1.0"
description = "Local Docker execution provider for posttrain"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "posttrain-common",
  "posttrain-execution",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-execution = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_execution_local"]
