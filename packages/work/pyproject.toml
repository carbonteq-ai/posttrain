[project]
name = "posttrain-work"
version = "0.1.0"
description = "Reusable recipe, work-package, preflight, and run composition"
requires-python = ">=3.12,<3.13"
dependencies = [
    "posttrain-common",
    "posttrain-data",
    "posttrain-eval",
    "posttrain-tracking",
    "posttrain-train",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }
posttrain-eval = { workspace = true }
posttrain-tracking = { workspace = true }
posttrain-train = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]
