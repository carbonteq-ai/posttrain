[project]
name = "posttrain-work"
version = "0.0.0"
description = "Reusable recipe, work-package, preflight, and run composition"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common",
    "posttrain-data",
    "posttrain-environment",
    "posttrain-eval",
    "posttrain-tracking",
    "posttrain-train",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }
posttrain-environment = { workspace = true }
posttrain-eval = { workspace = true }
posttrain-tracking = { workspace = true }
posttrain-train = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
