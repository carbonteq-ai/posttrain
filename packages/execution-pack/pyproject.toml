[project]
name = "posttrain-execution-pack"
version = "0.3.0"
description = "Provider-neutral semantic planning for immutable posttrain job packages"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common==0.3.0",
    "posttrain-data==0.3.0",
    "posttrain-environment==0.3.0",
    "posttrain-eval==0.3.0",
    "posttrain-execution==0.3.0",
    "posttrain-work==0.3.0",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }
posttrain-environment = { workspace = true }
posttrain-eval = { workspace = true }
posttrain-execution = { workspace = true }
posttrain-work = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]
