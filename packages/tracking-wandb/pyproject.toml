[project]
name = "posttrain-tracking-wandb"
version = "0.1.0"
description = "Weights & Biases tracking backend for posttrain"
requires-python = ">=3.12,<3.13"
dependencies = [
    "posttrain-common",
    "posttrain-tracking",
    "pydantic>=2.12,<3",
    "wandb>=0.28.1,<0.29",
]

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-tracking = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_tracking_wandb"]
