[project]
name = "posttrain-execution-buildkit"
version = "0.1.0"
description = "BuildKit image publication adapter for posttrain job runtimes"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common",
    "posttrain-execution",
    "posttrain-execution-pack",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-execution = { workspace = true }
posttrain-execution-pack = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_execution_buildkit"]
