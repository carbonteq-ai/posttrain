[project]
name = "posttrain-tracking-trackio"
version = "0.0.0"
description = "Trackio tracking backend for posttrain"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common",
    "posttrain-tracking",
    "carbonteq-trackio==0.31.5.post14.dev18",
]

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-tracking = { workspace = true }
carbonteq-trackio = { index = "carbonteq-stable" }

[tool.posttrain.trackio]
version = "0.31.5.post14.dev18"
release-tag = "carbonteq-v0.31.5.post14.dev18"
source-revision = "21d9ebeffeae84cae95dc424b83d617a48f8d265"
wheel-sha256 = "ee988a495f9d8f1618a66fa84276a34f06c9f994017e591cc3130200bf3645ad"
sdist-sha256 = "a08f23e173de226ec092825ff3eee12221e373736c40f97fdaf37c0e99d3ad6e"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_tracking_trackio"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
