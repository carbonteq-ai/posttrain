[project]
name = "posttrain-tracking-trackio"
version = "0.0.0"
description = "Trackio tracking backend for posttrain"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common",
    "posttrain-tracking",
    "carbonteq-trackio==0.31.5.post14.dev27",
]

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-tracking = { workspace = true }
carbonteq-trackio = { index = "carbonteq-dev" }

[tool.posttrain.trackio]
version = "0.31.5.post14.dev27"
release-tag = "carbonteq-v0.31.5.post14.dev27"
source-revision = "f4d1027441449d3d59870541edb275fa859fee35"
wheel-sha256 = "228651b05e88409cb374296ad8a675057cf75377adcbe104a6fd0903b922c57c"
sdist-sha256 = "c48db39df03b4dfa4764d79d88a0bce113cd6a3c803320a61d7ef959cbc4a73a"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_tracking_trackio"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
