[project]
name = "posttrain-tracking-trackio"
version = "0.0.0"
description = "Trackio tracking backend for posttrain"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common",
    "posttrain-tracking",
    "carbonteq-trackio==0.31.5.post14.dev20",
]

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-tracking = { workspace = true }
carbonteq-trackio = { index = "carbonteq-stable" }

[tool.posttrain.trackio]
version = "0.31.5.post14.dev20"
release-tag = "carbonteq-v0.31.5.post14.dev20"
source-revision = "1f7ceba9f5728259de6cb8801a7fd8a5dcd49752"
wheel-sha256 = "60b502993e421a029f8b9e075c68ce0e5cff3a8a89fd72f6af8f138adede1fd6"
sdist-sha256 = "e48098a985673e4a6848a83879c797d767afa2b07f29790579f207993f2e6e44"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_tracking_trackio"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
