[project]
name = "posttrain-tracking-trackio"
version = "0.1.0"
description = "Trackio tracking backend for posttrain"
requires-python = ">=3.12,<3.13"
dependencies = [
    "posttrain-common",
    "posttrain-tracking",
    "carbonteq-trackio @ git+https://github.com/carbonteq-ai/trackio.git@c5072198b3b1556d31ed96ffc246a03f65418ab8",
]

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-tracking = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_tracking_trackio"]

[tool.hatch.metadata]
allow-direct-references = true
