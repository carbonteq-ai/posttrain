[project]
name = "posttrain-tracking-trackio"
version = "0.0.0"
description = "Trackio tracking backend for posttrain"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common",
    "posttrain-tracking",
    "carbonteq-trackio==0.31.5.post14.dev29",
]

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-tracking = { workspace = true }
carbonteq-trackio = { index = "carbonteq-dev" }

[tool.posttrain.trackio]
version = "0.31.5.post14.dev29"
release-tag = "carbonteq-v0.31.5.post14.dev29"
source-revision = "6b6c87ecca4ffb6cf617045ca53197aecbcbec18"
wheel-sha256 = "594084ca863a8f4aa686d59e3b005248a6a3b865d25ff910bf73fbe227c9b01d"
sdist-sha256 = "33a4b4d48fbb5b432eb8ce34f5993e24520a69f69c19ea9b9ec3cb8d5584a81f"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_tracking_trackio"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
