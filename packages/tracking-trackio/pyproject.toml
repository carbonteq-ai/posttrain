[project]
name = "posttrain-tracking-trackio"
version = "0.0.0"
description = "Trackio tracking backend for posttrain"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common",
    "posttrain-tracking",
    "carbonteq-trackio==0.31.5.post14.dev33",
]

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-tracking = { workspace = true }
carbonteq-trackio = { index = "carbonteq-dev" }

[tool.posttrain.trackio]
version = "0.31.5.post14.dev33"
release-tag = "carbonteq-v0.31.5.post14.dev33"
source-revision = "68222ffd6b64c1b0d3a540e29adcc90236416cd5"
wheel-sha256 = "431e452b29a59c5d0b78f7b01c7c888c15ecdc0ef5a74c3ad974fcf881534df3"
sdist-sha256 = "1b8ef0db089ca966aacf0953a0535b56eebd6a3bbac7e8702b05e78ae0360749"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_tracking_trackio"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
