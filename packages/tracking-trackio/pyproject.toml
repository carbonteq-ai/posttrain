[project]
name = "posttrain-tracking-trackio"
version = "0.0.0"
description = "Trackio tracking backend for posttrain"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common",
    "posttrain-tracking",
    "carbonteq-trackio==0.31.5.post14.dev19",
]

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-tracking = { workspace = true }
carbonteq-trackio = { index = "carbonteq-stable" }

[tool.posttrain.trackio]
version = "0.31.5.post14.dev19"
release-tag = "carbonteq-v0.31.5.post14.dev19"
source-revision = "b0f2ceb042dc741b458634efb5981604ead97702"
wheel-sha256 = "e92436100adc657993f7fc1e51008a4c5f6a63786c97afb2899962c872c8d5ea"
sdist-sha256 = "b310e9ed1220ce1327229bf8370b90efb6cbee578c42866435cb8c10c7c99501"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_tracking_trackio"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
