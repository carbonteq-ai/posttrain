[project]
name = "posttrain-tracking-trackio"
version = "0.0.0"
description = "Trackio tracking backend for posttrain"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common",
    "posttrain-tracking",
    "carbonteq-trackio==0.31.5.post14.dev32",
]

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-tracking = { workspace = true }
carbonteq-trackio = { index = "carbonteq-dev" }

[tool.posttrain.trackio]
version = "0.31.5.post14.dev32"
release-tag = "carbonteq-v0.31.5.post14.dev32"
source-revision = "d71cf2a5cbcc561bd72e3932d8032200a791d79c"
wheel-sha256 = "78e3ecf207c074c43281edff75343086bf379a22cc281308cc12436e5a5260a3"
sdist-sha256 = "94d3f3bb7084346f441ce39b8e9d4cd775d1197d07ca6e5fba87726dfbddddc0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_tracking_trackio"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
