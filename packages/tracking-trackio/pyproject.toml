[project]
name = "posttrain-tracking-trackio"
version = "0.0.0"
description = "Trackio tracking backend for posttrain"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common",
    "posttrain-tracking",
    "carbonteq-trackio==0.31.5.post14.dev30",
]

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-tracking = { workspace = true }
carbonteq-trackio = { index = "carbonteq-dev" }

[tool.posttrain.trackio]
version = "0.31.5.post14.dev30"
release-tag = "carbonteq-v0.31.5.post14.dev30"
source-revision = "6b6c87ecca4ffb6cf617045ca53197aecbcbec18"
wheel-sha256 = "606c10633bedcaab210565f5b77f3d595db00e2a1ba44471c16583aa9fe85859"
sdist-sha256 = "9beacecc5c5a6773350348a4d2b93ad714d68b54a68c37f1fbae9c9d9ac8b832"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_tracking_trackio"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
