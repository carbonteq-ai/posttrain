[project]
name = "posttrain-project"
version = "0.0.0"
description = "Public project application service for posttrain"
authors = [{ name = "Carbonteq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-catalog",
    "posttrain-common",
    "posttrain-execution",
    "posttrain-execution-pack",
    "posttrain-jobs",
    "posttrain-tracking",
    "posttrain-work",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-catalog = { workspace = true }
posttrain-common = { workspace = true }
posttrain-execution = { workspace = true }
posttrain-execution-pack = { workspace = true }
posttrain-jobs = { workspace = true }
posttrain-tracking = { workspace = true }
posttrain-work = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
