[project]
name = "posttrain-execution"
version = "0.1.4"
description = "Provider-neutral detached execution contracts for posttrain"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "posttrain-common==0.1.4",
  "posttrain-tracking==0.1.4",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-tracking = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]
