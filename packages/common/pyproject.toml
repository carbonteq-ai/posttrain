[project]
name = "posttrain-common"
version = "0.1.0"
description = "Framework-neutral contracts for the post-training platform"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[tool.hatch.metadata]
allow-direct-references = true
