[project]
name = "posttrain-tracking"
version = "0.1.0"
description = "Provider-neutral tracking contracts and job-aware run views"
requires-python = ">=3.12,<3.13"
dependencies = [
    "posttrain-common",
    "pydantic>=2.12,<3",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]
