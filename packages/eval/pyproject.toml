[project]
name = "posttrain-eval"
version = "0.0.0"
description = "Reusable Verifiers evaluation engine"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common",
    "posttrain-environment",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
verifiers = [
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@284a868d6a9022109b749710672a0460e8a996d4",
    "prime>=0.6",
    "torch",
    "transformers>=4.57",
    "gsm8k-v1 @ git+https://github.com/carbonteq-ai/verifiers-environments.git@b7bcb591facfcd2b073802f6d7496b24ab9c479e#subdirectory=environments/gsm8k_v1",
    "automationbench-v1 @ git+https://github.com/carbonteq-ai/verifiers-environments.git@b7bcb591facfcd2b073802f6d7496b24ab9c479e#subdirectory=environments/automationbench_v1",
    "mmlu-pro-v1 @ git+https://github.com/carbonteq-ai/verifiers-environments.git@b7bcb591facfcd2b073802f6d7496b24ab9c479e#subdirectory=environments/mmlu_pro_v1",
    "ifeval-v1 @ git+https://github.com/carbonteq-ai/verifiers-environments.git@b7bcb591facfcd2b073802f6d7496b24ab9c479e#subdirectory=environments/ifeval_v1",
    "reasoning-gym-v1 @ git+https://github.com/carbonteq-ai/verifiers-environments.git@b7bcb591facfcd2b073802f6d7496b24ab9c479e#subdirectory=environments/reasoning_gym_v1",
    "math-python-v1 @ git+https://github.com/carbonteq-ai/verifiers-environments.git@b7bcb591facfcd2b073802f6d7496b24ab9c479e#subdirectory=environments/math_python_v1",
    "reverse-text-v1 @ git+https://github.com/PrimeIntellect-ai/verifiers.git@284a868d6a9022109b749710672a0460e8a996d4#subdirectory=environments/reverse_text_v1",
    "code-golf-v1 @ git+https://github.com/PrimeIntellect-ai/verifiers.git@284a868d6a9022109b749710672a0460e8a996d4#subdirectory=environments/code_golf_v1",
    "alphabet-sort-v1 @ git+https://github.com/PrimeIntellect-ai/verifiers.git@284a868d6a9022109b749710672a0460e8a996d4#subdirectory=environments/alphabet_sort_v1",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-environment = { workspace = true }
torch = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
