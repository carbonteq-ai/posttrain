[project]
name = "posttrain-catalog"
version = "0.1.0"
description = "Versioned framework catalog assets and composed catalog loader"
requires-python = ">=3.12,<3.13"
dependencies = [
    "posttrain-common",
    "posttrain-eval",
    "posttrain-train",
    "pyyaml>=6.0,<7",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-eval = { workspace = true }
posttrain-train = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]
