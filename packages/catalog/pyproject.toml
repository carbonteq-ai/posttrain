[project]
name = "posttrain-catalog"
version = "0.2.0"
description = "Versioned framework catalog assets and composed catalog loader"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "posttrain-common",
    "posttrain-data",
    "posttrain-eval",
    "posttrain-train",
    "pyyaml>=6.0,<7",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }
posttrain-eval = { workspace = true }
posttrain-train = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
