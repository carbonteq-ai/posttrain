environment:
  automationbench-zapier-simple-grpo:
    category: agentic-tool-use
    source:
      package: automationbench-v1
      repository: https://github.com/carbonteq-ai/verifiers-environments
      revision: b7bcb591facfcd2b073802f6d7496b24ab9c479e
      subdirectory: environments/automationbench_v1
    activation:
      kind: verifiers-config
      config:
        taskset:
          id: automationbench-v1
        harness:
          id: "null"
          runtime:
            type: subprocess
        timeout:
          setup: 120
          rollout: 1800
          finalize: 60
          scoring: 120
        max_turns: 50
        max_total_tokens: 8192
    sampling:
      max_tokens: 6144
      temperature: 1.0
      top_p: 0.95
    num_tasks: 2
    num_rollouts: 8
    max_concurrent: 1
    parameters:
      domains: [simple]
      sampling_seed: 17
      toolset: zapier
      search_top_k: 20
      max_turns: 50
      max_total_tokens: 8192
      rollout_timeout_seconds: 1800
    reward_components:
      - partial_credit
    required_inference_capabilities: [tool-calling]
    observation:
      primary_metric: partial_credit
      pass_rate_metric: task_completed_correctly
      facets:
        - field: domain
          dimension: domain
          label: Domain
