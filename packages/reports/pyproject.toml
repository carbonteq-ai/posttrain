[project]
name = "reports"
version = "0.1.0"
description = "Read-only reporting and raw-query tools for Trackio evidence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "posttrain-common[legacy]",
    "trackio @ git+https://github.com/carbonteq-ai/trackio.git@02351d871050bf4b3505c7371239c698b710ec83",
]

[project.scripts]
trackio-query = "reports.query:main"

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reports"]

[tool.hatch.metadata]
allow-direct-references = true
