[project]
name = "posttrain-serve"
version = "0.0.0"
description = "Reusable vLLM serving and inference benchmark operations"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "posttrain-common",
]

[project.entry-points."vllm.general_plugins"]
lab-serve-compat = "posttrain.serve.vllm_compat:apply_vllm_compatibility_patches"

[project.optional-dependencies]
vllm = [
    "torch",
    "torchvision",
    "torchaudio",
    "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
    "nvidia-ml-py>=13.580.82; sys_platform == 'linux'",
    "ninja>=1.13",
    "vllm @ git+https://github.com/carbonteq-ai/vllm.git@564ff2b43d499f5d17bcee554d126360b768dd98",
    "vllm-spark2-5-plugin",
]
[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
torch = { url = "https://download-r2.pytorch.org/whl/cu130/torch-2.13.0%2Bcu130-cp313-cp313-manylinux_2_28_x86_64.whl" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
vllm-spark2-5-plugin = { git = "https://github.com/XHToken/Spark-plugin.git", rev = "3e1040e63a5907e4c748a485d6795d739dcd5bd6" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
