[project]
name = "posttrain-serve"
version = "0.1.5"
description = "Reusable vLLM serving and inference benchmark operations"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "posttrain-common==0.1.5",
]

[project.entry-points."vllm.general_plugins"]
lab-serve-compat = "posttrain.serve.vllm_compat:apply_vllm_compatibility_patches"

[project.optional-dependencies]
vllm = [
    "torch",
    "torchvision",
    "torchaudio",
    "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
    "nvidia-ml-py>=13.580.82; sys_platform == 'linux'",
    "ninja>=1.13",
    "vllm==0.25.1",
]
[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
