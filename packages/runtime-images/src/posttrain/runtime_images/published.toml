# Published runtime image manifest.
#
# Records the exact identity of the base and job-kind images that were built
# from the definitions shipped alongside this file. Consumers pull these
# digests; they do not build unless a digest is unreachable and they opt in.
#
# `lock_digest` is the SHA-256 of the referenced `constraint_lock` bytes and is
# the value published as the `org.carbonteq.posttrain.lock-digest` OCI label.
# It is regenerated by `posttrain runtime images publish`, never hand-typed:
# hand transcription is what previously let a fixed framework pin and a stale
# job-kind image disagree without anything detecting it.
#
# `default_prefix` is where the FRAMEWORK publishes, once per release. It is a
# property of the framework and is the same for every consumer. It is not a
# project's registry: a project pushes its own actual-job images to
# POSTTRAIN_REGISTRY, which may also serve as a mirror for these base and kind
# images at sites that cannot reach the public registry. The two are separate
# axes and must not be conflated.
#
# Image digests are content-addressed, so a digest-level mirror
# (`imagetools create`) copies an image between registries unchanged. The
# digests below therefore stay valid under any mirror prefix.
#
# NOTE: these digests are not yet reachable under `default_prefix`. They record
# the exact images this release consists of, built and verified locally. The
# framework's release tooling pushes them to the public registry and rewrites
# this file; `posttrain runtime images verify` fails until it has. That failure
# is correct, not a defect. Publishing is an owner operation and is not part of
# the consumer CLI.

schema_version = 1
framework_version = "0.1.0"
default_prefix = "ghcr.io/carbonteq-ai"

# `online-rl-verl-py313` is deliberately absent. It remains release-blocked and
# is qualified out of band; it is not part of the published release set.

[base]
repository = "posttrain-base"
