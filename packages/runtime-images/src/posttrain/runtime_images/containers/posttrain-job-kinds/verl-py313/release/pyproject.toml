[project]
name = "posttrain-kind-online-rl-verl-py313"
version = "0.1.0"
description = "Dependency-only Python 3.13.12 lock for the online-rl-verl-py313 kind image"
requires-python = "==3.13.12"
dependencies = [
    "accelerate>=1.14,<1.15",
    "codetiming>=1.4,<1.5",
    "datasets>=4.5,<5",
    "dill>=0.4,<0.5",
    "fastapi>=0.135,<0.136",
    "hydra-core>=1.3,<1.4",
    "latex2sympy2-extended>=1.10,<2",
    "liger-kernel>=0.7,<0.8",
    "math-verify>=0.9,<1",
    "numpy>=2,<3",
    "orjson>=3.11,<4",
    "packaging>=20",
    "pandas>=2.3,<3",
    "peft>=0.19,<0.20",
    "pyarrow>=19",
    "pybind11>=3,<4",
    "pylatexenc>=2.10,<3",
    "ray[default]==2.56.1",
    "tensorboard>=2.20,<3",
    "tensordict==0.10.0",
    "torch==2.11.0+cu130",
    "torchaudio==2.11.0+cu130",
    "torchdata>=0.11,<0.12",
    "torchvision==0.26.0+cu130",
    "transferqueue==0.1.8",
    "transformers==5.14.1",
    "uvicorn>=0.41,<0.42",
    "verl",
    "verifiers",
    "vllm==0.25.1",
    "wandb>=0.28,<0.29",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git", rev = "284a868d6a9022109b749710672a0460e8a996d4" }
verl = { git = "https://github.com/carbonteq-ai/verl.git", rev = "1dcdf67e9473db5297c98c9c88cf4dae6c4a8932" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
