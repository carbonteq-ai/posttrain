[worker_projection]
# Namespace-package source projections, not a second installation of the
# framework distributions. Installing them would drag their external
# dependencies into this environment, and those conflict: the backend requires
# liger-kernel>=0.7,<0.8 while posttrain-train[trl] pins 0.8.0, so the two
# closures cannot be resolved together. The separate environment is dependency
# isolation and survives both interpreters being the same version.
packages = ["common", "data", "environment", "train"]
