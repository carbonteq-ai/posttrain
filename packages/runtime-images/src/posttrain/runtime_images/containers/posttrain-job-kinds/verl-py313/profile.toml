# kind smokes and bounded GPU qualifications completed on the maintained
# runtime, including two-step distillation run
# verl-distill-shared-pool-retentionfix-20260730 on the 96 GB worker. The
# 2026-07-30 release decision promotes this profile into the publication graph.
fork_revision = "a6fe39c22719ec981ed8544ad8feffd59995cc13"
dependency_lock_sha256 = "df7769f306ef8606fed37fd89c3fa2589ac72f39a45e4743816368a1acffe69f"
