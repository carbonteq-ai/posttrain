schema_version = 1
profile_id = "online-rl-verl-py313"
job_kind = "online-rl"
release_status = "blocked"
control_python = "3.13.12"
backend_python = "3.13.12"
control_virtual_env = "/opt/posttrain/venv"
backend_virtual_env = "/opt/posttrain-verl"
backend_working_directory = "/opt/posttrain-verl/workdir"
backend_projection_path = "/opt/posttrain-verl/projection"
backend_pythonpath_variable = "POSTTRAIN_VERL_PYTHONPATH"
backend_worker_module = "posttrain.train.backends.verl.worker"
control_environment_lock_path = "locks/runtime.control.requirements.txt"
backend_environment_lock_path = "locks/runtime.backend.requirements.txt"
backend_dependency_lock_path = "/opt/posttrain-verl/release/uv.lock"
source_repository = "https://github.com/carbonteq-ai/verl.git"
upstream_revision = "a35908ca3c9632859c58d6a2855d858918ae21dc"

# The fork commit and dependency-only Python 3.13.12 lock exist. Kind smoke and
# a bounded pop-os GRPO capsule qualification succeeded (run
# fe09f04a-35f1-4aa0-8c42-d8de374eabda). Keep release_status blocked and omit
# the production Bake publication graph until an explicit unblock decision.
fork_revision = "1dcdf67e9473db5297c98c9c88cf4dae6c4a8932"
dependency_lock_sha256 = "0e293b1d7beadc0e9548481236117c8fe6a888b7806029f054ee68935362f8f8"
[dependencies]
torch = "2.11.0+cu130"
transformers = "5.14.1"
vllm = "0.25.1"
ray = "2.56.1"
tensordict = "0.10.0"
verifiers_revision = "284a868d6a9022109b749710672a0460e8a996d4"

[worker_projection]
# Namespace-package source projections, not a second installation of the
# framework distributions. Installing them would drag their external
# dependencies into this environment, and those conflict: the backend requires
# liger-kernel>=0.7,<0.8 while posttrain-train[trl] pins 0.8.0, so the two
# closures cannot be resolved together. The separate environment is dependency
# isolation and survives both interpreters being the same version.
packages = ["common", "data", "train"]
