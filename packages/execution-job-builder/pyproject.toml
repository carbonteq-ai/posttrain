[project]
name = "posttrain-execution-job-builder"
version = "0.0.0"
description = "Remote developer job-builder adapter for immutable Posttrain job images"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "posttrain-common",
    "posttrain-execution-pack",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-execution-pack = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_execution_job_builder"]
