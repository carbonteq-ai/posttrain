[project]
name = "posttrain-jobs"
version = "0.1.11"
description = "Standard post-training job definitions and project runtime composition"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "posttrain-common==0.1.11",
    "posttrain-data==0.1.11",
    "posttrain-eval==0.1.11",
    "posttrain-serve==0.1.11",
    "posttrain-tracking==0.1.11",
    "posttrain-tracking-trackio==0.1.11",
    "posttrain-tracking-wandb==0.1.11",
    "posttrain-train==0.1.11",
    "posttrain-work==0.1.11",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }
posttrain-eval = { workspace = true }
posttrain-serve = { workspace = true }
posttrain-tracking = { workspace = true }
posttrain-tracking-trackio = { workspace = true }
posttrain-tracking-wandb = { workspace = true }
posttrain-train = { workspace = true }
posttrain-work = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
