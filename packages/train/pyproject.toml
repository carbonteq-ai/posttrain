[project]
name = "posttrain-train"
version = "0.0.0"
description = "Reusable backend-neutral post-training engine"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<0.29",
    "posttrain-common",
    "posttrain-data",
    "posttrain-environment",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
verifiers = [
    "verifiers @ git+https://github.com/carbonteq-ai/verifiers.git@e6a3d9bbfe6959b97878f451fc721793a232cd5f",
]
trl = [
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
    "transformers>=5.14,<5.15",
    "trl==1.12.0.post12",
    "peft>=0.19,<0.20",
    "datasets>=4.6.1,<4.7",
    "accelerate>=1.14,<1.15",
    "bitsandbytes>=0.49,<0.50",
    "carbonteq-renderers==0.1.12.post1.dev2",
    "liger-kernel>=0.8.2,<0.9",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=7.35,<8",
    "huggingface-hub>=1.31,<1.32",
    # AsyncGRPO uses Transformers' Hub-hosted FlashAttention kernel directly.
    "kernels>=0.15.2,<0.16",
    # Triton gated-delta-rule and gated-RMSNorm kernels (import `fla`) for
    # Qwen3.5-style Gated DeltaNet layers; without them Transformers falls
    # back to its slow torch implementation. vLLM vendors the same kernels.
    "fla-core>=0.5.2,<0.6",
    "causal-conv1d==1.7.0+cu130torch2.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
trl-vllm = [
    "aiohttp>=3.13,<4",
    "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
    "vllm @ git+https://github.com/carbonteq-ai/vllm.git@f09e4479123d348cee87d217c695a22f9b2daacc",
]

[tool.uv]
package = true

[tool.uv.sources]
causal-conv1d = { index = "carbonteq-dev" }
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }
posttrain-environment = { workspace = true }
torch = { url = "https://download-r2.pytorch.org/whl/cu130/torch-2.13.0%2Bcu130-cp313-cp313-manylinux_2_28_x86_64.whl" }
torchvision = { index = "pytorch-cu130" }
trl = { index = "carbonteq-dev" }
carbonteq-renderers = { index = "carbonteq-dev" }

[tool.posttrain.trl]
version = "1.12.0.post12"
release-tag = "carbonteq-v1.12.0.post12"
source-revision = "c4d0db051a7839fe1b1d587185fac33ba88c784f"
wheel-sha256 = "7fb9b9c3805e65cb064a1789060d40f4ebe3b31833840f1f439c51241de0029d"
sdist-sha256 = "81d60f035864a36d4c65b429504c58bce47beed3f9a530abec0c2dd08b4142ce"

[tool.posttrain.renderers]
version = "0.1.12.post1.dev2"
release-tag = "carbonteq-v0.1.12.post1.dev2"
source-revision = "6f712616fa88073919827a695af4f318b8c2d24e"
wheel-sha256 = "fdc65e9ed1a8a2f877c127a3456834d5ded996f32a4c70fe22bebe615073a87e"
sdist-sha256 = "2c83d94bd1fd81f5fdfe95cd8390ac1d5057355bc278bf14e642ab3f8b2c26bd"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"

# CarbonTeq rebuild of unmodified upstream causal-conv1d v1.7.0 for PyTorch
# 2.13.0+cu130 (tools/kernel-wheels/causal-conv1d). A wheel-only fork release:
# the retained CPython 3.13 x86_64 wheel is the identity; there is no sdist.
[tool.posttrain.causal-conv1d]
version = "1.7.0+cu130torch2.13"
release-tag = "carbonteq-v1.7.0+cu130torch2.13"
source-revision = "b7bec200ce1391f69fac132bf7f8ae007446d46d"
wheel-filename = "causal_conv1d-1.7.0+cu130torch2.13-cp313-cp313-linux_x86_64.whl"
wheel-sha256 = "b69f39142ac88cac91cba5f954cb616c50bc49933cd84f349319420470a4947a"
