[project]
name = "posttrain-train"
version = "0.0.0"
description = "Reusable backend-neutral post-training engine"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<0.29",
    "posttrain-common",
    "posttrain-data",
    "posttrain-environment",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
verifiers = [
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@284a868d6a9022109b749710672a0460e8a996d4",
]
trl = [
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "transformers>=5.14,<5.15",
    "trl==1.12.0.post2",
    "peft>=0.19,<0.20",
    "datasets>=4.6.1,<4.7",
    "accelerate>=1.14,<1.15",
    "bitsandbytes>=0.49,<0.50",
    "renderers==0.1.8",
    "liger-kernel>=0.8.2,<0.9",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=7.35,<8",
    "huggingface-hub>=1.24,<1.25",
]
trl-vllm = [
    "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
    "vllm==0.25.1",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }
posttrain-environment = { workspace = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
trl = { index = "carbonteq-stable" }

[tool.posttrain.trl]
version = "1.12.0.post2"
release-tag = "carbonteq-v1.12.0.post2"
source-revision = "95a787b6c04f91a5d485fd827d31b1e1fb67ae8e"
wheel-sha256 = "8b19cd7fad5a28cf9ced4a7fac93bfaaedaac154faf019a3d3dd6abeaaa45c26"
sdist-sha256 = "0f6407d8280d59b433ef28ed5d007ddde95bb064cd28f12661fa8e59ef2e67c9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
