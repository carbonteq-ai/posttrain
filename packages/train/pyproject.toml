[project]
name = "posttrain-train"
version = "0.0.0"
description = "Reusable backend-neutral post-training engine"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<0.29",
    "posttrain-common",
    "posttrain-data",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
verifiers = [
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@284a868d6a9022109b749710672a0460e8a996d4",
]
trl = [
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "transformers>=5.14,<5.15",
    "trl==1.9.2.post3",
    "peft>=0.19,<0.20",
    "datasets>=4.6.1,<4.7",
    "accelerate>=1.14,<1.15",
    "bitsandbytes>=0.49,<0.50",
    "renderers==0.1.8",
    "liger-kernel>=0.8,<0.9",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=7.35,<8",
    "huggingface-hub>=1.24,<1.25",
]
trl-vllm = [
    "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
    "vllm==0.25.1",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
trl = { git = "https://github.com/carbonteq-ai/trl.git", rev = "303998a5738fe4fb4e9bb6087c17a9462fed6384" }

[tool.posttrain.trl]
version = "1.9.2.post3"
release-tag = "carbonteq-v1.9.2.post3"
source-revision = "303998a5738fe4fb4e9bb6087c17a9462fed6384"
wheel-sha256 = "7df9057d03aeeab4bdd00a8fad69b2939a864e5c8a684515359e06b01069c501"
sdist-sha256 = "69c103377138287256ecd801a4394c8f0cbc4c1f19bdb33626db1e2464d22d4a"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
