[project]
name = "posttrain-train"
version = "0.0.0"
description = "Reusable backend-neutral post-training engine"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<0.29",
    "posttrain-common",
    "posttrain-data",
    "posttrain-environment",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
verifiers = [
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@284a868d6a9022109b749710672a0460e8a996d4",
]
trl = [
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "transformers>=5.14,<5.15",
    "trl==1.9.2.post11",
    "peft>=0.19,<0.20",
    "datasets>=4.6.1,<4.7",
    "accelerate>=1.14,<1.15",
    "bitsandbytes>=0.49,<0.50",
    "renderers==0.1.8",
    "liger-kernel>=0.8,<0.9",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=7.35,<8",
    "huggingface-hub>=1.24,<1.25",
]
trl-vllm = [
    "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
    "vllm==0.25.1",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }
posttrain-environment = { workspace = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
trl = { index = "carbonteq-stable" }

[tool.posttrain.trl]
version = "1.9.2.post11"
release-tag = "carbonteq-v1.9.2.post11"
source-revision = "69cf80a7319079ec5523841553467e119ebc1cec"
wheel-sha256 = "ae95f7787936f7e944766611c5545048b7710bf34e7404bb1e1a027698aa604a"
sdist-sha256 = "a48df92892129243b80f87b3c6a46ea4bdb8ad8f6cebc18be09f6fdbbfe4fd2a"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
