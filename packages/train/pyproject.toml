[project]
name = "train"
version = "0.1.0"
description = "Reusable TRL training engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "posttrain-common[legacy]",
    "torch",
    "torchvision",
    "torchaudio",
    "transformers>=4.57",
    "trl==1.8.0",
    "peft>=0.15",
    "datasets>=3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "sentencepiece",
    "protobuf",
    "huggingface-hub",
    "trackio",
]

[project.optional-dependencies]
vllm = [
    "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
    "vllm==0.25.1",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
trl = { git = "https://github.com/carbonteq-ai/trl.git", rev = "935060f640f5195fe62f1acc300c16db327a32b9" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/train"]
