[project]
name = "posttrain-train"
version = "0.1.0"
description = "Reusable TRL training engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "posttrain-common",
]

[project.optional-dependencies]
trl = [
    "torch",
    "torchvision",
    "transformers>=5.0",
    "trl==1.8.0",
    "peft>=0.19",
    "datasets>=4.6.1,<4.7",
    "accelerate>=1.10",
    "bitsandbytes>=0.49",
    "renderers==0.1.8",
    "sentencepiece",
    "protobuf",
    "huggingface-hub",
]
trl-vllm = [
    "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
    "vllm==0.25.1",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
trl = { git = "https://github.com/carbonteq-ai/trl.git", rev = "d726190b2f0a399e5a13f69584617efd0e7fcf00" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]
