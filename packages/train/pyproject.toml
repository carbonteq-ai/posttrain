[project]
name = "posttrain-train"
version = "0.0.0"
description = "Reusable backend-neutral post-training engine"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<0.29",
    "posttrain-common",
    "posttrain-data",
    "posttrain-environment",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
verifiers = [
    "verifiers @ git+https://github.com/carbonteq-ai/verifiers.git@cdd2ec7614131545df66484f9de11250daf16065",
]
trl = [
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
    "transformers>=5.14,<5.15",
    "trl==1.12.0.post9",
    "peft>=0.19,<0.20",
    "datasets>=4.6.1,<4.7",
    "accelerate>=1.14,<1.15",
    "bitsandbytes>=0.49,<0.50",
    "carbonteq-renderers==0.1.12.post1.dev1",
    "liger-kernel>=0.8.2,<0.9",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=7.35,<8",
    "huggingface-hub>=1.31,<1.32",
    # AsyncGRPO uses Transformers' Hub-hosted FlashAttention kernel directly.
    "kernels>=0.15.2,<0.16",
]
trl-vllm = [
    "aiohttp>=3.13,<4",
    "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
    "vllm @ git+https://github.com/carbonteq-ai/vllm.git@f09e4479123d348cee87d217c695a22f9b2daacc",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }
posttrain-environment = { workspace = true }
torch = { url = "https://download-r2.pytorch.org/whl/cu130/torch-2.13.0%2Bcu130-cp313-cp313-manylinux_2_28_x86_64.whl" }
torchvision = { index = "pytorch-cu130" }
trl = { index = "carbonteq-dev" }
carbonteq-renderers = { index = "carbonteq-dev" }

[tool.posttrain.trl]
version = "1.12.0.post9"
release-tag = "carbonteq-v1.12.0.post9"
source-revision = "3b7a582e011a32de74d1f2b6e572b794360fbfd7"
wheel-sha256 = "c5d204da587a9a45dd279f1407d0e20816344075d001da9fe03f6dd4879fa710"
sdist-sha256 = "146e46b37f6795a206d684e286e137edb1eec673b658d0168d45c603870156fa"

[tool.posttrain.renderers]
version = "0.1.12.post1.dev1"
release-tag = "carbonteq-v0.1.12.post1.dev1"
source-revision = "6aba28a8c9a597475addc2c123dd18b28a462766"
wheel-sha256 = "2e3231784729b9177bfc25eb06e3a6a958f9ba420ff8e241c010266cc9422d0b"
sdist-sha256 = "bf529fc910f66494770a96e0ee5ec986344ed5f8b48258b50a55b82baa876fa3"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
