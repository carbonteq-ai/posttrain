[project]
name = "posttrain-train"
version = "0.0.0"
description = "Reusable backend-neutral post-training engine"
authors = [{ name = "CarbonTeq" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<0.29",
    "posttrain-common",
    "posttrain-data",
    "posttrain-environment",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
verifiers = [
    "verifiers @ git+https://github.com/carbonteq-ai/verifiers.git@36eac9d5e04ef29b584b6fa4f027af00cd76ea19",
]
trl = [
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "transformers>=5.14,<5.15",
    "trl==1.12.0.post6",
    "peft>=0.19,<0.20",
    "datasets>=4.6.1,<4.7",
    "accelerate>=1.14,<1.15",
    "bitsandbytes>=0.49,<0.50",
    "renderers==0.1.12.dev3",
    "liger-kernel>=0.8.2,<0.9",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=7.35,<8",
    "huggingface-hub>=1.24,<1.25",
    # AsyncGRPO uses Transformers' Hub-hosted FlashAttention kernel directly.
    "kernels>=0.15.2,<0.16",
]
trl-vllm = [
    "aiohttp>=3.13,<4",
    "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
    "vllm==0.25.1",
]

[tool.uv]
package = true

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }
posttrain-environment = { workspace = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
trl = { index = "carbonteq-dev" }

[tool.posttrain.trl]
version = "1.12.0.post6"
release-tag = "carbonteq-v1.12.0.post6"
source-revision = "526e284922a0e4d92d7920916398d8be8d36aa85"
wheel-sha256 = "57aef51b31fa6e0bfbcd942bddd62bf995f5c2f82e3107bb91cdba7436a1366c"
sdist-sha256 = "68365d87107b1df3b2fe8227ab64afaceb37a9ce5fd3a8b3c5b6894d5e49d13e"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://github.com/carbonteq-ai/posttrain#readme"
Issues = "https://github.com/carbonteq-ai/posttrain/issues"
Repository = "https://github.com/carbonteq-ai/posttrain"
