[project]
name = "lab"
version = "0.1.0"
description = "Local post-training lab (uv workspace)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "posttrain-common",
    "posttrain-data",
]

[dependency-groups]
dev = [
    "import-linter>=2.3",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[tool.uv.sources]
posttrain-common = { workspace = true }
posttrain-data = { workspace = true }

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv]
package = false

[tool.posttrain.pack]
project_packages = ["apps/lab"]
source_includes = ["apps/lab"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
testpaths = [
    "apps/cli/tests",
    "apps/lab/tests",
    "apps/observatory/tests",
    "apps/runtime/tests",
    "packages/catalog/tests",
    "packages/common/tests",
    "packages/data/tests",
    "packages/eval/tests",
    "packages/execution/tests",
    "packages/execution-buildkit/tests",
    "packages/execution-pack/tests",
    "packages/execution-dstack/tests",
    "packages/execution-local/tests",
    "packages/jobs/tests",
    "packages/runtime-images/tests",
    "packages/serve/tests",
    "packages/tracking/tests",
    "packages/tracking-trackio/tests",
    "packages/tracking-wandb/tests",
    "packages/train/tests",
    "packages/work/tests",
]
asyncio_mode = "auto"
markers = [
    "docker: requires a local Docker daemon and image runtime",
    "gpu: requires a compatible CUDA GPU and model runtime",
    "network: requires external network access",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", ".venvs", "outputs", "checkpoints"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["B017"]

[tool.ruff.lint.isort]
known-third-party = ["trackio", "wandb"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["apps", "packages", "tests"]
exclude = ["**/__pycache__", ".venv", ".venvs"]
reportMissingImports = false
reportMissingTypeStubs = "none"

[tool.coverage.run]
branch = true
source = [
    "posttrain_cli",
    "posttrain_lab",
    "posttrain",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 65

[tool.importlinter]
root_packages = ["posttrain", "posttrain_cli", "posttrain_lab", "posttrain_observatory", "posttrain_runtime"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Reusable capability packages are independent"
type = "independence"
modules = ["posttrain.eval", "posttrain.serve", "posttrain.train"]

[[tool.importlinter.contracts]]
name = "New common contracts do not import execution frameworks"
type = "forbidden"
source_modules = ["posttrain.common"]
forbidden_modules = ["trackio", "trl", "verifiers", "vllm"]

[[tool.importlinter.contracts]]
name = "Canonical data contracts do not import execution frameworks"
type = "forbidden"
source_modules = ["posttrain.data"]
forbidden_modules = ["posttrain.eval", "posttrain.serve", "posttrain.train", "trackio", "trl", "vllm", "yaml"]

[[tool.importlinter.contracts]]
name = "Reusable packages do not import the lab application"
type = "forbidden"
source_modules = ["posttrain"]
forbidden_modules = ["posttrain_lab"]

[[tool.importlinter.contracts]]
name = "Observatory reads providers only through tracking adapters"
type = "forbidden"
source_modules = ["posttrain_observatory"]
forbidden_modules = ["trackio", "wandb"]

[[tool.importlinter.contracts]]
name = "Serving is independent of observation and legacy configuration"
type = "forbidden"
source_modules = ["posttrain.serve"]
forbidden_modules = ["trackio", "yaml", "common"]

[[tool.importlinter.contracts]]
name = "Evaluation is endpoint neutral and observation independent"
type = "forbidden"
source_modules = ["posttrain.eval"]
forbidden_modules = ["posttrain.serve", "vllm", "trackio", "yaml", "common"]

[[tool.importlinter.contracts]]
name = "Training is observation and serving independent"
type = "forbidden"
source_modules = ["posttrain.train"]
forbidden_modules = ["posttrain.eval", "posttrain.serve", "trackio", "vllm", "yaml", "common"]
