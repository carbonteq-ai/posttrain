[project]
name = "lab"
version = "0.1.0"
description = "Local post-training lab (uv workspace)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "posttrain-common[legacy]",
]

[dependency-groups]
dev = [
    "import-linter>=2.3",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[tool.uv.sources]
posttrain-common = { workspace = true }

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv]
package = false
conflicts = [
    # TRL 1.8 needs datasets>=4.7; Verifiers 0.2 needs datasets<4.7
    [
        { package = "posttrain-train" },
        { package = "posttrain-eval", extra = "verifiers" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "docker: requires a local Docker daemon and image runtime",
    "gpu: requires a compatible CUDA GPU and model runtime",
    "network: requires external network access",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", ".venvs", "runs", "outputs", "checkpoints"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["apps", "packages", "tests"]
exclude = ["**/__pycache__", ".venv", ".venvs"]
reportMissingTypeStubs = "none"

[tool.coverage.run]
branch = true
source = [
    "common",
    "posttrain_lab",
    "posttrain",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 60

[tool.importlinter]
root_packages = ["common", "posttrain", "posttrain_lab"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Reusable capability packages are independent"
type = "independence"
modules = ["posttrain.eval", "posttrain.reports", "posttrain.serve", "posttrain.train"]

[[tool.importlinter.contracts]]
name = "New common contracts do not import execution frameworks"
type = "forbidden"
source_modules = ["posttrain.common"]
forbidden_modules = ["trackio", "trl", "verifiers", "vllm"]

[[tool.importlinter.contracts]]
name = "Reusable packages do not import the lab application"
type = "forbidden"
source_modules = ["posttrain", "common"]
forbidden_modules = ["posttrain_lab"]
